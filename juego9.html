<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Money up gemas</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#090604;
}

#game{
    position:fixed;
    inset:0;
}

#hud{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    gap:8px;
    padding:7px;
    border-radius:18px;
    background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(10px);
}

.stat{
    min-width:82px;
    padding:9px 13px;
    border-radius:12px;
    background:rgba(0,0,0,.7);
    text-align:center;
    font-size:19px;
    font-weight:900;
}

.diamond{color:#61eaff}
.shield{color:#74a9ff}
.time{color:#fff}

#special{
    position:fixed;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    display:none;
    padding:8px 15px;
    border-radius:14px;
    background:rgba(25,100,255,.82);
    font-weight:900;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

#controles{
    position:fixed;
    left:0;
    right:0;
    bottom:20px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
    pointer-events:none;
}

.lado{
    display:flex;
    gap:12px;
    pointer-events:auto;
}

.control{
    width:82px;
    height:72px;
    border:2px solid rgba(255,255,255,.25);
    border-radius:21px;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:36px;
    font-weight:900;
    box-shadow:0 8px 25px rgba(0,0,0,.45);
    touch-action:none;
}

.control:active{
    transform:scale(.93);
}

#saltar{
    width:100px;
    font-size:20px;
}

#mensaje{
    position:fixed;
    left:50%;
    bottom:108px;
    transform:translateX(-50%);
    z-index:25;
    padding:10px 18px;
    border-radius:15px;
    background:rgba(0,0,0,.75);
    font-weight:800;
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
}

.panel{
    width:min(90vw,430px);
    padding:30px;
    border-radius:25px;
    text-align:center;
    background:linear-gradient(145deg,#17120e,#080706);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 25px 80px rgba(0,0,0,.8);
}

.panel h1{
    margin:0 0 10px;
    font-size:43px;
}

.panel p{
    color:#c9c9c9;
    line-height:1.6;
}

.reiniciar{
    margin-top:12px;
    padding:14px 28px;
    border:0;
    border-radius:15px;
    background:#f2a900;
    color:#17100a;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div class="stat diamond">💎 <span id="diamantes">0</span></div>
    <div class="stat shield">🛡️ <span id="escudos">0</span></div>
    <div class="stat time">⏱️ <span id="tiempo">0:00</span></div>
</div>

<div id="special">
    ⛏️ PERSONAJE ESPECIAL DESBLOQUEADO
</div>

<div id="mensaje"></div>

<div id="controles">

    <div class="lado">
        <button class="control" id="izquierda">←</button>
        <button class="control" id="derecha">→</button>
    </div>

    <div class="lado">
        <button class="control" id="saltar">SALTAR</button>
    </div>

</div>

<div id="gameOver">
    <div class="panel">
        <h1>💥 HAS MUERTO</h1>
        <p>
            Las rocas han acabado con la partida.
        </p>
        <p>
            Diamantes conseguidos:
            <strong id="resultado"></strong>
        </p>
        <button class="reiniciar" onclick="location.reload()">
            VOLVER A JUGAR
        </button>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

/* =========================================================
   ESCENA
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8bb7d9);

scene.fog = new THREE.Fog(

   CÁMARA
========================================================= */

camera.position.set(
    0,

   RENDER

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(

    innerHeight
);

renderer.setPixelRatio(

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

document.getElementById("game")
.appendChild(renderer.domElement);


/* =========================================================
   LUCES
========================================================= */

new THREE.HemisphereLight(

);

scene.add(cielo);

sol.position.set(

);

sol.castShadow=true;

sol.shadow.mapSize.width=2048;
sol.shadow.mapSize.height=2048;

scene.add(sol);


/* =========================================================
   TERRENO
========================================================= */

const suelo =
new THREE.Mesh(
    new THREE.PlaneGeometry(

    ),

suelo.receiveShadow=true;

scene.add(suelo);


/* =========================================================

========================================================= */

const camino =
new THREE.Mesh(

/* =========================================================
   ROcas DE LOS BORDES
========================================================= */

const piedrasBorde=[];

function crearRoca(
    x,
    y,
    z,
    escala=1
){

    const grupo=
    new THREE.Group();

    const roca=
    new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            1,
            1
        ),
        new THREE.MeshStandardMaterial({
            color:0x57514a,
            roughness:.95
        })
    );

    roca.scale.set(
        1.25*escala,
        .8*escala,
        1.05*escala
    );

    roca.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );

    roca.castShadow=true;
    roca.receiveShadow=true;

    grupo.add(roca);

    grupo.position.set(
        x,
        y,
        z
    );

    scene.add(grupo);

    return grupo;
}


for(
    let z=-15;
    z>-380;
    z-=7
){

    if(Math.random()<.85){

        piedrasBorde.push(
            crearRoca(
                -9-Math.random()*3,
                .25,
                z,
                .6+Math.random()*1.3
            )
        );

    }

    if(Math.random()<.85){

        piedrasBorde.push(
            crearRoca(
                9+Math.random()*3,
                .25,
                z-Math.random()*3,
                .6+Math.random()*1.3
            )
        );

    }

}


/* =========================================================
   PIEDRAS QUE MARCAN EL CAMINO
========================================================= */

const marcas=[];

for(
    let z=-10;
    z>-390;
    z-=5
){

    const lado =
    Math.random()<.5
    ? -1
    : 1;

    const marca=
    crearRoca(

        .15,
        z,
        .3+Math.random()*.25
    );

    marcas.push(marca);
}


/* =========================================================
   VOLCÁN DEL FONDO
========================================================= */

const volcan=
new THREE.Group();

const montaña=
new THREE.Mesh(
    new THREE.ConeGeometry(
        25,
        34,
        10
    ),

    })
);

montaña.position.y=15;

montaña.position.z=-220;

montaña.castShadow=true;

volcan.add(montaña);


/* CRÁTER */

const crater=
new THREE.Mesh(
    new THREE.TorusGeometry(

    ),

    })
);

crater.rotation.x=
Math.PI/2;

crater.position.set(

    31,

volcan.add(crater);


/* LAVA */

const lava=
new THREE.Mesh(
    new THREE.CircleGeometry(
        4.4,
        20
    ),
    new THREE.MeshBasicMaterial({
        color:0xff4b00
    })
);

lava.rotation.x=
-Math.PI/2;

lava.position.set(
    0,
    31.1,
    -220
);

volcan.add(lava);

scene.add(volcan);


/* =========================================================
   PERSONAJE
========================================================= */

const jugador=
new THREE.Group();

const cuerpo=
new THREE.Mesh(
    new THREE.BoxGeometry(
        1.05,
        1.35,
        .72
    ),
    new THREE.MeshStandardMaterial({
        color:0x2d78d4
    })
);

cuerpo.position.y=1.35;
cuerpo.castShadow=true;

jugador.add(cuerpo);


/* CABEZA */

const cabeza=
new THREE.Mesh(
    new THREE.BoxGeometry(
        .95,
        .95,
        .9
    ),
    new THREE.MeshStandardMaterial({
        color:0xf1b47d
    })
);

cabeza.position.y=2.5;
cabeza.castShadow=true;

jugador.add(cabeza);


/* PELO */

const pelo=
new THREE.Mesh(
    new THREE.BoxGeometry(
        1.02,
        .32,
        .94
    ),
    new THREE.MeshStandardMaterial({
        color:0x24160f
    })
);

pelo.position.y=2.96;

jugador.add(pelo);


/* OJOS */

function ojo(x){

ojo(-.2);

/* BRAZOS */

const brazoIzq=
new THREE.Mesh(

    ),

const brazoDer=
brazoIzq.clone();

jugador.add(brazoDer);


/* PIERNAS */

const piernaIzq=
new THREE.Mesh(
    new THREE.BoxGeometry(
        .38,

    ),

    })
);

);

jugador.add(piernaIzq);


const piernaDer=
piernaIzq.clone();

piernaDer.position.x=.27;

jugador.add(piernaDer);


/* PICO DEL PERSONAJE ESPECIAL */

const pico=
new THREE.Group();

const mango=
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .06,
        .06,
        1.35,
        10
    ),
    new THREE.MeshStandardMaterial({
        color:0x7b4b24
    })
);

mango.rotation.z=.75;
mango.position.y=.35;

pico.add(mango);

const cabezaPico=
new THREE.Mesh(
    new THREE.BoxGeometry(

    ),
    new THREE.MeshStandardMaterial({

cabezaPico.rotation.z=.75;

cabezaPico.position.set(
    .32,

pico.add(cabezaPico);

pico.position.set(
    .85,

);

pico.visible=false;

jugador.add(pico);


/* PERSONAJE EN EL CAMINO */

jugador.position.set(
    0,
    0,
    5
);

jugador.scale.setScalar(.8);

scene.add(jugador);


/* =========================================================
   DIAMANTES
========================================================= */

const diamantes=[];

function crearDiamante(
    x,
    z
){

    const d=
    new THREE.Mesh(
        new THREE.OctahedronGeometry(
            .48,
            0
        ),
        new THREE.MeshStandardMaterial({
            color:0x22eaff,
            metalness:.65,
            roughness:.1,
            emissive:0x006c8c,
            emissiveIntensity:.7
        })
    );

    d.position.set(
        x,
        1.1,
        z
    );

    d.castShadow=true;

    scene.add(d);

    diamantes.push(d);
}


/* MUCHOS DIAMANTES */

for(
    let z=-18;
    z>-380;
    z-=8
){

    crearDiamante(
        [-3.8,0,3.8][
            Math.floor(Math.random()*3)
        ],
        z
    );

    if(Math.random()<.35){

        crearDiamante(
            [-3.8,0,3.8][

/* =========================================================
   ESCUDOS
========================================================= */

const escudos=[];

function crearEscudo(
    x,
    z
){

    const grupo=
    new THREE.Group();

    const escudo=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .65,
            .65,
            .12,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x277cff,
            metalness:.5,
            roughness:.2,
            emissive:0x073a9a,
            emissiveIntensity:.5
        })
    );

    escudo.rotation.x=
    Math.PI/2;

    escudo.position.y=1.15;

    grupo.add(escudo);

    const centro=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .2,
            .2,
            .14,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0xcce5ff,
            metalness:.7
        })
    );

    centro.rotation.x=
    Math.PI/2;

    centro.position.set(
        0,
        1.15,
        -.08
    );

    grupo.add(centro);

    grupo.position.set(
        x,
        0,
        z
    );

    scene.add(grupo);

    escudos.push(grupo);
}


/* Solo aparecen algunos */

for(
    let z=-70;
    z>-360;
    z-=55
){

    crearEscudo(
        [-3.8,0,3.8][
            Math.floor(Math.random()*3)
        ],
        z
    );

}


/* =========================================================
   ROCAS PELIGROSAS
========================================================= */

const rocas=[];

function crearRocaPeligrosa(
    x,
    z
){

    const r=
    crearRoca(
        x,
        .3,
        z,
        .9+Math.random()*.35
    );

    r.userData.velocidadX=0;
    r.userData.mueve=false;
    r.userData.volcanica=false;

    rocas.push(r);

    return r;
}


/* MUCHAS ROCAS */

for(
    let z=-28;
    z>-380;
    z-=9
){

    const cantidad=
    Math.random()<.55
    ? 1
    : 2;

    for(
        let i=0;
        i<cantidad;
        i++
    ){

        crearRocaPeligrosa(
            [-3.8,0,3.8][
                Math.floor(Math.random()*3)
            ],
            z-i*2
        );

    }
}


/* =========================================================
   BOLAS DE LAVA
========================================================= */

const bolasLava=[];

function crearBolaLava(
    x,
    y,
    z
){

    const bola=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .18,
            10,
            10
        ),
        new THREE.MeshBasicMaterial({
            color:0xff4a00
        })
    );

    bola.position.set(
        x,
        y,

    );

    .08+Math.random()*.04;

/* =========================================================
   VARIABLES
========================================================= */

let diamantesConseguidos=0;

let tieneEscudo=false;

let escudoUsado=false;

let especialDesbloqueado=false;

let partidaTerminada=false;

let izquierda=false;

let derecha=false;

let saltando=false;

let velocidad=0.28;

let tiempoInicio=performance.now();

let tiempoAnterior=performance.now();

let alturaSalto=0;

let velocidadSalto=0;


/* =========================================================
   MENSAJES
========================================================= */

let mensajeTimeout;

function mostrarMensaje(texto){

    const m=
    document.getElementById("mensaje");

    m.textContent=texto;
    m.style.opacity=1;

    clearTimeout(mensajeTimeout);

    mensajeTimeout=
    setTimeout(()=>{
        m.style.opacity=0;
    },1800);
}


/* =========================================================
   CONTROLES TÁCTILES
========================================================= */

function mantenerBoton(
    boton,
    activar,
    desactivar
){

    boton.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            activar();
        }
    );

    boton.addEventListener(
        "pointerup",
        desactivar
    );

    boton.addEventListener(
        "pointercancel",
        desactivar
    );

    boton.addEventListener(
        "pointerleave",
        desactivar
    );
}


mantenerBoton(
    document.getElementById("izquierda"),
    ()=>izquierda=true,
    ()=>izquierda=false
);

mantenerBoton(
    document.getElementById("derecha"),
    ()=>derecha=true,
    ()=>derecha=false
);


document.getElementById("saltar")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        saltar();
    }
);


/* =========================================================
   TECLADO
========================================================= */

addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft"
        ){

            izquierda=true;
            e.preventDefault();

        }

        if(
            e.key==="ArrowRight"
        ){

            derecha=true;
            e.preventDefault();

        }

        if(
            e.key==="ArrowUp" ||
            e.key===" "
        ){

            saltar();
            e.preventDefault();

        }

    }
);


addEventListener(
    "keyup",
    e=>{

        if(e.key==="ArrowLeft")
            izquierda=false;

        if(e.key==="ArrowRight")
            derecha=false;

    }
);


/* =========================================================
   SALTO
========================================================= */

function saltar(){

    if(
        !saltando &&
        !partidaTerminada
    ){

        saltando=true;

        velocidadSalto=.22;

    }

}


/* =========================================================
   COLISIÓN
========================================================= */

function colision(
    a,
    b,
    distanciaX=1,
    distanciaZ=1.5
){

    return(
        Math.abs(
            a.position.x-
            b.position.x
        )<distanciaX
        &&
        Math.abs(
            a.position.z-
            b.position.z
        )<distanciaZ
    );

}


/* =========================================================
   MORIR
========================================================= */

function morir(){

    if(partidaTerminada)
        return;

    partidaTerminada=true;
