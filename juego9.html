<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Up 2 - Pixel Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, rgba(80,120,255,.18), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(180,70,255,.14), transparent 30%),
        linear-gradient(135deg, #030817, #07132d 50%, #02040d);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      letter-spacing: 3px;
      text-shadow: 0 4px 0 #111, 0 0 18px rgba(100, 170, 255, .65);
      margin-bottom: 10px;
    }

    .hud {
      display: flex;
      gap: 15px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      background: rgba(20, 35, 70, 0.88);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    canvas {
      background: #050b18;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      max-width: 100%;
    }

    .controls-panel {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(180deg, #35a8ff, #1266e8);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #0844a0;
      user-select: none;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0844a0;
    }

    .btn-jump {
      background: linear-gradient(180deg, #00e676, #00a152);
      box-shadow: 0 4px 0 #00701a;
      font-size: 18px;
      padding: 12px 30px;
    }

    .btn-back {
      background: linear-gradient(180deg, #ff4757, #c0392b);
      box-shadow: 0 4px 0 #841d13;
    }
  </style>
</head>
<body>

  <h1>💎 MONEY UP 2</h1>

  <div class="hud">
    <div>Gemas: <span id="score">0</span></div>
    <div>Vidas: <span id="lives">❤️❤️❤️</span></div>
    <div>Escudo: <span id="shield-status">❌</span></div>
  </div>

  <canvas id="gameCanvas" width="600" height="360"></canvas>

  <div class="controls-panel">
    <button class="btn" id="btn-left">◀ IZQ</button>
    <button class="btn btn-jump" id="btn-jump">🚀 SALTAR</button>
    <button class="btn" id="btn-right">DER ▶</button>
  </div>

  <div class="controls-panel">
    <button class="btn" onclick="resetGame()">REINICIAR</button>
    <a href="juegos.html" class="btn btn-back">VOLVER AL MENÚ</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const shieldEl = document.getElementById('shield-status');

    let score = 0;
    let lives = 3;
    let hasShield = false;
    let gameOver = false;

    const gravity = 0.6;
    const floorY = 290;

    const player = {
      x: 280,
      y: floorY,
      width: 32,
      height: 32,
      vx: 0,
      vy: 0,
      speed: 5,
      jumpPower: -12,
      isGrounded: true
    };

    let items = [];
    let bgRocks = [];
    const keys = { left: false, right: false };

    // Generar rocas en 3D cayendo en el fondo cerca del corazón
    function spawnBgRock() {
      bgRocks.push({
        x: canvas.width / 2 + (Math.random() * 160 - 80),
        y: -20,
        size: 8 + Math.random() * 10,
        speed: 1 + Math.random() * 2,
        rot: Math.random() * Math.PI
      });
    }
    setInterval(spawnBgRock, 400);

    // Generar objetos del juego (Diamantes, Escudos, Rocas 3D)
    function spawnItem() {
      if (gameOver) return;
      const rand = Math.random();
      let type = 'diamond';

      if (rand < 0.6) {
        type = 'diamond'; // 60% Diamante
      } else if (rand < 0.85) {
        type = 'rock';    // 25% Roca 3D
      } else {
        type = 'shield';  // 15% Escudo
      }

      items.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        size: 26,
        speed: 2 + Math.random() * 2.5,
        type: type,
        rot: Math.random() * Math.PI
      });
    }
    setInterval(spawnItem, 900);

    function update() {
      if (gameOver) return;

      // Movimiento jugador
      if (keys.left && player.x > 0) player.x -= player.speed;
      if (keys.right && player.x + player.width < canvas.width) player.x += player.speed;

      // Gravedad y Salto
      player.vy += gravity;
      player.y += player.vy;

      if (player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.isGrounded = true;
      }

      // Caída de rocas de fondo
      for (let i = bgRocks.length - 1; i >= 0; i--) {
        let r = bgRocks[i];
        r.y += r.speed;
        r.rot += 0.02;
        if (r.y > canvas.height) bgRocks.splice(i, 1);
      }

      // Caída de objetos del juego
      for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += it.speed;
        it.rot += 0.03;

        // Colisión con el jugador
        if (
          player.x < it.x + it.size &&
          player.x + player.width > it.x &&
          player.y < it.y + it.size &&
          player.y + player.height > it.y
        ) {
          if (it.type === 'diamond') {
            score += 15;
          } else if (it.type === 'shield') {
            hasShield = true;
          } else if (it.type === 'rock') {
            if (hasShield) {
              hasShield = false; // El escudo destruye el impacto
            } else {
              lives--;
              if (lives <= 0) gameOver = true;
            }
          }
          items.splice(i, 1);
          continue;
        }

        if (it.y > canvas.height) items.splice(i, 1);
      }

      // Actualizar interfaz
      scoreEl.textContent = score;
      livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
      shieldEl.textContent = hasShield ? '🛡️ ACTIVO' : '❌';
    }

    // Dibujar una roca 3D con sombras/facetas
    function draw3DRock(x, y, size, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Sombra
      ctx.fillStyle = '#2d3748';
      ctx.beginPath();
      ctx.arc(2, 2, size / 2, 0, Math.PI * 2);
      ctx.fill();

      // Cara base
      ctx.fillStyle = '#718096';
      ctx.beginPath();
      ctx.moveTo(-size/2, -size/4);
      ctx.lineTo(0, -size/2);
      ctx.lineTo(size/2, -size/3);
      ctx.lineTo(size/2, size/3);
      ctx.lineTo(0, size/2);
      ctx.lineTo(-size/2, size/3);
      ctx.closePath();
      ctx.fill();

      // Faceta brillante 3D
      ctx.fillStyle = '#a0aec0';
      ctx.beginPath();
      ctx.moveTo(-size/2, -size/4);
      ctx.lineTo(0, -size/2);
      ctx.lineTo(0, 0);
      ctx.lineTo(-size/2, size/3);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- FONDO Y CORAZÓN CENTRAL ---
      ctx.fillStyle = 'rgba(255, 0, 100, 0.15)';
      ctx.font = '70px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('❤️', canvas.width / 2, 160);

      // Dibujar rocas en 3D cayendo alrededor del corazón
      bgRocks.forEach(r => {
        draw3DRock(r.x, r.y, r.size, r.rot);
      });

      // --- CARRETERA MANUAL ESTILO EMPEDRADO ---
      ctx.fillStyle = '#3a2e2b'; // Tono tierra/artesanal
      ctx.fillRect(0, floorY + 32, canvas.width, canvas.height - floorY);

      // Dibujar adoquines manuales
      ctx.strokeStyle = '#5a4843';
      ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x += 30) {
        for (let y = floorY + 32; y < canvas.height; y += 15) {
          let offsetX = (Math.floor(y / 15) % 2 === 0) ? 0 : 15;
          ctx.strokeRect(x + offsetX, y, 28, 13);
        }
      }

      // --- JUGADOR ---
      ctx.fillStyle = '#35a8ff';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Aura de Escudo
      if (hasShield) {
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(player.x + 16, player.y + 16, 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      // --- OBJETOS ---
      items.forEach(it => {
        if (it.type === 'diamond') {
          ctx.fillStyle = '#00f0ff';
          ctx.font = '24px Arial';
          ctx.fillText('💎', it.x, it.y + 20);
        } else if (it.type === 'shield') {
          ctx.fillStyle = '#00e676';
          ctx.font = '24px Arial';
          ctx.fillText('🛡️', it.x, it.y + 20);
        } else if (it.type === 'rock') {
          draw3DRock(it.x + 12, it.y + 12, it.size, it.rot);
        }
      });

      // --- GAME OVER ---
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4757';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('¡GAME OVER!', canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = '#fff';
        ctx.font = '18px Arial';
        ctx.fillText(`Gemas conseguidas: ${score} 💎`, canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function jump() {
      if (player.isGrounded && !gameOver) {
        player.vy = player.jumpPower;
        player.isGrounded = false;
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      hasShield = false;
      gameOver = false;
      items = [];
      bgRocks = [];
      player.x = 280;
      player.y = floorY;
      player.vy = 0;
    }

    // Controles Teclado
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    // Controles Táctiles
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnJump = document.getElementById('btn-jump');

    btnLeft.addEventListener('mousedown', () => keys.left = true);
    btnLeft.addEventListener('mouseup', () => keys.left = false);
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    btnLeft.addEventListener('touchend', () => keys.left = false);

    btnRight.addEventListener('mousedown', () => keys.right = true);
    btnRight.addEventListener('mouseup', () => keys.right = false);
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    btnRight.addEventListener('touchend', () => keys.right = false);

    btnJump.addEventListener('click', jump);
    btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

    loop();
  </script>
</body>
</html>
