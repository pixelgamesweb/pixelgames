<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ==========================================
// 1. SISTEMA DE SONIDO SINTETIZADO (WEB AUDIO API)
// ==========================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Pitido de silbato de árbitro
function playWhistle(duration = 0.55) {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    const mainGain = audioCtx.createGain();

    osc1.type = 'sine';
    osc2.type = 'triangle';
    osc1.frequency.setValueAtTime(2850, now);
    osc2.frequency.setValueAtTime(2920, now);

    // Modulación de trino del guisante del silbato
    lfo.frequency.setValueAtTime(36, now);
    lfoGain.gain.setValueAtTime(90, now);
    lfo.connect(lfoGain);
    lfoGain.connect(osc1.frequency);
    lfoGain.connect(osc2.frequency);

    mainGain.gain.setValueAtTime(0.001, now);
    mainGain.gain.linearRampToValueAtTime(0.18, now + 0.04);
    mainGain.gain.setValueAtTime(0.18, now + duration - 0.08);
    mainGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc1.connect(mainGain);
    osc2.connect(mainGain);
    mainGain.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);
    lfo.start(now);
    osc1.stop(now + duration);
    osc2.stop(now + duration);
    lfo.stop(now + duration);
  } catch (e) {}
}

// Golpeo de balón al chutar
function playKickSound() {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);

    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.18);
  } catch (e) {}
}

// Rugido de celebración del estadio + pitido de gol
function playGoalCelebrationSound() {
  playWhistle(0.75);
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 2.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.8;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(650, now);
    filter.Q.setValueAtTime(0.7, now);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.32, now + 0.25);
    gain.gain.setValueAtTime(0.28, now + 1.4);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);
    noise.stop(now + 2.2);
  } catch (e) {}
}

// ==========================================
// 2. ESCENA, CÁMARA Y ESTADIO 3D CON GRADERÍAS
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07120b);
scene.fog = new THREE.Fog(0x07120b, 200, 900);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 12, 36);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById("game").appendChild(renderer.domElement);

// CONTROLES DE CÁMARA 360°
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 5;
controls.maxDistance = 260;

scene.add(new THREE.HemisphereLight(0xcfe7ff, 0x142719, 1.8));
const light = new THREE.DirectionalLight(0xffffff, 2.5);
light.position.set(-50, 100, 40);
light.castShadow = true;
scene.add(light);

const W = 68, L = 105;

// Césped y zona exterior
const outerGround = new THREE.Mesh(
  new THREE.PlaneGeometry(800, 800),
  new THREE.MeshStandardMaterial({ color: 0x0d2616, roughness: 0.95 })
);
outerGround.rotation.x = -Math.PI / 2;
outerGround.position.y = -0.02;
scene.add(outerGround);

const field = new THREE.Mesh(
  new THREE.PlaneGeometry(W, L),
  new THREE.MeshStandardMaterial({ color: 0x176b35, roughness: 0.9 })
);
field.rotation.x = -Math.PI / 2;
field.receiveShadow = true;
scene.add(field);

function line(x, z, w, d) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.025, d),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  m.position.set(x, 0.03, z);
  scene.add(m);
}
line(-W / 2, 0, 0.14, L);
line(W / 2, 0, 0.14, L);
line(0, -L / 2, W, 0.14);
line(0, L / 2, W, 0.14);
line(0, 0, W, 0.14);

const circle = new THREE.Mesh(
  new THREE.RingGeometry(9.1, 9.25, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
);
circle.rotation.x = -Math.PI / 2;
circle.position.y = 0.04;
scene.add(circle);

function goal(z) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const w = 14, h = 5;
  const a = new THREE.Mesh(new THREE.BoxGeometry(0.35, h, 0.35), m);
  const b = a.clone();
  const c = new THREE.Mesh(new THREE.BoxGeometry(w, 0.35, 0.35), m);
  a.position.set(-w / 2, h / 2, 0);
  b.position.set(w / 2, h / 2, 0);
  c.position.y = h;
  g.add(a, b, c);
  g.position.z = z;
  scene.add(g);
}
goal(-L / 2);
goal(L / 2);

// --- GRADERÍAS MONUMENTALES DE 110 ESCALONES + PÚBLICO INSTANCIADO + TORRES DE FOCOS ---
let fanInstancedMesh = null;
const fanData = [];
const dummyMatrix = new THREE.Matrix4();
const dummyPos = new THREE.Vector3();
const dummyQuat = new THREE.Quaternion();
const dummyScale = new THREE.Vector3(1, 1, 1);

function buildStadiumStands() {
  const stadiumGroup = new THREE.Group();
  const concreteMat = new THREE.MeshStandardMaterial({ color: 0x263238, roughness: 0.85 });
  const altStepMat = new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: 0.85 });
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.6 });
  const backWallMat = new THREE.MeshStandardMaterial({ color: 0x0d171e, roughness: 0.9 });
  const fanColors = [0xff4757, 0x2ed573, 0x1e90ff, 0xffa502, 0xffffff, 0xeccc68, 0xa55eea];

  // Vallas publicitarias alrededor del campo
  const fenceGeoSide = new THREE.BoxGeometry(0.6, 1.3, L + 6);
  const fenceLeft = new THREE.Mesh(fenceGeoSide, wallMat);
  fenceLeft.position.set(-W / 2 - 3.5, 0.65, 0);
  const fenceRight = fenceLeft.clone();
  fenceRight.position.x = W / 2 + 3.5;

  const fenceGeoEnd = new THREE.BoxGeometry(W + 8, 1.3, 0.6);
  const fenceTop = new THREE.Mesh(fenceGeoEnd, wallMat);
  fenceTop.position.set(0, 0.65, -L / 2 - 4.5);
  const fenceBottom = fenceTop.clone();
  fenceBottom.position.z = L / 2 + 4.5;
  stadiumGroup.add(fenceLeft, fenceRight, fenceTop, fenceBottom);

  // Configuración monumental de 110 escalones (~140 metros de altura)
  const totalTiers = 110;
  const baseStepH = 1.6;
  const tierStepH = 1.26; // 1.6 + 109 * 1.26 = ~139m
  const tierStepDist = 1.35;
  const tierDepth = 1.5;

  // InstancedMesh para los 440 escalones (110 x 4 costados) para rendimiento óptimo
  const unitStepGeo = new THREE.BoxGeometry(1, 1, 1);
  const stepsInstanced = new THREE.InstancedMesh(unitStepGeo, concreteMat, totalTiers * 4);
  stepsInstanced.receiveShadow = true;

  let stepIdx = 0;
  const colorConcreteA = new THREE.Color(0x263238);
  const colorConcreteB = new THREE.Color(0x324148);
  const colorRingAccent = new THREE.Color(0x1565c0);

  for (let t = 0; t < totalTiers; t++) {
    const tierH = baseStepH + t * tierStepH;
    const offsetX = W / 2 + 5.0 + t * tierStepDist;
    const offsetZ = L / 2 + 6.0 + t * tierStepDist;

    // Anillos azules cada 25 escalones para distinguir los niveles de la mega-grada
    const isRing = t > 0 && t % 25 === 0;
    const stepCol = isRing ? colorRingAccent : (t % 2 === 0 ? colorConcreteA : colorConcreteB);

    const sideSpanZ = L + 12 + t * tierStepDist * 2;
    const endSpanX = W + 10 + t * tierStepDist * 2;

    // 1. Grada Izquierda (-X)
    dummyPos.set(-offsetX, tierH / 2, 0);
    dummyScale.set(tierDepth, tierH, sideSpanZ);
    dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
    stepsInstanced.setMatrixAt(stepIdx, dummyMatrix);
    stepsInstanced.setColorAt(stepIdx++, stepCol);

    // 2. Grada Derecha (+X)
    dummyPos.set(offsetX, tierH / 2, 0);
    dummyScale.set(tierDepth, tierH, sideSpanZ);
    dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
    stepsInstanced.setMatrixAt(stepIdx, dummyMatrix);
    stepsInstanced.setColorAt(stepIdx++, stepCol);

    // 3. Grada Norte (-Z)
    dummyPos.set(0, tierH / 2, -offsetZ);
    dummyScale.set(endSpanX, tierH, tierDepth);
    dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
    stepsInstanced.setMatrixAt(stepIdx, dummyMatrix);
    stepsInstanced.setColorAt(stepIdx++, stepCol);

    // 4. Grada Sur (+Z)
    dummyPos.set(0, tierH / 2, offsetZ);
    dummyScale.set(endSpanX, tierH, tierDepth);
    dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
    stepsInstanced.setMatrixAt(stepIdx, dummyMatrix);
    stepsInstanced.setColorAt(stepIdx++, stepCol);

    // Posicionar espectadores en cada uno de los 110 escalones
    const baseY = tierH + 0.55;
    const spacing = 3.2;

    // Espectadores laterales
    for (let z = -sideSpanZ / 2 + 2; z <= sideSpanZ / 2 - 2; z += spacing) {
      if (Math.random() > 0.25) {
        fanData.push({
          x: -offsetX + (Math.random() - 0.5) * 0.4,
          baseY,
          z: z + (Math.random() - 0.5) * 0.6,
          phase: Math.random() * Math.PI * 2,
          colorHex: fanColors[Math.floor(Math.random() * fanColors.length)]
        });
      }
      if (Math.random() > 0.25) {
        fanData.push({
          x: offsetX + (Math.random() - 0.5) * 0.4,
          baseY,
          z: z + (Math.random() - 0.5) * 0.6,
          phase: Math.random() * Math.PI * 2,
          colorHex: fanColors[Math.floor(Math.random() * fanColors.length)]
        });
      }
    }

    // Espectadores fondos Norte y Sur
    for (let x = -endSpanX / 2 + 2; x <= endSpanX / 2 - 2; x += spacing) {
      if (Math.random() > 0.25) {
        fanData.push({
          x: x + (Math.random() - 0.5) * 0.6,
          baseY,
          z: -offsetZ + (Math.random() - 0.5) * 0.4,
          phase: Math.random() * Math.PI * 2,
          colorHex: fanColors[Math.floor(Math.random() * fanColors.length)]
        });
      }
      if (Math.random() > 0.25) {
        fanData.push({
          x: x + (Math.random() - 0.5) * 0.6,
          baseY,
          z: offsetZ + (Math.random() - 0.5) * 0.4,
          phase: Math.random() * Math.PI * 2,
          colorHex: fanColors[Math.floor(Math.random() * fanColors.length)]
        });
      }
    }
  }

  stepsInstanced.instanceMatrix.needsUpdate = true;
  if (stepsInstanced.instanceColor) stepsInstanced.instanceColor.needsUpdate = true;
  stadiumGroup.add(stepsInstanced);

  // Crear InstancedMesh para todos los miles de espectadores en los 110 escalones
  const fanGeo = new THREE.BoxGeometry(0.65, 1.15, 0.65);
  const fanMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
  fanInstancedMesh = new THREE.InstancedMesh(fanGeo, fanMat, fanData.length);
  dummyScale.set(1, 1, 1);
  const tmpColor = new THREE.Color();

  for (let i = 0; i < fanData.length; i++) {
    const f = fanData[i];
    dummyPos.set(f.x, f.baseY, f.z);
    dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
    fanInstancedMesh.setMatrixAt(i, dummyMatrix);
    tmpColor.setHex(f.colorHex);
    fanInstancedMesh.setColorAt(i, tmpColor);
  }
  fanInstancedMesh.instanceMatrix.needsUpdate = true;
  if (fanInstancedMesh.instanceColor) fanInstancedMesh.instanceColor.needsUpdate = true;
  stadiumGroup.add(fanInstancedMesh);

  // Muros exteriores monumentales detrás del escalón 110 (~146 metros de altura)
  const maxTierH = baseStepH + (totalTiers - 1) * tierStepH;
  const maxWallH = maxTierH + 6.0;
  const maxOffsetX = W / 2 + 5.0 + (totalTiers - 1) * tierStepDist + 1.4;
  const maxOffsetZ = L / 2 + 6.0 + (totalTiers - 1) * tierStepDist + 1.4;
  const totalOuterZ = maxOffsetZ * 2 + 2;
  const totalOuterX = maxOffsetX * 2 + 2;

  const outerSideWallGeo = new THREE.BoxGeometry(1.8, maxWallH, totalOuterZ);
  const outerLeftWall = new THREE.Mesh(outerSideWallGeo, backWallMat);
  outerLeftWall.position.set(-maxOffsetX, maxWallH / 2, 0);
  const outerRightWall = outerLeftWall.clone();
  outerRightWall.position.x = maxOffsetX;
  stadiumGroup.add(outerLeftWall, outerRightWall);

  const outerEndWallGeo = new THREE.BoxGeometry(totalOuterX, maxWallH, 1.8);
  const outerNorthWall = new THREE.Mesh(outerEndWallGeo, backWallMat);
  outerNorthWall.position.set(0, maxWallH / 2, -maxOffsetZ);
  const outerSouthWall = outerNorthWall.clone();
  outerSouthWall.position.z = maxOffsetZ;
  stadiumGroup.add(outerNorthWall, outerSouthWall);

  // 4 Torres de iluminación gigantes por encima de los 110 escalones (~165m de altura)
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x546e7a, metalness: 0.6 });
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xe0f7fa });
  const towerHeight = maxWallH + 20;
  [
    [-maxOffsetX - 3, -maxOffsetZ - 3],
    [maxOffsetX + 3, -maxOffsetZ - 3],
    [-maxOffsetX - 3, maxOffsetZ + 3],
    [maxOffsetX + 3, maxOffsetZ + 3]
  ].forEach(([px, pz]) => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.8, towerHeight, 12), poleMat);
    pole.position.set(px, towerHeight / 2, pz);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(16, 7.5, 2.5), lampMat);
    panel.position.set(px, towerHeight + 2, pz);
    panel.lookAt(0, 0, 0);
    stadiumGroup.add(pole, panel);
  });

  scene.add(stadiumGroup);
}
buildStadiumStands();

// ==========================================
// 3. JUGADORES Y ÁRBITRO 3D EN LA BANDA
// ==========================================
function makePlayer(color, numberText, isReferee = false) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.42, 1, 8, 12),
    new THREE.MeshStandardMaterial({ color })
  );
  body.position.y = 1.35;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.38, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0xd69a73 })
  );
  head.position.y = 2.35;
  g.add(head);

  // Pivotes de brazos para poder levantarlos al celebrar
  const armMat = new THREE.MeshStandardMaterial({ color });
  const leftArmPivot = new THREE.Group();
  leftArmPivot.position.set(-0.55, 1.75, 0);
  const leftArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.7, 6, 8), armMat);
  leftArm.position.set(0, -0.35, 0);
  leftArm.rotation.z = Math.PI / 14;
  leftArm.castShadow = true;
  leftArmPivot.add(leftArm);
  g.add(leftArmPivot);

  const rightArmPivot = new THREE.Group();
  rightArmPivot.position.set(0.55, 1.75, 0);
  const rightArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.7, 6, 8), armMat);
  rightArm.position.set(0, -0.35, 0);
  rightArm.rotation.z = -Math.PI / 14;
  rightArm.castShadow = true;

  if (isReferee) {

    const whistle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 0.22, 10),

    );

  } else {
    // Dorsal en camiseta
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';

    const backNumber = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), numberMat);
    backNumber.position.set(0, 1.45, 0.44);
    backNumber.rotation.y = Math.PI;
    g.add(backNumber);

    const frontNumber = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.35), numberMat);
    frontNumber.position.set(0, 1.5, -0.44);
    g.add(frontNumber);
  }

  return g;
}

function clamp(p) {
  p.x = THREE.MathUtils.clamp(p.x, -W / 2 + 1, W / 2 - 1);
  p.z = THREE.MathUtils.clamp(p.z, -L / 2 + 1, L / 2 - 1);
}

function move(p, i, s, d) {
  // --- CONTROLES CORREGIDOS (NO INVERTIDOS RESPECTO A LA CÁMARA) ---
  // W / Arriba = +1 hacia donde mira la cámara; S / Abajo = -1 hacia atrás
  let forwardInput = (i.w ? 1 : 0) - (i.s ? 1 : 0);
  // D / Derecha = +1 hacia la derecha de la pantalla; A / Izquierda = -1 hacia la izquierda
  let rightInput = (i.d ? 1 : 0) - (i.a ? 1 : 0);

  if (forwardInput || rightInput) {
    const n = Math.hypot(rightInput, forwardInput);
    rightInput /= n;
    forwardInput /= n;

    // Dirección frontal horizontal hacia donde apunta la cámara
    const camForward = new THREE.Vector3();
    camera.getWorldDirection(camForward);
    camForward.y = 0;
    if (camForward.lengthSq() < 0.0001) camForward.set(0, 0, -1);
    camForward.normalize();

    // Vector perpendicular hacia la derecha real de la pantalla: camForward x Up(0,1,0)
    const camRight = new THREE.Vector3().crossVectors(camForward, new THREE.Vector3(0, 1, 0)).normalize();

    const moveDir = new THREE.Vector3()
      .addScaledVector(camForward, forwardInput)
      .addScaledVector(camRight, rightInput);

    p.position.x += moveDir.x * s * d;
    p.position.z += moveDir.z * s * d;
    p.rotation.y = Math.atan2(moveDir.x, moveDir.z);

    // Animación de carrera
    const walkCycle = Math.sin(performance.now() * 0.012 * (s > 8 ? 1.5 : 1.0));
    if (p.userData.leftLeg) {
      p.userData.leftLeg.rotation.x = walkCycle * 0.6;
      p.userData.rightLeg.rotation.x = -walkCycle * 0.6;
      p.userData.leftArm.rotation.x = -walkCycle * 0.5;
      p.userData.rightArm.rotation.x = walkCycle * 0.5;
    }
  } else if (performance.now() >= celebratingUntil) {
    if (p.userData.leftLeg) {
      p.userData.leftLeg.rotation.x = 0;
      p.userData.rightLeg.rotation.x = 0;
      p.userData.leftArm.rotation.x = 0;
      p.userData.rightArm.rotation.x = 0;
    }
  }
  clamp(p);
}

// --- DISPARO ALTO Y HACIA DELANTE ---
function shoot() {
  if (owner !== me) return;
  if (online && !host) {
    if (conn?.open) conn.send({ type: "action", a: "shoot", rotY: me.rotation.y });
    return;
  }
  owner = null;
  playKickSound();

  // Dirección frontal en la que mira el jugador (por defecto hacia portería rival -Z)
  const dirX = Math.sin(me.rotation.y);
  const dirZ = Math.cos(me.rotation.y);
  const power = 32;

  // Elevamos la pelota (vy = 11.5) y la lanzamos con fuerza hacia delante
  ball.position.y = Math.max(ball.position.y, 0.75);
  bv.set(dirX * power, 11.5, dirZ * power);
}

function stealBall() {
  if (owner === enemy && me.position.distanceTo(enemy.position) < 2.5) {
    owner = me;
    bv.set(0, 0, 0);
    playKickSound();
    if (online && !host && conn?.open) {
      conn.send({ type: "action", a: "steal" });
    }
  }
}

function reset() {
  ball.position.set(0, 0.55, 0);
  bv.set(0, 0, 0);
  owner = null;
  me.position.set(0, 0, 22);
  me.rotation.y = Math.PI; // Mirando hacia portería rival (-Z)
  enemy.position.set(0, 0, -22);
  enemy.rotation.y = 0;
}

function goalScored(n) {
  if (n === 1) score1++;
  else score2++;

  // Sonido de silbato de árbitro + rugido del estadio
  playGoalCelebrationSound();

  // Activar celebración del árbitro 3D y del goleador durante 2 segundos
  celebratingUntil = performance.now() + 2000;

  const g = document.getElementById("goal");
  g.style.display = "block";
  setTimeout(() => { g.style.display = "none"; }, 1800);

  if (host && conn?.open) {
    conn.send({ type: "goal", s1: score1, s2: score2 });
  }
  setTimeout(() => reset(), 1200);
}

function ballUpdate(d) {
  if (owner === me) {
    // Mantener el balón justo delante de los pies según hacia dónde mira el jugador
    const frontX = me.position.x + Math.sin(me.rotation.y) * 1.15;
    const frontZ = me.position.z + Math.cos(me.rotation.y) * 1.15;
    ball.position.lerp(new THREE.Vector3(frontX, 0.55, frontZ), 0.35);
  } else if (owner === enemy) {
    const frontX = enemy.position.x + Math.sin(enemy.rotation.y) * 1.15;
    const frontZ = enemy.position.z + Math.cos(enemy.rotation.y) * 1.15;
    ball.position.lerp(new THREE.Vector3(frontX, 0.55, frontZ), 0.35);
  } else {
    ball.position.addScaledVector(bv, d);
    bv.multiplyScalar(Math.pow(0.955, d * 60));
    bv.y -= 16 * d;
    if (ball.position.y < 0.55) {
      ball.position.y = 0.55;
      if (Math.abs(bv.y) > 0.6) bv.y *= -0.5;
      else bv.y = 0;
    }
  }

  if (Math.abs(ball.position.x) > W / 2) {
    ball.position.x = Math.sign(ball.position.x) * (W / 2);
    bv.x *= -0.65;
  }
  if (Math.abs(ball.position.z) > L / 2 && performance.now() > celebratingUntil) {
    if (Math.abs(ball.position.x) < 7 && ball.position.y < 5.2) {
      goalScored(ball.position.z < 0 ? 1 : 2);
    } else {
      ball.position.z = Math.sign(ball.position.z) * (L / 2);
      bv.z *= -0.65;
    }
  }
}

function possession() {
  if (owner || performance.now() < celebratingUntil) return;
  // No atrapar inmediatamente el balón si acaba de salir disparado muy rápido o muy alto
  if (bv.length() > 14 || ball.position.y > 1.8) return;
  if (me.position.distanceTo(ball.position) < 2.2) owner = me;
  else if (enemy.position.distanceTo(ball.position) < 2.2) owner = enemy;
}

function collide() {
  const dx = enemy.position.x - me.position.x;
  const dz = enemy.position.z - me.position.z;
  const d = Math.hypot(dx, dz), min = 1.2;
  if (d > 0 && d < min) {
    const q = (min - d) / 2, x = dx / d, z = dz / d;
    me.position.x -= x * q;
    me.position.z -= z * q;
    enemy.position.x += x * q;
    enemy.position.z += z * q;
    clamp(me);
    clamp(enemy);
  }
}

function state() {
  return {
    e: { x: enemy.position.x, z: enemy.position.z, ry: enemy.rotation.y },
    m: { x: me.position.x, z: me.position.z, ry: me.rotation.y },
    b: { x: ball.position.x, y: ball.position.y, z: ball.position.z, vx: bv.x, vy: bv.y, vz: bv.z, o: owner === me ? 1 : owner === enemy ? 2 : 0 },
    s1: score1,
    s2: score2,
    t: time
  };
}

function apply(s) {
  enemy.position.set(s.e.x, 0, s.e.z);
  if (s.e.ry !== undefined) enemy.rotation.y = s.e.ry;
  me.position.set(s.m.x, 0, s.m.z);
  if (s.m.ry !== undefined) me.rotation.y = s.m.ry;
  ball.position.set(s.b.x, s.b.y, s.b.z);
  bv.set(s.b.vx, s.b.vy, s.b.vz);
  owner = s.b.o === 1 ? me : s.b.o === 2 ? enemy : null;
  score1 = s.s1;
  score2 = s.s2;
  time = s.t;
}

function codeId(c) { return "pixelgames-futbol3-1v1-" + c; }

function createRoom() {
  const c = String(Math.floor(1000 + Math.random() * 9000));
  host = true;
  online = true;
  peer = new Peer(codeId(c));
  peer.on("open", () => {
    document.getElementById("room").style.display = "block";
    document.getElementById("code").textContent = c;
    status("Sala creada. Comparte el código.");
  });
  peer.on("connection", c2 => {
    conn = c2;
    conn.on("open", () => {
      connected = true;
      enemy.visible = true;
      document.getElementById("hostStatus").textContent = "🟢 Jugador 2 conectado";
      conn.send({ type: "start", s: state() });
      start();
    });
    conn.on("data", d => {
      if (d.type === "input") Object.assign(remote, d.i);
      if (d.type === "action" && d.a === "shoot" && owner === enemy) {
        owner = null;
        playKickSound();
        const ry = d.rotY !== undefined ? d.rotY : enemy.rotation.y;
        bv.set(Math.sin(ry) * 32, 11.5, Math.cos(ry) * 32);
      }
      if (d.type === "action" && d.a === "steal" && owner === me && enemy.position.distanceTo(me.position) < 2.5) {
        owner = enemy;
        bv.set(0, 0, 0);
      }
    });
  });
  peer.on("error", () => status("No se pudo crear la sala."));
}

function joinRoom() {
  const c = document.getElementById("inputCode").value.trim();
  if (!/^\d{4}$/.test(c)) { status("Código incorrecto."); return; }
  host = false;
  online = true;
  peer = new Peer();
  peer.on("open", () => {
    conn = peer.connect(codeId(c), { reliable: true });
    conn.on("open", () => {
      connected = true;
      status("Conectado. Esperando al jugador 1...");
    });
    conn.on("data", d => {
      if (d.type === "start") { apply(d.s); start(); }
      if (d.type === "state") apply(d.s);
      if (d.type === "goal") {
        score1 = d.s1;
        score2 = d.s2;
        playGoalCelebrationSound();
        celebratingUntil = performance.now() + 2000;
        document.getElementById("goal").style.display = "block";
        setTimeout(() => { document.getElementById("goal").style.display = "none"; }, 1800);
        setTimeout(() => reset(), 1200);
      }
    });
    conn.on("error", () => status("Error de conexión."));
    conn.on("close", () => status("El otro jugador se desconectó."));
  });
  peer.on("error", () => status("No se encontró la sala."));
}

// Joystick táctil (Arriba = w, Abajo = s, Izquierda = a, Derecha = d)
let pid = null;
const joy = document.getElementById("joystick"), knob = document.getElementById("knob");
joy.addEventListener("pointerdown", e => { pid = e.pointerId; joy.setPointerCapture(pid); joyMove(e); });
joy.addEventListener("pointermove", e => { if (e.pointerId === pid) joyMove(e); });
joy.addEventListener("pointerup", joyReset);
joy.addEventListener("pointercancel", joyReset);

function joyMove(e) {
  const r = joy.getBoundingClientRect();
  const x = e.clientX - r.left - r.width / 2;
  const y = e.clientY - r.top - r.height / 2;
  const len = Math.min(50, Math.hypot(x, y));
  const a = Math.atan2(y, x);
  knob.style.left = 41 + Math.cos(a) * len + "px";
  knob.style.top = 41 + Math.sin(a) * len + "px";
  keys.a = x < -18;
  keys.d = x > 18;
  keys.w = y < -18;
  keys.s = y > 18;
}

function joyReset() {
  pid = null;
  knob.style.left = "41px";
  knob.style.top = "41px";
  keys.w = keys.a = keys.s = keys.d = false;
}

let last = performance.now(), net = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const d = Math.min(0.05, (now - last) / 1000);
  last = now;

  // Animación de espectadores y celebración del árbitro 3D
  const isCelebrating = now < celebratingUntil;
  dummyScale.set(1, 1, 1);
  if (isCelebrating) {
    // El árbitro salta y levanta ambos brazos celebrando el gol
    referee.position.y = Math.abs(Math.sin(now * 0.012)) * 1.1;
    referee.userData.leftArm.rotation.z = Math.PI * 0.85;
    referee.userData.rightArm.rotation.z = -Math.PI * 0.85;
    referee.userData.leftArm.rotation.x = Math.sin(now * 0.02) * 0.35;
    referee.userData.rightArm.rotation.x = -Math.sin(now * 0.02) * 0.35;

    // El jugador también levanta los brazos celebrando
    me.position.y = Math.abs(Math.sin(now * 0.01)) * 0.75;
    me.userData.leftArm.rotation.z = Math.PI * 0.85;
    me.userData.rightArm.rotation.z = -Math.PI * 0.85;

    // Todos los espectadores en los 110 escalones saltan de alegría
    if (fanInstancedMesh) {
      for (let i = 0; i < fanData.length; i++) {
        const f = fanData[i];
        const y = f.baseY + Math.abs(Math.sin(now * 0.014 + f.phase)) * 0.75;
        dummyPos.set(f.x, y, f.z);
        dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
        fanInstancedMesh.setMatrixAt(i, dummyMatrix);
      }
      fanInstancedMesh.instanceMatrix.needsUpdate = true;
    }
  } else {
    referee.position.y = 0;
    referee.userData.leftArm.rotation.set(0, 0, Math.PI / 14);
    referee.userData.rightArm.rotation.set(0, 0, -Math.PI / 14);
    me.position.y = 0;
    me.userData.leftArm.rotation.z = Math.PI / 14;
    me.userData.rightArm.rotation.z = -Math.PI / 14;

    // Movimiento suave tipo ola en las gradas
    if (fanInstancedMesh) {
      for (let i = 0; i < fanData.length; i += 3) {
        const f = fanData[i];
        const y = f.baseY + Math.sin(now * 0.003 + f.phase) * 0.1;
        dummyPos.set(f.x, y, f.z);
        dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
        fanInstancedMesh.setMatrixAt(i, dummyMatrix);
      }
      fanInstancedMesh.instanceMatrix.needsUpdate = true;
    }
  }

  if (playing && !paused) {
    if (!online || host) {
      time += d;
      move(me, keys, sprinting ? 12 : 7, d);
      if (online) {
        move(enemy, remote, remote.sprint ? 12 : 7, d);
      } else if (!isCelebrating) {
        const q = ball.position.clone().sub(enemy.position);
        q.y = 0;
        if (q.length() > 1) {
          q.normalize();
          enemy.position.addScaledVector(q, 5 * d);
          enemy.rotation.y = Math.atan2(q.x, q.z);
          clamp(enemy);
        }
      }
      collide();
      possession();
      ballUpdate(d);
    } else {
      move(me, keys, sprinting ? 12 : 7, d);
    }

    document.getElementById("score").textContent = "J1 " + score1 + " — " + score2 + " J2";

    const stealBtn = document.getElementById("steal");
    if (stealBtn) {
      const canSteal = owner === enemy && me.position.distanceTo(enemy.position) < 2.5;
      stealBtn.disabled = !canSteal;
    }

    // SEGUIMIENTO DE CÁMARA CON ORBITCONTROLS EN 360°
    const targetOffset = me.position.clone().sub(controls.target);
    controls.target.copy(me.position);
    camera.position.add(targetOffset);
    controls.update();

    if (online && connected && conn?.open && now - net > 50) {
      net = now;
      if (host) conn.send({ type: "state", s: state() });
      else conn.send({ type: "input", i: { ...keys, sprint: sprinting } });
    }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
