<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Juego 3 - Fútbol 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07100a;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

button{
  border:1px solid #ffffff25;
  border-radius:14px;
  background:#050505;
  color:#62aaff;
  font-weight:bold;
  padding:13px;
}

#menu,
#pause{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 20% 20%,#168bff55,transparent 30%),
    radial-gradient(circle at 80% 80%,#39ff8b33,transparent 30%),
    #05070b;
}

.panel{
  width:min(92vw,620px);
  padding:30px;
  border-radius:28px;
  background:#050509ed;
  border:1px solid #ffffff20;
  box-shadow:0 30px 100px #000;
  color:white;
}

h1{
  margin:0;
  text-align:center;
  font-size:clamp(42px,9vw,75px);
}

.description{
  text-align:center;
  line-height:1.6;
  opacity:.75;
}

.main{
  width:100%;
  margin:8px 0;
  padding:17px;
  font-size:18px;
}

#hud{
  display:none;
  position:fixed;
  z-index:10;
  top:12px;
  left:12px;
  right:12px;
  justify-content:space-between;
  pointer-events:none;
}

#score{
  padding:12px 20px;
  border-radius:14px;
  background:#000b;
  border:1px solid #ffffff25;
  font-size:18px;
}

#hud button{
  pointer-events:auto;
  width:48px;
  height:48px;
  padding:0;
}

#controls{
  display:none;
  position:fixed;
  z-index:12;
  left:0;
  right:0;
  bottom:12px;
  height:155px;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:15px;
  bottom:0;
  width:140px;
  height:140px;
  border-radius:50%;
  background:#000a;
  border:2px solid #ffffff25;
  pointer-events:auto;
}

#knob{
  position:absolute;
  left:41px;
  top:41px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#111;
}

#actions{
  position:absolute;
  right:15px;
  bottom:0;
  display:grid;
  grid-template-columns:82px 82px;
  gap:8px;
  pointer-events:auto;
}

#actions button{
  height:62px;
  padding:4px;
  font-size:10px;
}

#onlineMenu{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 20% 20%,#168bff55,transparent 30%),
    radial-gradient(circle at 80% 80%,#39ff8b33,transparent 30%),
    #05070b;
}

.onlineCode{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #ffffff25;
  background:#10131b;
  color:white;
  font-size:24px;
  text-align:center;
  letter-spacing:6px;
  margin:8px 0;
  outline:none;
}

.onlineStatus{
  text-align:center;
  min-height:24px;
  color:#62aaff;
  margin:12px 0;
}

#pause{
  display:none;
}

#pause .panel{
  text-align:center;
}
</style>
</head>

<body>

<div id="game"></div>

<!-- MENÚ -->

<section id="menu">

  <div class="panel">

    <h1>Fútbol 3D</h1>

    <p class="description">
      Un juego de fútbol 3D original.
      Juega partidos, marca goles y domina el campo.
    </p>

    <button id="play" class="main">
      JUGAR
    </button>

    <button id="online" class="main">
      PARTIDA ONLINE
    </button>

    <button id="friends" class="main">
      JUGAR CON AMIGOS
    </button>

  </div>

</section>

<!-- MENÚ ONLINE -->
<section id="onlineMenu">
  <div class="panel">
    <h2 style="text-align:center;font-size:38px;margin-top:0">⚽ PARTIDA ONLINE</h2>
    <p class="description">Crea una sala y comparte el código con tu amigo, o únete a una sala existente.</p>

    <button id="createRoom" class="main">🟢 CREAR PARTIDA</button>
    <div id="roomArea" style="display:none">
      <p style="text-align:center;margin-bottom:5px">CÓDIGO DE TU SALA</p>
      <div id="roomCode" class="onlineCode">----</div>
      <p class="description">Dale este código a tu amigo.</p>
    </div>

    <button id="joinRoom" class="main">🔵 UNIRSE A UNA PARTIDA</button>
    <input id="roomInput" class="onlineCode" maxlength="4" inputmode="numeric" placeholder="CÓDIGO" style="display:none">
    <button id="confirmJoin" class="main" style="display:none">ENTRAR EN LA SALA</button>

    <div id="onlineStatus" class="onlineStatus"></div>
    <button id="closeOnline" class="main">🔙 VOLVER</button>
  </div>
</section>

<!-- PAUSA -->

<section id="pause">

  <div class="panel">

    <h2>PAUSA</h2>

    <button id="resume" class="main">
      CONTINUAR
    </button>

    <button id="back" class="main">
      VOLVER
    </button>

  </div>

</section>


<!-- HUD -->

<div id="hud">

  <div id="score">
    LOCAL 0 — 0 VISITANTE
    <br>
    <small id="time">00:00</small>
  </div>

  <button id="pauseButton">
    Ⅱ
  </button>

</div>


<!-- CONTROLES -->

<div id="controls">

  <div id="joystick">

    <div id="knob"></div>

  </div>

  <div id="actions">

    <button id="pass">
      PASAR
    </button>

    <button id="shoot">
      TIRAR
    </button>

    <button id="sprint">
      SPRINT
    </button>

    <button id="switch">
      JUGADOR
    </button>

  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   ESCENA
========================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x07120b);

scene.fog =
  new THREE.Fog(
    0x07120b,
    80,
    350
  );


/* =========================
   CÁMARA
========================= */

const camera =
  new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    .1,
    1000
  );

camera.position.set(
  0,
  12,
  18
);


/* =========================
   RENDER
========================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    2
  )
);

renderer.shadowMap.enabled=true;

document
  .getElementById("game")
  .appendChild(
    renderer.domElement
  );


/* =========================
   ILUMINACIÓN
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xcfe7ff,
    0x142719,
    1.8
  )
);


const stadiumLight =
  new THREE.DirectionalLight(
    0xffffff,
    2.5
  );

stadiumLight.position.set(
  -50,
  100,
  40
);

stadiumLight.castShadow=true;

scene.add(
  stadiumLight
);


/* =========================
   CAMPO
========================= */

const fieldWidth=68;
const fieldLength=105;


const field =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      fieldWidth,
      fieldLength
    ),

    new THREE.MeshStandardMaterial({
      color:0x176b35,
      roughness:.9
    })

  );


field.rotation.x=
  -Math.PI/2;

field.receiveShadow=true;

scene.add(field);


/* =========================
   LÍNEAS DEL CAMPO
========================= */

function line(
  x,
  z,
  width,
  depth
){

  const mesh=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        width,
        .025,
        depth
      ),

      new THREE.MeshBasicMaterial({
        color:0xffffff
      })

    );

  mesh.position.set(
    x,
    .03,
    z
  );

  scene.add(mesh);

}


/* Líneas laterales */

line(
  -fieldWidth/2,
  0,
  .12,
  fieldLength
);

line(
  fieldWidth/2,
  0,
  .12,
  fieldLength
);


/* Líneas de fondo */

line(
  0,
  -fieldLength/2,
  fieldWidth,
  .12
);

line(
  0,
  fieldLength/2,
  fieldWidth,
  .12
);


/* Línea central */

line(
  0,
  0,
  fieldWidth,
  .12
);


/* Círculo central */

const circle=
  new THREE.Mesh(

    new THREE.RingGeometry(
      9.1,
      9.22,
      64
    ),

    new THREE.MeshBasicMaterial({
      color:0xffffff,
      side:THREE.DoubleSide
    })

  );

circle.rotation.x=
  -Math.PI/2;

circle.position.y=.04;

scene.add(circle);


/* =========================
   PORTERÍAS
========================= */

function createGoal(
  z,
  direction
){

  const group=
    new THREE.Group();

  const material=
    new THREE.MeshStandardMaterial({
      color:0xffffff
    });


  const width=14;
  const height=5;


  const post1=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .35,
        height,
        .35
      ),
      material
    );


  post1.position.set(
    -width/2,
    height/2,
    0
  );


  const post2=
    post1.clone();

  post2.position.x=
    width/2;


  const crossbar=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        .35,
        .35
      ),
      material
    );


  crossbar.position.y=
    height;


  group.add(
    post1,
    post2,
    crossbar
  );


  group.position.z=
    z;


  scene.add(group);

}


createGoal(
  -fieldLength/2,
  1
);

createGoal(
  fieldLength/2,
  -1
);


/* =========================
   JUGADOR
========================= */

function createPlayer(
  color
){

  const group=
    new THREE.Group();


  const body=
    new THREE.Mesh(

      new THREE.CapsuleGeometry(
        .42,
        1,
        8,
        12
      ),

      new THREE.MeshStandardMaterial({
        color
      })

    );

  body.position.y=
    1.35;

  body.castShadow=true;

  group.add(body);


  const head=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .38,
        16,
        12
      ),

      new THREE.MeshStandardMaterial({
        color:0xd69a73
      })

    );

  head.position.y=
    2.35;

  head.castShadow=true;

  group.add(head);


  const legMaterial=
    new THREE.MeshStandardMaterial({
      color:0x111111
    });


  for(
    const x of[-.2,.2]
  ){

    const leg=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          .22,
          .8,
          .25
        ),

        legMaterial

      );

    leg.position.set(
      x,
      .45,
      0
    );

    group.add(leg);

  }


  return group;

}


const player=
  createPlayer(
    0x2878e8
  );

player.position.set(
  0,
  0,
  22
);

scene.add(player);


/* =========================
   JUGADORES IA
========================= */

const opponents=[];


for(
  let i=0;
  i<5;
  i++
){

  const p=
    createPlayer(
      0xe83232
    );

  p.position.set(
    (Math.random()-.5)*35,
    0,
    -20+
    Math.random()*35
  );

  scene.add(p);

  opponents.push(p);

}


const teammates=[];


for(
  let i=0;
  i<4;
  i++
){

  const p=
    createPlayer(
      0x2878e8
    );

  p.position.set(
    (Math.random()-.5)*35,
    0,
    5+
    Math.random()*35
  );

  scene.add(p);

  teammates.push(p);

}


/* =========================
   BALÓN
========================= */

const ball=
  new THREE.Mesh(

    new THREE.SphereGeometry(
      .55,
      24,
      16
    ),

    new THREE.MeshStandardMaterial({
      color:0xffffff,
      roughness:.5
    })

  );

ball.position.set(
  0,
  .55,
  15
);

ball.castShadow=true;

scene.add(ball);


/* =========================
   ESTADO DEL BALÓN
========================= */

const ballVelocity=
  new THREE.Vector3();

let ballOwner=
  null;


/* =========================
   ESTADO
========================= */

let playing=false;
let paused=false;

let matchTime=0;

let homeScore=0;
let awayScore=0;

let sprinting=false;

const keys={
  w:false,
  a:false,
  s:false,
  d:false
};


/* =========================
   VELOCIDAD
========================= */

const normalSpeed=7;
const sprintSpeed=12;


/* =========================
   CONTROL DEL JUGADOR
========================= */

function updatePlayer(
  delta
){

  const forward=
    (keys.w?1:0)-
    (keys.s?1:0);

  const sideways=
    (keys.d?1:0)-
    (keys.a?1:0);


  let speed=
    sprinting
      ? sprintSpeed
      : normalSpeed;


  player.position.z+=
    forward*
    speed*
    delta;


  player.position.x+=
    sideways*
    speed*
    delta;


  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -fieldWidth/2+1,
      fieldWidth/2-1
    );


  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -fieldLength/2+1,
      fieldLength/2-1
    );


  /* Animación sencilla */

  if(
    forward!==0 ||
    sideways!==0
  ){

    player.rotation.y=
      Math.atan2(
        sideways,
        forward
      );

  }

}


/* =========================
   FÍSICA DEL BALÓN
========================= */

function updateBall(
  delta
){

  ball.position.addScaledVector(
    ballVelocity,
    delta
  );


  ballVelocity.multiplyScalar(
    Math.pow(
      .94,
      delta*60
    )
  );


  if(
    ball.position.y>.55
  ){

    ballVelocity.y-=
      12*
      delta;

  }


  if(
    ball.position.y<.55
  ){

    ball.position.y=.55;

    if(
      Math.abs(
        ballVelocity.y
      )>.5
    ){

      ballVelocity.y*=
        -.45;

    }
    else{

      ballVelocity.y=0;

    }

  }


  /* Laterales */

  if(
    Math.abs(
      ball.position.x
    )>
    fieldWidth/2
  ){

    ball.position.x=
      Math.sign(
        ball.position.x
      )*
      fieldWidth/2;

    ballVelocity.x*=-.65;

  }


  /* Fondos */

  if(
    Math.abs(
      ball.position.z
    )>
    fieldLength/2
  ){

    /*
      Gol si la pelota está
      dentro de la portería.
    */

    if(
      Math.abs(
        ball.position.x
      )<7
    ){

      if(
        ball.position.z<
        -fieldLength/2
      ){

        homeScore++;

      }
      else{

        awayScore++;

      }

      resetBall();

    }
    else{

      ball.position.z=
        Math.sign(
          ball.position.z
        )*
        fieldLength/2;

      ballVelocity.z*=-.65;

    }

  }

}


/* =========================
   REINICIAR BALÓN
========================= */

function resetBall(){

  ball.position.set(
    0,
    .55,
    0
  );

  ballVelocity.set(
    0,
    0,
    0
  );

}


/* =========================
   CONTROL BALÓN
========================= */

function checkBall(){

  const distance=
    player.position.distanceTo(
      ball.position
    );


  if(
    distance<2.3 &&
    ball.position.y<2
  ){

    ballOwner=
      player;

  }


  if(
    ballOwner===player
  ){

    const target=
      player.position.clone();


    target.z-=
      1.2;


    target.y=
      .55;


    ball.position.lerp(
      target,
      .25
    );

  }

}


/* =========================
   PASE
========================= */

function pass(){

  if(
    ballOwner!==player
  )
    return;


  ballOwner=null;


  ballVelocity.set(
    0,
    0,
    -12
  );

}


/* =========================
   TIRO
========================= */

function shoot(){

  if(
    ballOwner!==player
  )
    return;


  ballOwner=null;


  ballVelocity.set(
    0,
    2.5,
    -25
  );

}


/* =========================
   IA
========================= */

function updateAI(
  delta
){

  for(
    const opponent of opponents
  ){

    const target=
      ball.position.clone();

    target.x=
      THREE.MathUtils.clamp(
        target.x,
        -fieldWidth/2+2,
        fieldWidth/2-2
      );

    target.z=
      THREE.MathUtils.clamp(
        target.z,
        -fieldLength/2+2,
        fieldLength/2-2
      );


    const direction=
      target
      .sub(
        opponent.position
      );


    direction.y=0;


    if(
      direction.length()>1
    ){

      direction.normalize();

      opponent.position
        .addScaledVector(
          direction,
          3.8*delta
        );

    }

  }


  for(
    const teammate of teammates
  ){

    const direction=
      ball.position.clone()
      .sub(
        teammate.position
      );

    direction.y=0;


    if(
      direction.length()>4
    ){

      direction.normalize();

      teammate.position
        .addScaledVector(
          direction,
          3*delta
        );

    }

  }

}


/* =========================
   TECLADO
========================= */

addEventListener(
  "keydown",
  e=>{

    const key=
      e.key.toLowerCase();

    if(
      key==="w"||
      key==="arrowup"
    )
      keys.w=true;

    if(
      key==="a"||
      key==="arrowleft"
    )
      keys.a=true;

    if(
      key==="s"||
      key==="arrowdown"
    )
      keys.s=true;

    if(
      key==="d"||
      key==="arrowright"
    )
      keys.d=true;

    if(
      key==="shift"
    )
      sprinting=true;

    if(
      key===" "
    )
      shoot();

    if(
      key==="e"
    )
      pass();

  }
);


addEventListener(
  "keyup",
  e=>{

    const key=
      e.key.toLowerCase();

    if(
      key==="w"||
      key==="arrowup"
    )
      keys.w=false;

    if(
      key==="a"||
      key==="arrowleft"
    )
      keys.a=false;

    if(
      key==="s"||
      key==="arrowdown"
    )
      keys.s=false;

    if(
      key==="d"||
      key==="arrowright"
    )
      keys.d=false;

    if(
      key==="shift"
    )
      sprinting=false;

  }
);


/* =========================
   BOTONES
========================= */

document
  .getElementById("pass")
  .onclick=pass;

document
  .getElementById("shoot")
  .onclick=shoot;

document
  .getElementById("sprint")
  .onpointerdown=()=>{
    sprinting=true;
  };

document
  .getElementById("sprint")
  .onpointerup=()=>{
    sprinting=false;
  };


/* =========================
   JOYSTICK
========================= */

const joystick=
  document.getElementById(
    "joystick"
  );

const knob=
  document.getElementById(
    "knob"
  );

let pointerId=null;


joystick.addEventListener(
  "pointerdown",
  e=>{

    pointerId=e.pointerId;

    joystick.setPointerCapture(
      pointerId
    );

    moveJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId===pointerId
    ){

      moveJoystick(e);

    }

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);


function moveJoystick(e){

  const r=
    joystick.getBoundingClientRect();


  const dx=
    e.clientX-
    r.left-
    r.width/2;


  const dy=
    e.clientY-
    r.top-
    r.height/2;


  const length=
    Math.min(
      50,
      Math.hypot(
        dx,
        dy
      )
    );


  const angle=
    Math.atan2(
      dy,
      dx
    );


  knob.style.left=
    41+
    Math.cos(angle)*
    length+
    "px";


  knob.style.top=
    41+
    Math.sin(angle)*
    length+
    "px";


  keys.a=dx<-18;
  keys.d=dx>18;
  keys.w=dy<-18;
  keys.s=dy>18;

}


function resetJoystick(){

  pointerId=null;

  knob.style.left="41px";
  knob.style.top="41px";

  keys.w=
  keys.a=
  keys.s=
  keys.d=false;

}


/* =========================
   CÁMARA
========================= */

function updateCamera(){

  const target=
    player.position.clone();

  target.y=1;


  const desired=
    new THREE.Vector3(
      player.position.x,
      12,
      player.position.z+18
    );


  camera.position.lerp(
    desired,
    .08
  );


  camera.lookAt(
    target
  );

}


/* =========================
   HUD
========================= */

function updateHUD(){

  document
    .getElementById("score")
    .innerHTML=
      "LOCAL "+
      homeScore+
      " — "+
      awayScore+
      " VISITANTE"+
      "<br><small>"+
      formatTime(matchTime)+
      "</small>";

}


function formatTime(seconds){

  const m=
    Math.floor(
      seconds/60
    )
    .toString()
    .padStart(2,"0");

  const s=
    Math.floor(
      seconds%60
    )
    .toString()
    .padStart(2,"0");

  return m+":"+s;

}


/* =========================
   JUEGO
========================= */

function update(delta){

  if(
    !playing||
    paused
  )
    return;


  matchTime+=delta;


  updatePlayer(delta);

  updateAI(delta);

  checkBall();

  updateBall(delta);

  updateCamera();

  updateHUD();

}


/* =========================
   MENÚ
========================= */

document
  .getElementById("play")
  .onclick=()=>{

    playing=true;

    document
      .getElementById("menu")
      .style.display="none";

    document
      .getElementById("hud")
      .style.display="flex";

    document
      .getElementById("controls")
      .style.display="block";

  };


const onlineMenu = document.getElementById("onlineMenu");
const onlineStatus = document.getElementById("onlineStatus");
const roomArea = document.getElementById("roomArea");
const roomCode = document.getElementById("roomCode");
const roomInput = document.getElementById("roomInput");
const confirmJoin = document.getElementById("confirmJoin");

function showOnlineMenu(){
  document.getElementById("menu").style.display="none";
  onlineMenu.style.display="flex";
  onlineStatus.textContent="";
}

document.getElementById("online").onclick=showOnlineMenu;
document.getElementById("friends").onclick=showOnlineMenu;

document.getElementById("createRoom").onclick=()=>{
  const code=Math.floor(1000+Math.random()*9000).toString();
  roomCode.textContent=code;
  roomArea.style.display="block";
  roomInput.style.display="none";
  confirmJoin.style.display="none";
  onlineStatus.textContent="Sala creada. Comparte el código con tu amigo.";
};

document.getElementById("joinRoom").onclick=()=>{
  roomInput.style.display="block";
  confirmJoin.style.display="block";
  roomInput.focus();
  onlineStatus.textContent="Escribe el código de 4 cifras.";
};

confirmJoin.onclick=()=>{
  const code=roomInput.value.trim();
  if(!/^\d{4}$/.test(code)){
    onlineStatus.textContent="El código debe tener 4 cifras.";
    return;
  }
  onlineStatus.textContent="Código aceptado: sala "+code+". La conexión multijugador real necesita el servidor online.";
};

document.getElementById("closeOnline").onclick=()=>{
  onlineMenu.style.display="none";
  document.getElementById("menu").style.display="flex";
};


/* =========================
   PAUSA
========================= */

document
  .getElementById("pauseButton")
  .onclick=()=>{

    paused=true;

    document
      .getElementById("pause")
      .style.display="flex";

  };


document
  .getElementById("resume")
  .onclick=()=>{

    paused=false;

    document
      .getElementById("pause")
      .style.display="none";

  };


document
  .getElementById("back")
  .onclick=()=>{

    playing=false;
    paused=false;

    document
      .getElementById("pause")
      .style.display="none";

    document
      .getElementById("hud")
      .style.display="none";

    document
      .getElementById("controls")
      .style.display="none";

    document
      .getElementById("menu")
      .style.display="flex";

  };


/* =========================
   BUCLE
========================= */

let last=
  performance.now();


function loop(now){

  requestAnimationFrame(loop);


  const delta=
    Math.min(
      .05,
      (now-last)/1000
    );


  last=now;


  update(delta);


  renderer.render(
    scene,
    camera
  );

}


requestAnimationFrame(loop);


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>
