<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 3D estilo Minecraft</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Haz clic y arrastra para rotar | Rueda del ratón para zoom</div>

    <!-- Carga de Three.js y OrbitControls desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Escena, Cámara y Renderizador
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Cielito azul estilo Minecraft

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 3, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Controles de órbita para mover la cámara con el ratón
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Creación de Texturas Pixeladas con Canvas
        function createPixelTexture(color, detailColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');

            // Color base
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 16, 16);

            // Generar variación de píxeles estáticas
            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    if (Math.random() > 0.6) {
                        ctx.fillStyle = detailColor;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            // Desactivar suavizado para mantener el aspecto retro/pixelado
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // Texturas: Pasto (Arriba), Tierra (Abajo y Lados)
        const topTexture = createPixelTexture('#5b8731', '#4a6f28');
        const sideTexture = createPixelTexture('#866043', '#573d2a');
        const bottomTexture = createPixelTexture('#573d2a', '#3d2b1d');

        // Materiales para las 6 caras del cubo: [Derecha, Izquierda, Arriba, Abajo, Frente, Atrás]
        const materials = [
            new THREE.MeshStandardMaterial({ map: sideTexture }),
            new THREE.MeshStandardMaterial({ map: sideTexture }),
            new THREE.MeshStandardMaterial({ map: topTexture }),
            new THREE.MeshStandardMaterial({ map: bottomTexture }),
            new THREE.MeshStandardMaterial({ map: sideTexture }),
            new THREE.MeshStandardMaterial({ map: sideTexture })
        ];

        // 3. Creación del Cubo (Bloque de Minecraft)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const cube = new THREE.Mesh(geometry, materials);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        // Plano para la sombra
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);

        // 4. Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 8, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 5. Ajuste de Ventana y Animación
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.y += 0.003; // Rotación automática suave
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
