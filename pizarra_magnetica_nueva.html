<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Pizarra magnetica</title>

<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#02030a;color:white;font-family:Arial,sans-serif;
}
body{
  background:
    radial-gradient(circle at 20% 20%,#168bff30,transparent 30%),
    radial-gradient(circle at 80% 75%,#39ff8b22,transparent 32%),
    linear-gradient(145deg,#03050d,#07100d 55%,#02030a);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px);
  background-size:85px 85px;
}
button{
  border:1px solid #ffffff25;border-radius:14px;
  background:#050505;color:#62aaff;font-weight:bold;
  padding:12px 16px;cursor:pointer;font-size:14px;
}
button:active{transform:scale(.97)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* CABECERA */
#hud{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 16px;
  background:#050509dd;border-bottom:1px solid #ffffff18;
  backdrop-filter:blur(12px);
}
.title{
  font-size:clamp(22px,4vw,34px);font-weight:900;
  letter-spacing:2px;text-shadow:0 4px 0 #111,0 0 18px #62aaff55;
}
.subtitle{font-size:12px;color:#91a4c7;margin-top:3px}
.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.tools button{padding:10px 12px}

/* ZONA DE JUEGO */
#boardArea{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:18px;
}
#field{
  position:relative;
  width:min(92vw,900px);
  height:min(78vh,650px);
  aspect-ratio:900/650;
  overflow:hidden;
  border:3px solid rgba(255,255,255,.9);
  border-radius:10px;
  box-shadow:0 20px 70px #000, inset 0 0 35px #0006;
  background:
    repeating-linear-gradient(
      90deg,
      #176b35 0px,#176b35 70px,
      #196f38 70px,#196f38 140px
    );
  touch-action:none;
}
#field:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,#ffffff08,transparent 35%,#00000008);
}

/* LÍNEAS DEL CAMPO */
.line{position:absolute;background:#fff;opacity:.95;z-index:1;pointer-events:none}
.outer.top{left:0;right:0;top:0;height:3px}
.outer.bottom{left:0;right:0;bottom:0;height:3px}
.outer.left{top:0;bottom:0;left:0;width:3px}
.outer.right{top:0;bottom:0;right:0;width:3px}
.half{left:0;right:0;top:50%;height:3px;transform:translateY(-50%)}
.circle{
  position:absolute;left:50%;top:50%;width:145px;height:145px;
  transform:translate(-50%,-50%);border:3px solid #fff;border-radius:50%;
  z-index:1;pointer-events:none;
}
.centerDot{
  position:absolute;left:50%;top:50%;width:8px;height:8px;
  transform:translate(-50%,-50%);background:#fff;border-radius:50%;z-index:2;
}
.box{position:absolute;width:25%;height:22%;border:3px solid #fff;z-index:1}
.box.top{left:37.5%;top:0;border-top:0}
.box.bottom{left:37.5%;bottom:0;border-bottom:0}
.smallbox{position:absolute;width:11%;height:9%;border:3px solid #fff;z-index:1}
.smallbox.top{left:44.5%;top:0;border-top:0}
.smallbox.bottom{left:44.5%;bottom:0;border-bottom:0}
.penalty{
  position:absolute;width:9px;height:9px;background:#fff;border-radius:50%;
  left:50%;z-index:2;transform:translateX(-50%);
}
.penalty.top{top:16%}.penalty.bottom{bottom:16%}
.arc{
  position:absolute;width:115px;height:60px;left:50%;
  border:3px solid #fff;border-radius:50%;transform:translateX(-50%);
  z-index:1;pointer-events:none;
}
.arc.top{top:17%;border-bottom-color:transparent;border-left-color:transparent;border-right-color:transparent}
.arc.bottom{bottom:17%;border-top-color:transparent;border-left-color:transparent;border-right-color:transparent}

/* PORTERÍAS — vista totalmente cenital: solo un palo pegado a la pared */
.goal{
  position:absolute;left:50%;transform:translateX(-50%);
  width:17%;height:8px;z-index:3;pointer-events:none;
}
.goal.top{top:-1px}.goal.bottom{bottom:-1px}
.goal .post{
  position:absolute;left:0;right:0;top:0;height:8px;
  background:#fff;border-radius:6px;
  box-shadow:0 1px 5px #0009;
}
.goal .post.l,.goal .post.r,.goal .cross,.goal .net{display:none;}

/* FICHAS */
.player{
  position:absolute;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;
  border:3px solid #fff;z-index:10;
  cursor:grab;touch-action:none;
  box-shadow:0 5px 12px #0009,inset 0 2px 3px #ffffff66;
  transform:translate(-50%,-50%);
  transition:box-shadow .12s,transform .08s;
}
.player:hover{box-shadow:0 7px 18px #000c,0 0 15px #ffffff55}
.player.dragging{cursor:grabbing;z-index:30;transform:translate(-50%,-50%) scale(1.12)}
.red{background:linear-gradient(145deg,#ff5353,#b80000);box-shadow:0 5px 12px #0009,0 0 12px #ff303055}
.blue{background:linear-gradient(145deg,#4d9dff,#0751c7);box-shadow:0 5px 12px #0009,0 0 12px #168bff55}
.gk{border-color:#ffd84a}



/* FICHAS AMARILLAS Y PELOTA */
.player.yellow{
  width:30px;height:30px;font-size:10px;border-width:2px;
  background:linear-gradient(145deg,#ffe95a,#e0a900);
  color:#171000;
  box-shadow:0 4px 9px #0009,0 0 10px #ffd21f55;
}
.ball{
  position:absolute;width:27px;height:27px;border-radius:50%;
  z-index:12;cursor:grab;touch-action:none;
  transform:translate(-50%,-50%);
  background:#fff;
  border:2px solid #111;
  box-shadow:0 4px 10px #000b,0 0 8px #fff8;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.ball.dragging{cursor:grabbing;transform:translate(-50%,-50%) scale(1.12)}

/* BARRA INFERIOR */
#status{
  position:relative;z-index:10;
  min-height:42px;padding:8px 14px;
  display:flex;align-items:center;justify-content:center;
  color:#9fb9e8;font-size:13px;text-align:center;
  background:#050509dd;border-top:1px solid #ffffff18;
}
@media(max-width:650px){
  #hud{padding:9px 10px}.subtitle{display:none}
  #boardArea{padding:8px}
  #field{width:calc(100vw - 24px);height:auto}
  .player{width:35px;height:35px;font-size:12px;border-width:2px}
  .circle{width:95px;height:95px}
  .arc{width:78px;height:40px}
  .tools button span{display:none}
}
</style>
</head>

<body>
<div id="app">

  <header id="hud">
    <div>
      <div class="title">⚽ PIZARRA</div>
      <div class="subtitle">Pizarra táctica · arrastra los jugadores para preparar la jugada</div>
    </div>
    <div class="tools">
      <button id="reset">↺ <span>REINICIAR</span></button>
      <button id="clear">✕ <span>LIMPIAR</span></button>
    </div>
  </header>

  <main id="boardArea">
    <div id="field">

      <div class="line outer top"></div>
      <div class="line outer bottom"></div>
      <div class="line outer left"></div>
      <div class="line outer right"></div>
      <div class="line half"></div>
      <div class="circle"></div>
      <div class="centerDot"></div>

      <div class="box top"></div>
      <div class="box bottom"></div>
      <div class="smallbox top"></div>
      <div class="smallbox bottom"></div>
      <div class="penalty top"></div>
      <div class="penalty bottom"></div>
      <div class="arc top"></div>
      <div class="arc bottom"></div>

      <div class="goal top"><div class="net"></div><div class="cross"></div><div class="post l"></div><div class="post r"></div></div>
      <div class="goal bottom"><div class="net"></div><div class="cross"></div><div class="post l"></div><div class="post r"></div></div>

    </div>
  </main>

  <footer id="status">🔴 Equipo rojo · 🔵 Equipo azul · Arrastra las fichas o la pelota para colocarlas</footer>
</div>

<script>
const field = document.getElementById("field");
const status = document.getElementById("status");

const initial = {
  red: [
    [50,92],[20,78],[38,80],[62,80],[80,78],
    [27,62],[50,66],[73,62],
    [20,43],[50,47],[80,43]
  ],
  blue: [
    [50,8],[20,22],[38,20],[62,20],[80,22],
    [27,38],[50,34],[73,38],
    [20,57],[50,53],[80,57]
  ]
};

let dragging = null;
let offsetX = 0, offsetY = 0;

function createPlayers(){
  field.querySelectorAll(".player").forEach(p => p.remove());

  for(const team of ["red","blue"]){
    initial[team].forEach((pos,i)=>{
      const p=document.createElement("div");
      p.className=`player ${team} ${i===0 ? "gk":""}`;
      p.textContent=i+1;
      p.dataset.team=team;
      p.dataset.index=i;
      p.style.left=pos[0]+"%";
      p.style.top=pos[1]+"%";
      field.appendChild(p);

      p.addEventListener("pointerdown", startDrag);
    });
  }

  // 11 fichas amarillas: equipo de apoyo/entrenamiento
  const yellowPositions=[
    [15,32],[25,32],[35,32],[45,32],[55,32],[65,32],[75,32],[85,32],
    [30,50],[50,50],[70,50]
  ];
  yellowPositions.forEach((pos,i)=>{
    const p=document.createElement("div");
    p.className="player yellow";
    p.textContent=i+1;
    p.dataset.team="yellow";
    p.dataset.index=i;
    p.style.left=pos[0]+"%";
    p.style.top=pos[1]+"%";
    field.appendChild(p);
    p.addEventListener("pointerdown", startDrag);
  });

  // Pelota
  const ball=document.createElement("div");
  ball.className="ball";
  ball.id="ball";
  ball.textContent="⚽";
  ball.style.left="50%";
  ball.style.top="50%";
  field.appendChild(ball);
  ball.addEventListener("pointerdown", startDrag);
}

function startDrag(e){
  e.preventDefault();
  dragging=e.currentTarget;
  dragging.classList.add("dragging");
  dragging.setPointerCapture(e.pointerId);

  const r=field.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;
  const px=parseFloat(dragging.style.left)/100*r.width;
  const py=parseFloat(dragging.style.top)/100*r.height;
  offsetX=x-px; offsetY=y-py;

  const icon=dragging.classList.contains("ball")?"⚽":dragging.dataset.team==="red"?"🔴":dragging.dataset.team==="blue"?"🔵":"🟡";\n  status.textContent=dragging.classList.contains("ball")?"⚽ Pelota seleccionada":`${icon} Jugador ${dragging.dataset.index*1+1} seleccionado`;
}

field.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const r=field.getBoundingClientRect();
  let x=e.clientX-r.left-offsetX;
  let y=e.clientY-r.top-offsetY;
  const margin=18;

  x=Math.max(margin,Math.min(r.width-margin,x));
  y=Math.max(margin,Math.min(r.height-margin,y));

  dragging.style.left=(x/r.width*100)+"%";
  dragging.style.top=(y/r.height*100)+"%";
});

field.addEventListener("pointerup",()=>{
  if(!dragging)return;
  dragging.classList.remove("dragging");
  dragging=null;
  status.textContent="⚽ Ficha colocada. Puedes seguir moviendo jugadores.";
});

field.addEventListener("pointercancel",()=>{
  if(dragging)dragging.classList.remove("dragging");
  dragging=null;
});

document.getElementById("reset").addEventListener("click",()=>{
  createPlayers();
  status.textContent="↺ Posiciones iniciales restauradas.";
});

document.getElementById("clear").addEventListener("click",()=>{
  field.querySelectorAll(".player,.ball").forEach(p=>p.remove());
  status.textContent="✕ Pizarra limpia. Pulsa REINICIAR para recuperar las 22 fichas.";
});

createPlayers();
</script>
</body>
</html>
