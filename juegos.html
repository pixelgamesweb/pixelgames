<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Games</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            /* Fondo de puntos grises alineados */
            background-image: radial-gradient(#333333 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(15, 15, 15, 0.85);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid #222222;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            max-width: 480px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
        }

        p {
            font-size: 1.1rem;
            color: #888888;
            margin-bottom: 35px;
        }

        .btn-jugar {
            display: inline-block;
            padding: 16px 48px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            /* Degradado difuminado de rojo a lila */
            background: linear-gradient(135deg, #e50914, #8a2be2);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-jugar:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 25px rgba(138, 43, 226, 0.6);
            background: linear-gradient(135deg, #ff1e27, #9d3bf0);
        }

        .btn-jugar:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pixel Games</h1>
        <p>Bienvenido al portal de juegos</p>
        <a href="juegos.html" class="btn-jugar">JUGAR</a>
    </div>

</body>
</html>
