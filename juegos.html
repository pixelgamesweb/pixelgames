<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL GAMES - Menú de Juegos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      background: radial-gradient(circle at center, #1a1f35 0%, #080b12 100%);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 42px;
      color: #00e5ff;
      text-shadow: 0 0 15px #00e5ff;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #8191aa;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .user-tag {
      margin-top: 10px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid #00e5ff;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 13px;
      color: #00e5ff;
      display: inline-block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1200px;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 16px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 220px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card.available:hover {
      transform: translateY(-5px);
      border-color: #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .play {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 13px;
      background: linear-gradient(180deg, #35a8ff, #1266e8);
      color: white;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 5px 0 #0844a0, 0 8px 18px rgba(0,100,255,.25);
      transition: transform 0.1s;
      cursor: pointer;
      border: none;
    }

    .play:hover {
      transform: scale(1.05);
    }

    .locked {
      opacity: .68;
      border-color: rgba(255,255,255,0.05);
    }

    .lock {
      font-size: 62px;
      margin-bottom: 13px;
      filter: drop-shadow(0 10px 5px rgba(0,0,0,.6));
    }

    .locked .name {
      color: #aab6cc;
    }

    .badge {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #8191aa;
      border: 1px solid rgba(255,255,255,.12);
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,.2);
    }

    /* MODAL DE SELECCIÓN DE PARTIDA */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(8, 11, 18, 0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #0f172a;
      border: 2px solid #00e5ff;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
    }

    .modal-card h2 {
      color: #00e5ff;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-continuar {
      background: #2ecc71;
      color: #080b12;
    }
    .btn-continuar:hover { background: #58d68d; }

    .btn-nueva {
      background: #e67e22;
      color: #ffffff;
    }
    .btn-nueva:hover { background: #eb984e; }

    .btn-cancelar {
      background: rgba(255,255,255,0.1);
      color: #8191aa;
      margin-top: 15px;
    }

    .alerta-error {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 10px;
      display: none;
      font-weight: bold;
    }

    @media(max-width:1000px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media(max-width:560px) {
      .grid { grid-template-columns: 1fr; width: 92%; }
      .card { min-height: 210px; }
    }
  </style>
</head>

<body>

  <header>
    <h1>PIXEL GAMES</h1>
    <div class="subtitle">ELIGE TU JUEGO</div>
    <div class="user-tag" id="user-display">Usuario: Invitado</div>
  </header>

  <main class="grid" id="games"></main>

  <!-- MODAL DE ELECCIÓN DE MODO DE JUEGO -->
  <div class="modal-overlay" id="modal-partida">
    <div class="modal-card">
      <h2 id="modal-titulo-juego">NOMBRE JUEGO</h2>
      <p style="color: #8191aa; font-size: 14px; margin-bottom: 20px;">¿Cómo deseas empezar tu partida?</p>

      <button class="modal-btn btn-continuar" onclick="continuarPartida()">▶️ CONTINUAR PARTIDA</button>
      <button class="modal-btn btn-nueva" onclick="nuevaPartida()">➕ NUEVA PARTIDA</button>
      
      <div class="alerta-error" id="alerta-sin-partida">❌ No tienes ninguna partida anterior guardada.</div>

      <button class="modal-btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <script>
    const usuarioActivo = localStorage.getItem('pixelgames_session') || 'Invitado';
    document.getElementById('user-display').innerText = `Usuario: ${usuarioActivo}`;

    const games = [
      { id: 1, name: "money up", icon: "🪙", file: "juego1.html", permiteGuardar: false },
      { id: 2, name: "batle", icon: "🌲", file: "juego2.html", permiteGuardar: true },
      { id: 3, name: "Football Legends", icon: "⚽", file: "juego3.html", permiteGuardar: true },
      { id: 4, name: "Pixel AI", icon: "🤖", file: "juego4.html", permiteGuardar: true },
      { id: 5, name: "ultra Laberintos", icon: "🧩", file: "juego5.html", permiteGuardar: true },
      { id: 6, name: "Dreamer up", icon: "🌙", file: "juego6.html", permiteGuardar: true },
      { id: 7, name: "4 en raya", icon: "🔴", file: "juego7.html", permiteGuardar: true },
      { id: 8, name: "serpiente de colores", icon: "💎", file: "juego8.html", permiteGuardar: true },
      { id: 9, name: "money up 2", icon: "🍎", file: "juego9.html", permiteGuardar: false },
      { id: 10, name: "Pizarra magnética", icon: "⚽", file: "juego10.html", permiteGuardar: true },
      { id: 11, name: "Ajedrez en 3D", icon: "♟️", file: "juego11.html", permiteGuardar: true },
      { id: 12, name: "Galaxy Defender", icon: "👾", file: "juego12.html", permiteGuardar: true },
      { id: 13, name: "Pixel Chat", icon: "💬", file: "juego13.html", permiteGuardar: false },
      { id: 14, name: "Valorar Web", icon: "⭐", file: "juego14.html", permiteGuardar: false },
      { id: 15, name: "boss slayer D2", icon: "⚡", file: "juego15.html", permiteGuardar: true },
      { id: 16, name: "Proyecto X", icon: "❓", file: "juego16.html", permiteGuardar: true },
      { id: 17, name: "puzle dezlizante", icon: "🧩", file: "juego17.html", permiteGuardar: true }
    ];

    const container = document.getElementById("games");
    let juegoSeleccionado = null;

    for (let i = 1; i <= 1000; i++) {
      const gameData = games.find(g => g.id === i);
      const card = document.createElement("article");

      if (gameData) {
        card.className = "card available";
        card.innerHTML = `
          <div class="icon">${gameData.icon}</div>
          <div class="name">${gameData.name}</div>
          <button class="play" onclick="clickJuego(${gameData.id})">JUGAR</button>
        `;
      } else {
        card.className = "card locked";
        card.innerHTML = `
          <div class="lock">🔒</div>
          <div class="name">Juego ${i}</div>
          <div class="badge">PRÓXIMAMENTE</div>
        `;
      }

      container.appendChild(card);
    }

    function clickJuego(id) {
      const g = games.find(item => item.id === id);
      if (!g) return;

      juegoSeleccionado = g;

      // Si el juego NO permite guardar (ej: Money Up), ir directo
      if (!g.permiteGuardar) {
        window.location.href = g.file;
        return;
      }

      // Si permite guardar, mostrar modal con opciones
      document.getElementById('modal-titulo-juego').innerText = g.name.toUpperCase();
      document.getElementById('alerta-sin-partida').style.display = 'none';
      document.getElementById('modal-partida').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal-partida').style.display = 'none';
      juegoSeleccionado = null;
    }

    function continuarPartida() {
      if (!juegoSeleccionado) return;

      const usuarios = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');
      const perfilUser = usuarios[usuarioActivo];

      // Verificar si existen datos guardados de este juego
      if (perfilUser && perfilUser.progreso && perfilUser.progreso[juegoSeleccionado.file]) {
        // Guardar indicador de carga de estado
        localStorage.setItem('pixelgames_action_' + juegoSeleccionado.file, 'load');
        window.location.href = juegoSeleccionado.file;
      } else {
        document.getElementById('alerta-sin-partida').style.display = 'block';
      }
    }

    function nuevaPartida() {
      if (!juegoSeleccionado) return;

      const usuarios = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');

      // Borrar partida anterior guardada si existía
      if (usuarios[usuarioActivo] && usuarios[usuarioActivo].progreso) {
        delete usuarios[usuarioActivo].progreso[juegoSeleccionado.file];
        localStorage.setItem('pixelgames_users', JSON.stringify(usuarios));
      }

      // Marcar para iniciar limpia
      localStorage.setItem('pixelgames_action_' + juegoSeleccionado.file, 'new');
      window.location.href = juegoSeleccionado.file;
    }
  </script>

</body>
</html>
