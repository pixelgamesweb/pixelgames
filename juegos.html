<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL GAMES - Menú de Juegos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      background: radial-gradient(circle at center, #1a1f35 0%, #080b12 100%);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
      transition: background 0.4s ease, border-color 0.4s ease;
      position: relative;
    }

    /* ESTILOS DE FONDOS */
    body.bg-rosa { background: radial-gradient(circle at center, #e84393 0%, #2d0b1e 100%) !important; }
    body.bg-lila { background: radial-gradient(circle at center, #8e44ad 0%, #1a052b 100%) !important; }
    body.bg-verde { background: radial-gradient(circle at center, #27ae60 0%, #052110 100%) !important; }
    body.bg-fuego { background: radial-gradient(circle at center, #d35400 0%, #2b0b00 100%) !important; }
    body.bg-cyberpunk { background: radial-gradient(circle at center, #0984e3 0%, #021a2d 100%) !important; }
    body.bg-dorado { background: radial-gradient(circle at center, #f1c40f 0%, #302700 100%) !important; }
    body.bg-rojo { background: radial-gradient(circle at center, #c0392b 0%, #240503 100%) !important; }
    body.bg-noche { background: radial-gradient(circle at center, #130f40 0%, #020112 100%) !important; }

    /* ESTILOS DE BORDES Y LATERALES */
    body.border-neon { border: 10px solid #00e5ff; }
    body.border-dorado { border: 10px solid #ffd700; box-shadow: inset 0 0 30px rgba(255, 215, 0, 0.5); }
    body.border-fuego { border: 10px solid #ff4757; box-shadow: inset 0 0 30px rgba(255, 71, 87, 0.5); }
    body.border-arcoiris { border: 10px solid #a55eea; }
    body.border-cristal { border: 10px solid #74b9ff; box-shadow: inset 0 0 30px rgba(116, 185, 255, 0.5); }
    body.border-hacker { border: 10px solid #55efc4; }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 42px;
      color: #00e5ff;
      text-shadow: 0 0 15px #00e5ff;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #8191aa;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* BARRA SUPERIOR CON MONEDAS */
    .user-bar {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-tag {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid #00e5ff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: #00e5ff;
      font-weight: bold;
    }

    .coins-tag {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid #ffd700;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      color: #ffd700;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .coins-tag:hover {
      transform: scale(1.08);
      background: rgba(255, 215, 0, 0.35);
    }

    .btn-cambiar-usuario {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #ff6b6b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-cambiar-usuario:hover {
      background: #e74c3c;
      color: #ffffff;
      transform: scale(1.05);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1200px;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 16px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 220px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card.available:hover {
      transform: translateY(-5px);
      border-color: #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .icon { font-size: 52px; margin-bottom: 10px; }
    .name { font-size: 22px; font-weight: 800; margin-bottom: 15px; color: #ffffff; }

    .play {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 13px;
      background: linear-gradient(180deg, #35a8ff, #1266e8);
      color: white;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 5px 0 #0844a0, 0 8px 18px rgba(0,100,255,.25);
      transition: transform 0.1s;
      cursor: pointer;
      border: none;
    }

    .play:hover { transform: scale(1.05); }
    .locked { opacity: .68; border-color: rgba(255,255,255,0.05); }
    .lock { font-size: 62px; margin-bottom: 13px; filter: drop-shadow(0 10px 5px rgba(0,0,0,.6)); }
    .locked .name { color: #aab6cc; }
    .badge {
      font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #8191aa;
      border: 1px solid rgba(255,255,255,.12); padding: 8px 13px; border-radius: 999px; background: rgba(0,0,0,.2);
    }

    /* MODAL TIENDA Y CATEGORÍAS */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(8, 11, 18, 0.92);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #0f172a;
      border: 2px solid #00e5ff;
      border-radius: 20px;
      padding: 25px;
      width: 92%;
      max-width: 550px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
    }

    .modal-card h2 { color: #00e5ff; font-size: 24px; margin-bottom: 5px; }

    .tabs-tienda {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0 10px;
    }

    .tab-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #aaa;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    .tab-btn.active {
      background: #00e5ff;
      color: #000;
      border-color: #00e5ff;
    }

    .shop-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .shop-item-info { text-align: left; }
    .shop-item-name { font-weight: bold; font-size: 13px; }
    .shop-item-cost { color: #ffd700; font-size: 12px; }

    .btn-buy {
      background: #ffd700;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .btn-buy:hover { background: #ffea70; }
    .btn-equip { background: #00e5ff; color: #000; }
    .btn-equipped { background: #2ecc71; color: #000; cursor: default; }

    .modal-btn {
      width: 100%; padding: 12px; margin-top: 10px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: bold; font-family: inherit; cursor: pointer; transition: all 0.2s;
    }

    .btn-continuar { background: #2ecc71; color: #080b12; }
    .btn-nueva { background: #e67e22; color: #ffffff; }
    .btn-cancelar { background: rgba(255,255,255,0.1); color: #8191aa; }
    .alerta-error { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; font-weight: bold; }

    @media(max-width:1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media(max-width:560px) { .grid { grid-template-columns: 1fr; width: 92%; } .card { min-height: 210px; } }
  </style>
</head>

<body>

  <header>
    <h1>PIXEL GAMES</h1>
    <div class="subtitle">ELIGE TU JUEGO</div>
    <div class="user-bar">
      <div class="user-tag" id="user-display">👤 Usuario: Invitado</div>
      <!-- HACIENDO CLIC EN EL VALOR DE LAS PIXELMONEDAS SE ABRE LA TIENDA -->
      <div class="coins-tag" id="coins-display" onclick="abrirTienda()">🪙 100 Pixelmonedas</div>
      <button class="btn-cambiar-usuario" onclick="cambiarUsuario()">🔄 CAMBIAR USUARIO</button>
    </div>
  </header>

  <main class="grid" id="games"></main>

  <!-- MODAL DE ELECCIÓN DE MODO DE JUEGO -->
  <div class="modal-overlay" id="modal-partida">
    <div class="modal-card">
      <h2 id="modal-titulo-juego">NOMBRE JUEGO</h2>
      <p style="color: #8191aa; font-size: 14px; margin-bottom: 20px;">¿Cómo deseas empezar tu partida?</p>

      <button class="modal-btn btn-continuar" onclick="continuarPartida()">▶️ CONTINUAR PARTIDA</button>
      <button class="modal-btn btn-nueva" onclick="nuevaPartida()">➕ NUEVA PARTIDA</button>
      
      <div class="alerta-error" id="alerta-sin-partida">❌ No tienes ninguna partida anterior guardada.</div>

      <button class="modal-btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <!-- MODAL TIENDA DE PIXELMONEDAS -->
  <div class="modal-overlay" id="modal-tienda">
    <div class="modal-card">
      <h2 style="color: #ffd700;">🛒 TIENDA DE PIXELMONEDAS</h2>
      <p style="color: #8191aa; font-size: 12px;">Compra y equipa fondos o bordes para personalizar tu menú</p>

      <div class="tabs-tienda">
        <button class="tab-btn active" onclick="filtrarTienda('fondo')">🎨 FONDOS</button>
        <button class="tab-btn" onclick="filtrarTienda('marco')">🖼️ MARCOS</button>
        <button class="tab-btn" onclick="filtrarTienda('extra')">✨ OTROS</button>
      </div>

      <div class="shop-items" id="shop-items-container"></div>

      <button class="modal-btn btn-cancelar" onclick="cerrarTienda()">Cerrar Tienda</button>
    </div>
  </div>

  <script>
    // 1. CARGA DE USUARIOS Y SALDO
    const usuarioActivo = localStorage.getItem('pixelgames_session');
    
    if (!usuarioActivo) {
      window.location.href = 'index.html';
    } else {
      document.getElementById('user-display').innerText = `👤 Usuario: ${usuarioActivo}`;
    }

    const usuarios = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');
    if (!usuarios[usuarioActivo]) {
      usuarios[usuarioActivo] = { password: '', progreso: {}, coins: 100, fondosComprados: ['normal'], fondoEquipado: 'normal' };
    }
    if (usuarios[usuarioActivo].coins === undefined) usuarios[usuarioActivo].coins = 100;
    if (!usuarios[usuarioActivo].fondosComprados) usuarios[usuarioActivo].fondosComprados = ['normal'];
    if (!usuarios[usuarioActivo].fondoEquipado) usuarios[usuarioActivo].fondoEquipado = 'normal';
    localStorage.setItem('pixelgames_users', JSON.stringify(usuarios));

    function actualizarMonedasUI() {
      const u = JSON.parse(localStorage.getItem('pixelgames_users') || '{}')[usuarioActivo];
      document.getElementById('coins-display').innerText = `🪙 ${u.coins} Pixelmonedas`;
      aplicarEstiloVisual(u.fondoEquipado);
    }

    function aplicarEstiloVisual(itemEquipado) {
      document.body.className = '';
      if (itemEquipado && itemEquipado !== 'normal') {
        document.body.classList.add(itemEquipado);
      }
    }

    actualizarMonedasUI();

    function cambiarUsuario() {
      if (confirm(`¿Quieres cerrar la sesión de "${usuarioActivo}" y cambiar de usuario?`)) {
        localStorage.removeItem('pixelgames_session');
        window.location.href = 'index.html';
      }
    }

    // LISTA DE JUEGOS
    const games = [
      { id: 1, name: "money up", icon: "🪙", file: "juego1.html", permiteGuardar: true },
      { id: 2, name: "batle", icon: "🌲", file: "juego2.html", permiteGuardar: true },
      { id: 3, name: "Football Legends", icon: "⚽", file: "juego3.html", permiteGuardar: true },
      { id: 4, name: "Pixel AI", icon: "🤖", file: "juego4.html", permiteGuardar: true },
      { id: 5, name: "ultra Laberintos", icon: "🧩", file: "juego5.html", permiteGuardar: true },
      { id: 6, name: "Dreamer up", icon: "🌙", file: "juego6.html", permiteGuardar: true },
      { id: 7, name: "4 en raya", icon: "🔴", file: "juego7.html", permiteGuardar: false },
      { id: 8, name: "serpiente de colores", icon: "💎", file: "juego8.html", permiteGuardar: false },
      { id: 9, name: "money up 2", icon: "🍎", file: "juego9.html", permiteGuardar: false },
      { id: 10, name: "Pizarra magnética", icon: "⚽", file: "juego10.html", permiteGuardar: false },
      { id: 11, name: "Ajedrez en 3D", icon: "♟️", file: "juego11.html", permiteGuardar: true },
      { id: 12, name: "Galaxy Defender", icon: "👾", file: "juego12.html", permiteGuardar: true },
      { id: 13, name: "Pixel Chat", icon: "💬", file: "juego13.html", permiteGuardar: false },
      { id: 14, name: "Valorar Web", icon: "⭐", file: "juego14.html", permiteGuardar: false },
      { id: 15, name: "boss slayer D2", icon: "⚡", file: "juego15.html", permiteGuardar: false },
      { id: 16, name: "Proyecto X", icon: "❓", file: "juego16.html", permiteGuardar: false },
      { id: 17, name: "puzle dezlizante", icon: "🧩", file: "juego17.html", permiteGuardar: false }
    ];

    const container = document.getElementById("games");
    let juegoSeleccionado = null;

    for (let i = 1; i <= 1000; i++) {
      const gameData = games.find(g => g.id === i);
      const card = document.createElement("article");

      if (gameData) {
        card.className = "card available";
        card.innerHTML = `
          <div class="icon">${gameData.icon}</div>
          <div class="name">${gameData.name}</div>
          <button class="play" onclick="clickJuego(${gameData.id})">JUGAR</button>
        `;
      } else {
        card.className = "card locked";
        card.innerHTML = `
          <div class="lock">🔒</div>
          <div class="name">Juego ${i}</div>
          <div class="badge">PRÓXIMAMENTE</div>
        `;
      }

      container.appendChild(card);
    }

    function clickJuego(id) {
      const g = games.find(item => item.id === id);
      if (!g) return;

      juegoSeleccionado = g;

      if (!g.permiteGuardar) {
        window.location.href = g.file;
        return;
      }

      document.getElementById('modal-titulo-juego').innerText = g.name.toUpperCase();
      document.getElementById('alerta-sin-partida').style.display = 'none';
      document.getElementById('modal-partida').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal-partida').style.display = 'none';
      juegoSeleccionado = null;
    }

    function continuarPartida() {
      if (!juegoSeleccionado) return;
      const u = JSON.parse(localStorage.getItem('pixelgames_users') || '{}')[usuarioActivo];

      if (u && u.progreso && u.progreso[juegoSeleccionado.file]) {
        localStorage.setItem('pixelgames_action_' + juegoSeleccionado.file, 'load');
        window.location.href = juegoSeleccionado.file;
      } else {
        document.getElementById('alerta-sin-partida').style.display = 'block';
      }
    }

    function nuevaPartida() {
      if (!juegoSeleccionado) return;
      const allUsers = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');

      if (allUsers[usuarioActivo] && allUsers[usuarioActivo].progreso) {
        delete allUsers[usuarioActivo].progreso[juegoSeleccionado.file];
        localStorage.setItem('pixelgames_users', JSON.stringify(allUsers));
      }

      localStorage.setItem('pixelgames_action_' + juegoSeleccionado.file, 'new');
      window.location.href = juegoSeleccionado.file;
    }

    /* CATÁLOGO COMPLETO DE PRODUCTOS */
    const productosTienda = [
      // CATEGORÍA FONDOS
      { id: 'normal', cat: 'fondo', name: 'Noche Cósmica (Predeterminado)', cost: 0 },
      { id: 'bg-lila', cat: 'fondo', name: 'Galaxia Lila 💜', cost: 50 },
      { id: 'bg-rosa', cat: 'fondo', name: 'Neón Rosa 💖', cost: 60 },
      { id: 'bg-verde', cat: 'fondo', name: 'Verde Matrix 💚', cost: 75 },
      { id: 'bg-fuego', cat: 'fondo', name: 'Oro & Fuego 🔥', cost: 100 },
      { id: 'bg-cyberpunk', cat: 'fondo', name: 'Cyberpunk Azul 🌌', cost: 120 },
      { id: 'bg-dorado', cat: 'fondo', name: 'Dorado VIP 👑', cost: 150 },
      { id: 'bg-rojo', cat: 'fondo', name: 'Rojo Carmesí 🔴', cost: 80 },
      { id: 'bg-noche', cat: 'fondo', name: 'Noche Oscura 🌑', cost: 40 },

      // CATEGORÍA MARCOS / BORDES
      { id: 'border-neon', cat: 'marco', name: 'Borde Neón Cian 🩵', cost: 80 },
      { id: 'border-dorado', cat: 'marco', name: 'Borde Dorado Imperial 👑', cost: 160 },
      { id: 'border-fuego', cat: 'marco', name: 'Borde Fuego Ardiente 🔥', cost: 130 },
      { id: 'border-arcoiris', cat: 'marco', name: 'Borde Arcoíris Mágico 🌈', cost: 180 },
      { id: 'border-cristal', cat: 'marco', name: 'Borde Cristal Helado ❄️', cost: 140 },
      { id: 'border-hacker', cat: 'marco', name: 'Borde Hacker Verde 💻', cost: 110 },

      // OTROS ACCESORIOS Y TÍTULOS
      { id: 't-leyenda', cat: 'extra', name: 'Título: Gamer Leyenda ⭐', cost: 200 },
      { id: 't-maestro', cat: 'extra', name: 'Título: Maestro Pixel 🎨', cost: 150 },
      { id: 't-campeon', cat: 'extra', name: 'Título: Campeón Pixel 🏆', cost: 250 },
      { id: 'eff-brillo', cat: 'extra', name: 'Brillo de Moneda Gigante 🪙', cost: 100 }
    ];

    let categoriaActual = 'fondo';

    function abrirTienda() {
      filtrarTienda('fondo');
      document.getElementById('modal-tienda').style.display = 'flex';
    }

    function cerrarTienda() {
      document.getElementById('modal-tienda').style.display = 'none';
    }

    function filtrarTienda(cat) {
      categoriaActual = cat;
      const btns = document.querySelectorAll('.tab-btn');
      btns.forEach(b => b.classList.remove('active'));

      if (cat === 'fondo') btns[0].classList.add('active');
      if (cat === 'marco') btns[1].classList.add('active');
      if (cat === 'extra') btns[2].classList.add('active');

      renderTienda();
    }

    function renderTienda() {
      const u = JSON.parse(localStorage.getItem('pixelgames_users') || '{}')[usuarioActivo];
      const shopContainer = document.getElementById('shop-items-container');
      shopContainer.innerHTML = '';

      const filtrados = productosTienda.filter(p => p.cat === categoriaActual);

      filtrados.forEach(f => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'shop-item';

        const poseido = u.fondosComprados.includes(f.id);
        const equipado = u.fondoEquipado === f.id;

        let botonHTML = '';
        if (equipado) {
          botonHTML = `<button class="btn-buy btn-equipped">EQUIPADO</button>`;
        } else if (poseido) {
          botonHTML = `<button class="btn-buy btn-equip" onclick="equiparProducto('${f.id}')">EQUIPAR</button>`;
        } else {
          botonHTML = `<button class="btn-buy" onclick="comprarProducto('${f.id}', ${f.cost})">COMPRAR</button>`;
        }

        itemDiv.innerHTML = `
          <div class="shop-item-info">
            <div class="shop-item-name">${f.name}</div>
            <div class="shop-item-cost">${f.cost === 0 ? 'Gratis' : `🪙 ${f.cost} Pixelmonedas`}</div>
          </div>
          ${botonHTML}
        `;

        shopContainer.appendChild(itemDiv);
      });
    }

    function comprarProducto(id, costo) {
      const allUsers = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');
      const u = allUsers[usuarioActivo];

      if (u.coins < costo) {
        alert('❌ No tienes suficientes Pixelmonedas.');
        return;
      }

      u.coins -= costo;
      u.fondosComprados.push(id);
      u.fondoEquipado = id;

      localStorage.setItem('pixelgames_users', JSON.stringify(allUsers));
      actualizarMonedasUI();
      renderTienda();
    }

    function equiparProducto(id) {
      const allUsers = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');
      allUsers[usuarioActivo].fondoEquipado = id;

      localStorage.setItem('pixelgames_users', JSON.stringify(allUsers));
      actualizarMonedasUI();
      renderTienda();
    }
  </script>

</body>
</html>
