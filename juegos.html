<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menú de Juegos</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  background:
    radial-gradient(circle at top,#263d80 0%,#10162f 35%,#03040a 100%);
}

body{
  overflow-x:hidden;
}

header{
  text-align:center;
  padding:35px 15px 25px;
}

header h1{
  margin:0;
  font-size:clamp(38px,7vw,72px);
  font-weight:900;
  text-shadow:0 8px 35px #000;
}

header p{
  margin:10px 0 0;
  opacity:.65;
}

#games{
  width:min(1250px,94%);
  margin:0 auto 50px;

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(245px,1fr)
    );

  gap:20px;
}

.game{
  position:relative;

  min-height:300px;

  padding:24px;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      #111827f5,
      #070911f5
    );

  border:1px solid #ffffff1b;

  box-shadow:
    0 15px 45px #0009;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  transition:
    transform .2s,
    border-color .2s;
}

.game:hover{
  transform:translateY(-5px);
  border-color:#ffffff45;
}

.icon{
  width:72px;
  height:72px;

  border-radius:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:38px;

  background:#ffffff10;

  border:1px solid #ffffff16;

  margin-bottom:16px;
}

.game h2{
  margin:0 0 8px;
  font-size:25px;
}

.game p{
  margin:0;
  line-height:1.45;
  opacity:.62;
  font-size:14px;
}

.status{
  position:absolute;
  right:15px;
  top:15px;

  padding:6px 9px;

  border-radius:9px;

  font-size:10px;
  font-weight:900;
}

.available{
  color:#62f49b;
  background:#2adf7620;
  border:1px solid #2adf7635;
}

.coming{
  color:#999;
  background:#ffffff0b;
  border:1px solid #ffffff15;
}

.play{
  width:100%;
  margin-top:20px;
  padding:14px;

  border:0;
  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #397fff,
      #1745b4
    );

  color:white;

  text-align:center;
  text-decoration:none;

  font-size:16px;
  font-weight:900;

  cursor:pointer;

  transition:
    filter .15s,
    transform .15s;
}

.play:hover{
  filter:brightness(1.15);
}

.play:active{
  transform:translateY(2px);
}

.disabled{
  background:#171a23;
  color:#777;
  cursor:default;
}

.game1{
  border-top:3px solid #55aaff;
}

.game2{
  border-top:3px solid #9d6cff;
}

.game3{
  border-top:3px solid #ffd52f;
}

.game4{
  border-top:3px solid #ff5c48;
}

.game5{
  border-top:3px solid #43df77;
}

footer{
  text-align:center;
  opacity:.4;
  padding:10px 20px 35px;
  font-size:12px;
}

@media(max-width:600px){

  #games{
    grid-template-columns:1fr;
  }

  .game{
    min-height:270px;
  }

}
</style>
</head>

<body>

  i<=200;
  i++
){

  const name =

  games.push({

    number:i,

    name:name,

    icon:
      i%8===0 ? "🚀" :
      i%8===1 ? "🎮" :
      i%8===2 ? "⚔️" :
      i%8===3 ? "🏆" :

    available:false

  });

/*

  document.getElementById(

  );

  game=>{

    const card =
      document.createElement(
        "section"
      );


    card.className =
      "game "+
      (
        game.number<=5
          ? "game"+game.number
          : ""
      );


    const status =
      game.available
        ? `
          <div class="status available">

        `
        : `
          <div class="status coming">

            class="play"
            href="${game.file}"
          >

        `

        : `

            class="play disabled"
          >

        </div>

        <h2>
          ${game.name}
        </h2>

        <p>
          ${game.description}
        </p>

      </div>

      ${button}

    `;


    container.appendChild(
      card
    );

  }
);
