<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos disponibles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00ffcc;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 800px;
            margin: auto;
        }

        .btn {
            display: inline-block;
            width: 200px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .btn-locked {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-locked:hover {
            background-color: #444;
            transform: none;
        }

        .btn-back {
            background-color: #ff3333;
            margin-top: 30px;
        }

        .btn-back:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <h1>🎮 Menú de Juegos 🎮</h1>

    <div class="container">
        <a href="juego1.html" class="btn">Juego 1</a>
        <a href="juego2.html" class="btn">Juego 2</a>
        <a href="juego3.html" class="btn">Juego 3</a>
        <a href="juego 4 pixel ai.html" class="btn">Juego 4</a>
        <a href="juego5.html" class="btn">Juego 5</a>
        <a href="juegos7.html" class="btn">Juego 7</a>
        <a href="juego8.html" class="btn">Juego 8</a>
        <a href="#" class="btn btn-locked">Juego 9 (Bloqueado)</a>
    </div>

    <br>
    <a href="index.html" class="btn btn-back">⬅ Volver al Inicio</a>

</body>
</html>
