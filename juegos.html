<title>Pixel Games</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 20%,rgba(105,40,255,.35),transparent 28%),
        radial-gradient(circle at 85% 25%,rgba(0,130,255,.30),transparent 28%),
        radial-gradient(circle at 50% 85%,rgba(210,40,255,.25),transparent 32%),
        radial-gradient(circle at 70% 70%,rgba(30,80,255,.18),transparent 25%),
        linear-gradient(135deg,#020207,#0b0718,#02030a);
    background-attachment:fixed;
}

/* ESTRELLAS */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.45;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#8ab4ff 1px,transparent 1px);

    background-size:
        95px 95px,
        145px 145px;

    background-position:
        10px 20px,
        50px 70px;
}

/* CABECERA */

header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:42px 18px 25px;
}

.logo{
    font-size:clamp(48px,10vw,86px);
    font-weight:900;
    letter-spacing:-3px;

    text-shadow:
        0 0 12px #744cff,
        0 0 30px #426cff,
        0 0 60px #a52cff;
}

.subtitle{
    margin-top:10px;
    opacity:.72;
    font-size:17px;
}

/* CONTENEDOR */

.container{
    position:relative;
    z-index:2;

    width:min(1200px,94%);
    margin:auto;
    padding-bottom:60px;
}

/* CONTADOR */

.counter{
    text-align:center;
    margin:10px 0 24px;
    opacity:.65;
}

/* JUEGOS */

#games{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px,1fr)
        );

    gap:15px;
}

/* TARJETA */

.game{
    min-height:145px;

    padding:18px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(0,0,0,.90),
            rgba(15,15,20,.92)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 12px 35px rgba(0,0,0,.55);

    transition:
        transform .18s,
        border-color .18s,
        box-shadow .18s;
}

.game:hover{
    transform:translateY(-5px);

    border-color:
        rgba(110,160,255,.65);

    box-shadow:
        0 18px 45px rgba(30,70,180,.25);
}

.number{
    font-size:12px;
    opacity:.45;
    margin-bottom:7px;
}

.name{
    font-size:19px;
    font-weight:800;
    line-height:1.2;
    min-height:46px;
}

.status{
    margin-top:5px;
    font-size:12px;
    opacity:.55;
}

.play{
    width:100%;
    margin-top:13px;

    border:1px solid #ffffff20;
    border-radius:11px;

    background:#000;
    color:#6faaff;

    padding:11px;

    font-weight:bold;
    cursor:pointer;

    transition:
        background .15s,
        transform .15s;
}

.play:hover{
    background:#101010;
    transform:scale(1.02);
}

.available .status{
    color:#64d98a;
}

.coming{
    opacity:.58;
}

.coming .play{
    color:#777;
    cursor:default;
}

footer{
    text-align:center;
    margin-top:35px;
    opacity:.4;
    font-size:12px;
}
</style>
</head>

        card.className =

            (
                game.ready
                    ? "available"
                    : "coming"
            );


        const number =
            document.createElement("div");

        number.className =
            "number";

            "JUEGO " +

        const name =
            document.createElement("div");

        name.className =
            "name";

        name.textContent =
            game.name;


        const status =
            document.createElement("div");

        status.className =
            "status";


        const button =
            document.createElement("button");

        button.className =
            "play";

            status.textContent =
                "Disponible";

            button.textContent =
                "JUGAR";


            /*
            ======================================
            ABRIR VIDEOJUEGO
            ======================================
            */

            button.onclick = function(){

                window.location.href =
                    game.file;

            };

        }
        else{

            status.textContent =
                "Próximamente";

            button.textContent =
                "PRÓXIMAMENTE";


            button.onclick = function(){

                alert(
                    game.name +
                    " todavía está en desarrollo."
                );

            };

        }


        card.appendChild(number);
        card.appendChild(name);
        card.appendChild(status);
        card.appendChild(button);

        gamesContainer.appendChild(card);

    }
