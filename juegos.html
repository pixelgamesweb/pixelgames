<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Pixel Games</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:white;
}

body{

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(100,50,255,.35),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 30%,
      rgba(0,160,255,.25),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 90%,
      rgba(220,40,255,.25),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #020207,
      #100820,
      #02030a
    );

  background-attachment:fixed;
}

header{

  padding:35px 20px 20px;
  text-align:center;

}

h1{

  margin:0;

  font-size:
    clamp(45px,9vw,80px);

  color:#fff;

  text-shadow:
    0 0 20px #7c4dff,
    0 0 45px #168bff;

}

.subtitle{

  opacity:.7;
  margin-top:10px;

}

#games{

  width:min(
    1100px,
    94%
  );

  margin:25px auto 50px;

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(230px,1fr)
    );

  gap:14px;

}

.game{

  min-height:110px;

  padding:18px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #050505ee,
      #111111ee
    );

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 12px 35px #0008;

  transition:
    transform .18s,
    border-color .18s;

}

.game:hover{

  transform:
    translateY(-4px);

  border-color:
    #5c8cffaa;

}

.name{

  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;

}

.status{

  font-size:12px;
  opacity:.55;

}

.play{

  margin-top:12px;

  width:100%;

  padding:10px;

  border-radius:10px;

  border:
    1px solid
    #ffffff20;

  background:#000;

  color:#6daaff;

  font-weight:bold;

}

.available{

  cursor:pointer;

}

.coming{

  opacity:.55;

}

</style>
</head>

<body>

<header>

  <h1>Pixel Games</h1>

  <div class="subtitle">
    100 juegos · un solo universo
  </div>

</header>


<main id="games"></main>


<script>

const games = [

  ["Spirit 3000", "ready"],
  ["Fútbol 3D Online", "ready"],
  ["Galaxy Battle", "ready"],
  ["Ultra 3D Kart", "ready"],

  ["Isla Perdida", "soon"],
  ["Supervivencia Zombie", "soon"],
  ["Defensa del Reino", "soon"],
  ["Ninja Arena", "soon"],
  ["Mega Run 3D", "soon"],
  ["Escape Lab", "soon"],
  ["Cazador de Monstruos", "soon"],
  ["Street Racing", "soon"],
  ["Helicopter Rescue", "soon"],
  ["Ocean Explorer", "soon"],
  ["Piratas del Horizonte", "soon"],
  ["Dragon World", "soon"],
  ["Robot Wars", "soon"],
  ["Planet Explorer", "soon"],
  ["Academia de Magia", "soon"],
  ["Mega Constructor", "soon"],

  ["Arqueros Legendarios", "soon"],
  ["Boxeo 3D", "soon"],
  ["Baloncesto Street", "soon"],
  ["Volleyball Arena", "soon"],
  ["Tennis Masters", "soon"],
  ["Golf World", "soon"],
  ["Snowboard Rush", "soon"],
  ["Surf Challenge", "soon"],
  ["Escalada Extrema", "soon"],
  ["Aqua Race", "soon"],

  ["Zombie City", "soon"],
  ["City Driver", "soon"],
  ["Taxi Simulator", "soon"],
  ["Firefighter Rescue", "soon"],
  ["Emergency Rescue", "soon"],
  ["Police Chase", "soon"],
  ["Farm World", "soon"],
  ["Truck Simulator", "soon"],
  ["Train Adventure", "soon"],
  ["Flight Simulator", "soon"],

  ["Hospital Simulator", "soon"],
  ["Burger Master", "soon"],
  ["Pizza Factory", "soon"],
  ["Hotel Empire", "soon"],
  ["Supermarket Tycoon", "soon"],
  ["City Builder", "soon"],
  ["Island Builder", "soon"],
  ["Castle Builder", "soon"],
  ["Mine World", "soon"],
  ["Treasure Hunter", "soon"],

  ["Lost Temple", "soon"],
  ["Desert Expedition", "soon"],
  ["Volcano Escape", "soon"],
  ["Arctic Survival", "soon"],
  ["Forest Mystery", "soon"],
  ["Underwater City", "soon"],
  ["Dinosaur Island", "soon"],
  ["Wild Nature", "soon"],
  ["Ocean Life", "soon"],
  ["Sky Explorer", "soon"],

  ["Night Hunters", "soon"],
  ["Alien Invasion", "soon"],
  ["Mech Arena", "soon"],
  ["UFO Defender", "soon"],
  ["Space Rangers", "soon"],
  ["Meteor Storm", "soon"],
  ["Black Hole Escape", "soon"],
  ["Space Colony", "soon"],
  ["Space Station", "soon"],
  ["Cosmic Runner", "soon"],

  ["Wizard Battle", "soon"],
  ["Fantasy Quest", "soon"],
  ["Medieval Warriors", "soon"],
  ["Kingdom Wars", "soon"],
  ["Dragon Hunter", "soon"],
  ["Dungeon Escape", "soon"],
  ["Sword Arena", "soon"],
  ["Monster Arena", "soon"],
  ["Demon Island", "soon"],
  ["Magic Forest", "soon"],

  ["Puzzle World", "soon"],
  ["Mystery Mansion", "soon"],
  ["Detective Case", "soon"],
  ["100 Doors", "soon"],
  ["Brain Challenge", "soon"],
  ["Strategy Kingdom", "soon"],
  ["Aim Master", "soon"],
  ["Tower Stack", "soon"],
  ["Bomb Escape", "soon"],
  ["Portal Runner", "soon"],

  ["Parkour City", "soon"],
  ["Olympic Challenge", "soon"],
  ["World Cup Challenge", "soon"],
  ["Winter Games", "soon"],
  ["Grand Prix", "soon"],
  ["Motorcycle Rush", "soon"],
  ["Bike Adventure", "soon"],
  ["Skate City", "soon"],
  ["Martial Arts Arena", "soon"],
  ["Pixel World", "soon"]

];


const container =
  document.getElementById(
    "games"
  );


games.forEach(
  (game,index)=>{

    const name =
      game[0];

    const status =
      game[1];


    const card =
      document.createElement(
        "article"
      );

    card.className =
      "game " +
      (
        status==="soon"
          ? "coming"
          : "available"
      );


    const title =
      document.createElement(
        "div"
      );

    title.className =
      "name";

    title.textContent =
      (
        index+1
      ) +
      ". " +
      name;


    const info =
      document.createElement(
        "div"
      );

    info.className =
      "status";


    if(
      status==="ready"
    ){

      info.textContent =
        "Disponible";

    }
    else{

      info.textContent =
        "Próximamente";

    }


    const button =
      document.createElement(
        "button"
      );

    button.className =
      "play";

    button.textContent =
      status==="ready"
        ? "JUGAR"
        : "PRÓXIMAMENTE";


    button.onclick=()=>{

      if(
        status==="soon"
      ){

        alert(
          name +
          " todavía está en desarrollo."
        );

        return;

      }


      /*
        Aquí conectaremos cada juego
        con su archivo cuando esté
        terminado.
      */

      if(
        name==="Spirit 3000"
      ){

        window.location.href =
          "ZZZ";

        return;

      }


      if(
        name==="Fútbol 3D Online"
      ){

        window.location.href =
          "ZZZ3";

        return;

      }


      if(
        name==="Galaxy Battle"
      ){

        window.location.href =
          "ZZZ4";

        return;

      }


      if(
        name==="Ultra 3D Kart"
      ){

        window.location.href =
          "ultra_3d_kart";

        return;

      }

    };


    card.appendChild(
      title
    );

    card.appendChild(
      info
    );

    card.appendChild(
      button
    );


    container.appendChild(
      card
    );

  }

);

</script>

</body>
</html>
