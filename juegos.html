<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL GAMES - Menú de Juegos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      background: radial-gradient(circle at center, #1a1f35 0%, #080b12 100%);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
      transition: background 0.4s ease, border-color 0.4s ease;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 42px;
      color: #00e5ff;
      text-shadow: 0 0 15px #00e5ff;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #8191aa;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* BARRA SUPERIOR CON MONEDAS Y USUARIO */
    .user-bar {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-tag {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid #00e5ff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: #00e5ff;
      font-weight: bold;
    }

    .coins-tag {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid #ffd700;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      color: #ffd700;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .coins-tag:hover {
      transform: scale(1.08);
      background: rgba(255, 215, 0, 0.35);
    }

    .btn-cambiar-usuario {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #ff6b6b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-cambiar-usuario:hover {
      background: #e74c3c;
      color: #ffffff;
      transform: scale(1.05);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1200px;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 16px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 220px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card.available:hover {
      transform: translateY(-5px);
      border-color: #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .icon { font-size: 52px; margin-bottom: 10px; }
    .name { font-size: 22px; font-weight: 800; margin-bottom: 15px; color: #ffffff; }

    .play {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 13px;
      background: linear-gradient(180deg, #35a8ff, #1266e8);
      color: white;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 5px 0 #0844a0, 0 8px 18px rgba(0,100,255,.25);
      transition: transform 0.1s;
      cursor: pointer;
      border: none;
    }

    .play:hover { transform: scale(1.05); }
    .locked { opacity: .68; border-color: rgba(255,255,255,0.05); }
    .lock { font-size: 62px; margin-bottom: 13px; filter: drop-shadow(0 10px 5px rgba(0,0,0,.6)); }
    .locked .name { color: #aab6cc; }
    .badge {
      font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #8191aa;
      border: 1px solid rgba(255,255,255,.12); padding: 8px 13px; border-radius: 999px; background: rgba(0,0,0,.2);
    }

    /* MODALES DE TIENDA Y ESPÍRITUS */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(8, 11, 18, 0.92);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #0f172a;
      border: 2px solid #00e5ff;
      border-radius: 20px;
      padding: 25px;
      width: 92%;
      max-width: 620px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
    }

    .modal-card h2 { color: #00e5ff; font-size: 24px; margin-bottom: 5px; }

    .nav-tienda {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0 10px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #aaa;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-btn.active {
      background: #ffd700;
      color: #000;
      border-color: #ffd700;
    }

    .spirit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .spirit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .spirit-info { text-align: left; }
    .spirit-name { font-weight: bold; font-size: 14px; }
    
    /* COLORES SEGÚN RARIDAD */
    .rarity-comun { color: #a4b0be; }
    .rarity-raro { color: #1e90ff; }
    .rarity-epico { color: #a55eea; }
    .rarity-legendario { color: #ffa502; }
    .rarity-mitico { color: #ff4757; }
    .rarity-especial { color: #2ed573; text-shadow: 0 0 8px #2ed573; }

    .btn-buy {
      background: #ffd700;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .btn-buy:hover { background: #ffea70; }
    .btn-owned { background: #2ed573; color: #000; cursor: default; }

    .modal-btn {
      width: 100%; padding: 12px; margin-top: 10px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: bold; font-family: inherit; cursor: pointer; transition: all 0.2s;
    }

    .btn-continuar { background: #2ecc71; color: #080b12; }
    .btn-nueva { background: #e67e22; color: #ffffff; }
    .btn-cancelar { background: rgba(255,255,255,0.1); color: #8191aa; }
    .alerta-error { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; font-weight: bold; }

    /* AVISO BONO EN PANTALLA */
    #bonus-alert {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #2ed573;
      color: #000;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(46, 213, 115, 0.6);
      display: none;
      z-index: 200;
    }
  </style>
</head>

<body>

  <div id="bonus-alert">🎁 ¡Bonus de Entrada: +1.000 Pixelmonedas!</div>

  <header>
    <h1>PIXEL GAMES</h1>
    <div class="subtitle">ELIGE TU JUEGO</div>
    <div class="user-bar">
      <div class="user-tag" id="user-display">👤 Usuario: Invitado</div>
      <!-- HACIENDO CLIC AQUÍ SE ABRE LA TIENDA Y COLECCIÓN DE ESPÍRITUS -->
      <div class="coins-tag" id="coins-display" onclick="abrirTiendaEspiritus()">🪙 0 Pixelmonedas</div>
      <button class="btn-cambiar-usuario" onclick="cambiarUsuario()">🔄 CAMBIAR USUARIO</button>
    </div>
  </header>

  <main class="grid" id="games"></main>

  <!-- MODAL DE ELECCIÓN DE MODO DE JUEGO -->
  <div class="modal-overlay" id="modal-partida">
    <div class="modal-card">
      <h2 id="modal-titulo-juego">NOMBRE JUEGO</h2>
      <p style="color: #8191aa; font-size: 14px; margin-bottom: 20px;">¿Cómo deseas empezar tu partida?</p>

      <button class="modal-btn btn-continuar" onclick="continuarPartida()">▶️ CONTINUAR PARTIDA</button>
      <button class="modal-btn btn-nueva" onclick="nuevaPartida()">➕ NUEVA PARTIDA</button>
      
      <div class="alerta-error" id="alerta-sin-partida">❌ No tienes ninguna partida anterior guardada.</div>

      <button class="modal-btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <!-- MODAL DE TIENDA Y COLECCIÓN DE ESPÍRITUS -->
  <div class="modal-overlay" id="modal-tienda">
    <div class="modal-card">
      <h2 style="color: #ffd700;">👻 TIENDA & COLECCIÓN DE ESPÍRITUS</h2>
      <p style="color: #8191aa; font-size: 12px;" id="subtitulo-coleccion">Colecciona los 150 espíritus de Pixel Games</p>

      <div class="nav-tienda">
        <button class="nav-btn active" id="btn-tab-tienda" onclick="cambiarTab('tienda')">🛒 COMPRAR ESPÍRITUS</button>
        <button class="nav-btn" id="btn-tab-coleccion" onclick="cambiarTab('coleccion')">👻 MI COLECCIÓN</button>
      </div>

      <div class="spirit-list" id="spirit-list-container"></div>

      <button class="modal-btn btn-cancelar" onclick="cerrarTiendaEspiritus()">Cerrar Ventana</button>
    </div>
  </div>

  <script>
    // 1. GESTIÓN DE SESIÓN Y REGALO DIARIO DE 1000 PIXELMONEDAS
    const usuarioActivo = localStorage.getItem('pixelgames_session');
    
    if (!usuarioActivo) {
      window.location.href = 'index.html';
    } else {
      document.getElementById('user-display').innerText = `👤 Usuario: ${usuarioActivo}`;
    }

    const usuarios = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');
    if (!usuarios[usuarioActivo]) {
      usuarios[usuarioActivo] = { password: '', progreso: {}, coins: 0, espiritusComprados: [] };
    }
    if (usuarios[usuarioActivo].coins === undefined) usuarios[usuarioActivo].coins = 0;
    if (!usuarios[usuarioActivo].espiritusComprados) usuarios[usuarioActivo].espiritusComprados = [];

    // OTORGAR +1000 PIXELMONEDAS AL ENTRAR
    usuarios[usuarioActivo].coins += 1000;
    localStorage.setItem('pixelgames_users', JSON.stringify(usuarios));

    function mostrarBonusAlert() {
      const alertBox = document.getElementById('bonus-alert');
      alertBox.style.display = 'block';
      setTimeout(() => alertBox.style.display = 'none', 3000);
    }

    function actualizarMonedasUI() {
      const u = JSON.parse(localStorage.getItem('pixelgames_users') || '{}')[usuarioActivo];
      document.getElementById('coins-display').innerText = `🪙 ${u.coins} Pixelmonedas`;
    }

    actualizarMonedasUI();
    mostrarBonusAlert();

    function cambiarUsuario() {
      if (confirm(`¿Quieres cerrar la sesión de "${usuarioActivo}" y cambiar de usuario?`)) {
        localStorage.removeItem('pixelgames_session');
        window.location.href = 'index.html';
      }
    }

    // LISTA DE JUEGOS
    const games = [
      { id: 1, name: "money up", icon: "🪙", file: "juego1.html", permiteGuardar: true },
      { id: 2, name: "batle", icon: "🌲", file: "juego2.html", permiteGuardar: true },
      { id: 3, name: "Football Legends", icon: "⚽", file: "juego3.html", permiteGuardar: true },
      { id: 4, name: "Pixel AI", icon: "🤖", file: "juego4.html", permiteGuardar: true },
      { id: 5, name: "ultra Laberintos", icon: "🧩", file: "juego5.html", permiteGuardar: true },
      { id: 6, name: "Dreamer up", icon: "🌙", file: "juego6.html", permiteGuardar: true },
      { id: 7, name: "4 en raya", icon: "🔴", file: "juego7.html", permiteGuardar: false },
      { id: 8, name: "serpiente de colores", icon: "💎", file: "juego8.html", permiteGuardar: false },
      { id: 9, name: "money up 2", icon: "🍎", file: "juego9.html", permiteGuardar: false },
      { id: 10, name: "Pizarra magnética", icon: "⚽", file: "juego10.html", permiteGuardar: false },
      { id: 11, name: "Ajedrez en 3D", icon: "♟️", file: "juego11.html", permiteGuardar: true },
      { id: 12, name: "Galaxy Defender", icon: "👾", file: "juego12.html", permiteGuardar: true },
      { id: 13, name: "Pixel Chat", icon: "💬", file: "juego13.html", permiteGuardar: false },
      { id: 14, name: "Valorar Web", icon: "⭐", file: "juego14.html", permiteGuardar: false },
      { id: 15, name: "boss slayer D2", icon: "⚡", file: "juego15.html", permiteGuardar: false },
      { id: 16, name: "Proyecto X", icon: "❓", file: "juego16.html", permiteGuardar: false },
      { id: 17, name: "puzle dezlizante", icon: "🧩", file: "juego17.html", permiteGuardar: false }
    ];

    const container = document.getElementById("games");
    let juegoSeleccionado = null;

    for (let i = 1; i <= 1000; i++) {
      const gameData = games.find(g => g.id === i);
      const card = document.createElement("article");

      if (gameData) {
        card.className = "card available";
        card.innerHTML = `
          <div class="icon">${gameData.icon}</div>
          <div class="name">${gameData.name}</div>
          <button class="play" onclick="clickJuego(${gameData.id})">JUGAR</button>
        `;
      } else {
        card.className = "card locked";
        card.innerHTML = `
          <div class="lock">🔒</div>
          <div class="name">Juego ${i}</div>
          <div class="badge">PRÓXIMAMENTE</div>
        `;
      }

      container.appendChild(card);
    }

    function clickJuego(id) {
      const g = games.find(item => item.id === id);
      if (!g) return;

      juegoSeleccionado = g;

      if (!g.permiteGuardar) {
        window.location.href = g.file;
        return;
      }

      document.getElementById('modal-titulo-juego').innerText = g.name.toUpperCase();
      document.getElementById('alerta-sin-partida').style.display = 'none';
      document.getElementById('modal-partida').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal-partida').style.display = 'none';
      juegoSeleccionado = null;
    }

    function continuarPartida() {
      if (!juegoSeleccionado) return;
      const u = JSON.parse(localStorage.getItem('pixelgames_users') || '{}')[usuarioActivo];

      if (u && u.progreso && u.progreso[juegoSeleccionado.file]) {
        localStorage.setItem('pixelgames_action_' + juegoSeleccionado.file, 'load');
        window.location.href = juegoSeleccionado.file;
      } else {
        document.getElementById('alerta-sin-partida').style.display = 'block';
      }
    }

    function nuevaPartida() {
      if (!juegoSeleccionado) return;
      const allUsers = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');

      if (allUsers[usuarioActivo] && allUsers[usuarioActivo].progreso) {
        delete allUsers[usuarioActivo].progreso[juegoSeleccionado.file];
        localStorage.setItem('pixelgames_users', JSON.stringify(allUsers));
      }

      localStorage.setItem('pixelgames_action_' + juegoSeleccionado.file, 'new');
      window.location.href = juegoSeleccionado.file;
    }

    /* GENERADOR DE LOS 150 ESPÍRITUS */
    const raridades = [
      { nombre: 'comun', label: 'Común', precio: 100 },
      { nombre: 'raro', label: 'Raro', precio: 250 },
      { nombre: 'epico', label: 'Épico', precio: 500 },
      { nombre: 'legendario', label: 'Legendario', precio: 1000 },
      { nombre: 'mitico', label: 'Mítico', precio: 2500 },
      { nombre: 'especial', label: 'Especial', precio: 5000 }
    ];

    const nombresNube = ["Tramposo", "Campeón Slime", "Sombra Carmesí", "Espectro Neón", "Fuego Fatuo", "Alma Helada", "Aura Dorada", "Centinela Pixel", "Rayo Azul", "Titán Galáctico", "Duende Rojo", "Orbe Oscuro", "Guardián Ancestral", "Espíritu Fénix", "Sombra Lunar", "Rayo Solar", "Caminante Estelar", "Señor Slime", "Espíritu Dragón", "Nube Mágica"];

    const catalogoEspiritus = [];

    for (let i = 1; i <= 150; i++) {
      let rIdx = 0;
      if (i > 40) rIdx = 1;
      if (i > 80) rIdx = 2;
      if (i > 110) rIdx = 3;
      if (i > 135) rIdx = 4;
      if (i > 145) rIdx = 5;

      const rObj = raridades[rIdx];
      const baseNombre = nombresNube[(i - 1) % nombresNube.length];
      
      catalogoEspiritus.push({
        id: i,
        nombre: `${baseNombre} #${i}`,
        raridadKey: rObj.nombre,
        raridadLabel: rObj.label,
        precio: rObj.precio
      });
    }

    let tabActual = 'tienda';

    function abrirTiendaEspiritus() {
      cambiarTab('tienda');
      document.getElementById('modal-tienda').style.display = 'flex';
    }

    function cerrarTiendaEspiritus() {
      document.getElementById('modal-tienda').style.display = 'none';
    }

    function cambiarTab(tab) {
      tabActual = tab;
      document.getElementById('btn-tab-tienda').classList.toggle('active', tab === 'tienda');
      document.getElementById('btn-tab-coleccion').classList.toggle('active', tab === 'coleccion');
      renderListaEspiritus();
    }

    function renderListaEspiritus() {
      const u = JSON.parse(localStorage.getItem('pixelgames_users') || '{}')[usuarioActivo];
      const listContainer = document.getElementById('spirit-list-container');
      const subtitulo = document.getElementById('subtitulo-coleccion');
      listContainer.innerHTML = '';

      if (tabActual === 'tienda') {
        subtitulo.innerText = "Compra espíritus con tus Pixelmonedas";
        
        catalogoEspiritus.forEach(esp => {
          const poseido = u.espiritusComprados.includes(esp.id);
          const itemDiv = document.createElement('div');
          itemDiv.className = 'spirit-item';

          itemDiv.innerHTML = `
            <div class="spirit-info">
              <div class="spirit-name">${esp.nombre}</div>
              <div class="rarity-${esp.raridadKey}" style="font-size:12px; font-weight:bold;">${esp.raridadLabel}</div>
            </div>
            ${poseido 
              ? `<button class="btn-buy btn-owned">DESBLOQUEADO</button>` 
              : `<button class="btn-buy" onclick="comprarEspiritu(${esp.id}, ${esp.precio})">🪙 ${esp.precio}</button>`}
          `;
          listContainer.appendChild(itemDiv);
        });

      } else {
        const totalComprados = u.espiritusComprados.length;
        subtitulo.innerText = `Has desbloqueado ${totalComprados} de 150 espíritus`;

        if (totalComprados === 0) {
          listContainer.innerHTML = `<p style="color:#aaa; font-size:14px; margin-top:20px;">Aún no tienes espíritus en tu colección. ¡Cómpralos en la tienda!</p>`;
          return;
        }

        catalogoEspiritus.filter(esp => u.espiritusComprados.includes(esp.id)).forEach(esp => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'spirit-item';

          itemDiv.innerHTML = `
            <div class="spirit-info">
              <div class="spirit-name">${esp.nombre}</div>
              <div class="rarity-${esp.raridadKey}" style="font-size:12px; font-weight:bold;">${esp.raridadLabel}</div>
            </div>
            <button class="btn-buy btn-owned">✅ EN TU PODER</button>
          `;
          listContainer.appendChild(itemDiv);
        });
      }
    }

    function comprarEspiritu(id, precio) {
      const allUsers = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');
      const u = allUsers[usuarioActivo];

      if (u.coins < precio) {
        alert('❌ No tienes suficientes Pixelmonedas.');
        return;
      }

      u.coins -= precio;
      u.espiritusComprados.push(id);

      localStorage.setItem('pixelgames_users', JSON.stringify(allUsers));
      actualizarMonedasUI();
      renderListaEspiritus();
    }
  </script>

</body>
</html>
