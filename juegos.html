<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú de Juegos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #1a1a1a;
      color: white;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #333;
      padding: 20px;
      font-size: 24px;
    }
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
    }
    .button {
      background-color: #4CAF50; /* Verde */
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 10px 0;
      cursor: pointer;
      border-radius: 8px;
      width: 200px;
    }
    .button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <header>
    Selecciona un Juego
  </header>

  <div class="menu">
    <a href="juego1.html" class="button">Juego 1</a>
    <a href="juego2.html" class="button">Juego 2</a>
    <a href="juego3.html" class="button">Juego 3</a>
    <a href="juego 4 pixel ai.html" class="button">Juego 4</a>
    <a href="juego5.html" class="button">Juego 5</a>
    <a href="juegos7.html" class="button">Juego 7</a>
    <a href="juego 8.html" class="button">Juego 8</a>
  </div>

</body>
</html>
