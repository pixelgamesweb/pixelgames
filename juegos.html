<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Games - Juegos</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:white;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(80,120,255,.25), transparent 25%),
    radial-gradient(circle at 85% 70%, rgba(180,70,255,.20), transparent 28%),
    linear-gradient(135deg,#050816,#101735,#070a18);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:80px 80px,130px 130px;
  background-position:10px 20px,50px 70px;
  opacity:.25;
}

header{
  text-align:center;
  padding:42px 20px 25px;
  position:relative;
  z-index:2;
}

.logo{
  margin:0;
  font-size:clamp(48px,9vw,78px);
  font-weight:900;
  letter-spacing:4px;
  text-shadow:
    4px 4px 0 #111,
    0 0 18px rgba(255,255,255,.35);
}

.subtitle{
  margin-top:10px;
  font-size:18px;
  color:rgba(255,255,255,.75);
}

.container{
  width:94%;
  max-width:1250px;
  margin:auto;
  position:relative;
  z-index:2;
  padding-bottom:50px;
}

.section-title{
  text-align:center;
  margin:25px 0 28px;
  font-size:clamp(42px,7vw,64px);
  font-weight:900;
  text-shadow:3px 3px 0 #111;
}

.games-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}

.game{
  min-height:220px;
  padding:22px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(10,15,40,.72);
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:.2s;
  backdrop-filter:blur(5px);
}

.game.available:hover{
  transform:translateY(-7px);
  border-color:rgba(255,255,255,.5);
}

.game-icon{
  font-size:54px;
  margin-bottom:10px;
}

.game-number{
  font-size:14px;
  font-weight:bold;
  color:#8eaaff;
  margin-bottom:5px;
}

.game-name{
  font-size:24px;
  font-weight:900;
  margin-bottom:18px;
}

.play{
  display:inline-block;
  padding:12px 25px;
  border-radius:14px;
  background:#050505;
  border:1px solid rgba(255,255,255,.25);
  color:white;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.play:hover{
  transform:scale(1.05);
  background:#151515;
}

.locked{
  opacity:.55;
}

.lock{
  font-size:48px;
  margin-bottom:12px;
}

.locked .game-name{
  margin-bottom:0;
}

@media(max-width:900px){
  .games-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:520px){
  .games-grid{
    grid-template-columns:1fr;
  }

  .game{
    min-height:200px;
  }
}
</style>
</head>

<body>

<header>
  <h1 class="logo">PIXEL GAMES</h1>
  <div class="subtitle">Tu juego, tu aventura</div>
</header>

<main class="container">

  <h2 class="section-title">JUEGOS</h2>

  <div class="games-grid">

    <!-- JUEGO 1 -->
    <div class="game available">
      <div class="game-icon">🪙</div>
      <div class="game-number">JUEGO 1</div>
      <div class="game-name">Juego 1</div>
      <a class="play" href="juego1.html">JUGAR</a>
    </div>

    <!-- JUEGO 2 -->
    <div class="game available">
      <div class="game-icon">🎮</div>
      <div class="game-number">JUEGO 2</div>
      <div class="game-name">Juego 2</div>
      <a class="play" href="juego2.html">JUGAR</a>
    </div>

    <!-- JUEGO 3 -->
    <div class="game available">
      <div class="game-icon">⚽</div>
      <div class="game-number">JUEGO 3</div>
      <div class="game-name">Juego 3</div>
      <a class="play" href="juego3.html">JUGAR</a>
    </div>

    <!-- JUEGO 4 - PIXEL AI -->
    <div class="game available">
      <div class="game-icon">🤖</div>
      <div class="game-number">JUEGO 4</div>
      <div class="game-name">Pixel AI</div>
      <a class="play" href="juego 4 pixel ai.html">USAR</a>
    </div>

    <!-- JUEGO 5 - MEGA LABERINTOS -->
    <div class="game available">
      <div class="game-icon">🧩</div>
      <div class="game-number">JUEGO 5</div>
      <div class="game-name">Mega Laberintos</div>
      <a class="play" href="juego5.html">JUGAR</a>
    </div>

    <!-- JUEGO 6 -->
    <div class="game locked">
      <div class="lock">🔒</div>
      <div class="game-number">JUEGO 6</div>
      <div class="game-name">Bloqueado</div>
    </div>

    <!-- JUEGO 7 -->
    <div class="game locked">
      <div class="lock">🔒</div>
      <div class="game-number">JUEGO 7</div>
      <div class="game-name">Bloqueado</div>
    </div>

    <!-- JUEGO 8 -->
    <div class="game locked">
      <div class="lock">🔒</div>
      <div class="game-number">JUEGO 8</div>
      <div class="game-name">Bloqueado</div>
    </div>

  </div>

</main>

</body>
</html>
