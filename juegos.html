<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%,#653cff55,transparent 28%),
    radial-gradient(circle at 85% 20%,#168bff44,transparent 28%),
    radial-gradient(circle at 50% 90%,#d52cff38,transparent 35%),
    radial-gradient(circle at 80% 75%,#2d5cff22,transparent 25%),
    linear-gradient(135deg,#010106,#0c061c,#02030a);
  background-attachment:fixed;
}

/* ESTRELLAS */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.45;

  background-image:
    radial-gradient(circle,#ffffff 1px,transparent 1px),
    radial-gradient(circle,#8ab4ff 1px,transparent 1px);

  background-size:
    90px 90px,
    150px 150px;

  background-position:
    10px 20px,
    50px 80px;
}

/* CABECERA */

header{
  position:relative;
  z-index:2;
  text-align:center;
  padding:38px 15px 22px;
}

.logo{
  font-size:clamp(48px,10vw,85px);
  font-weight:900;
  letter-spacing:-3px;

  text-shadow:
    0 0 15px #754cff,
    0 0 35px #3f7cff,
    0 0 65px #b32cff;
}

.subtitle{
  margin-top:9px;
  opacity:.7;
  font-size:16px;
}

/* CONTENEDOR */

.container{
  position:relative;
  z-index:2;
  width:min(1200px,94%);
  margin:auto;
  padding-bottom:60px;
}

.counter{
  text-align:center;
  opacity:.6;
  margin:10px 0 24px;
}

/* GRID */

#games{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(230px,1fr)
    );
  gap:15px;
}

/* TARJETAS */

.game{
  min-height:145px;
  padding:18px;

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      #030303ee,
      #121218ee
    );

  border:1px solid #ffffff18;

  box-shadow:
    0 12px 35px #0009;

  transition:
    transform .18s,
    border-color .18s,
    box-shadow .18s;
}

.game:hover{
  transform:translateY(-5px);

  border-color:#6c9dff99;

  box-shadow:
    0 18px 45px #2450a533;
}

.number{
  font-size:11px;
  opacity:.4;
  margin-bottom:7px;
}

.name{
  font-size:18px;
  font-weight:800;
  min-height:44px;
  line-height:1.2;
}

.status{
  margin-top:5px;
  font-size:12px;
  opacity:.55;
}

.play{
  width:100%;
  margin-top:13px;

  padding:11px;

  border-radius:11px;

  border:1px solid #ffffff20;

  background:#000;

  color:#6ca9ff;

  font-weight:bold;

  cursor:pointer;
}

.play:hover{
  background:#111;
}

.available .status{
  color:#55df88;
}

.coming{
  opacity:.55;
}

.coming .play{
  color:#777;
}

footer{
  text-align:center;
  margin-top:35px;
  opacity:.35;
  font-size:12px;
}
</style>

   CREAR TARJETAS
========================================= */

const container =
  document.getElementById("games");


games.forEach(
  (game,index)=>{

    const card =
      document.createElement("article");

    card.className =
      "game " +
      (
        game.ready
          ? "available"
          : "coming"
      );


    const number =
      document.createElement("div");

    number.className =
      "number";

    number.textContent =
      "JUEGO " +
      (index + 1);


    const name =
      document.createElement("div");

    name.className =
      "name";

    name.textContent =
      game.name;


    const status =
      document.createElement("div");

    status.className =
      "status";


    const button =
      document.createElement("button");

    button.className =
      "play";


    if(game.ready){

      status.textContent =
        "Disponible";

      button.textContent =
        "JUGAR";


      button.onclick =
        function(){

          /*
          ====================================
          ABRIR JUEGO
          ====================================
          */

          window.location.href =
            game.file;

        };

    }

    else{

      status.textContent =
        "Próximamente";

      button.textContent =
        "PRÓXIMAMENTE";


      button.onclick =
        function(){

          alert(
            game.name +
            " todavía está en desarrollo."
          );

        };

    }


    card.appendChild(number);
    card.appendChild(name);
    card.appendChild(status);
    card.appendChild(button);

    container.appendChild(card);

  }
);
