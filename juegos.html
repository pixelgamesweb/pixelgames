<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Games - Juegos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:white}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 20%,rgba(120,70,210,.55),transparent 30%),radial-gradient(circle at 85% 20%,rgba(30,110,220,.45),transparent 30%),radial-gradient(circle at 50% 85%,rgba(190,40,150,.4),transparent 32%),radial-gradient(circle at 90% 90%,rgba(40,60,180,.5),transparent 30%),linear-gradient(135deg,#02020a,#11102b,#050510)}
body::before{content:"";position:fixed;inset:-40px;background:radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 2px);background-size:75px 75px;opacity:.4;filter:blur(1px);pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,transparent 20%,rgba(0,0,0,.3) 100%);pointer-events:none}
header{position:relative;z-index:2;text-align:center;padding:45px 20px 25px}
.logo{margin:0;font-size:clamp(48px,9vw,78px);font-weight:900;letter-spacing:4px;color:#000;text-shadow:0 2px 0 rgba(255,255,255,.4),0 0 18px rgba(255,255,255,.35)}
.subtitle{margin-top:12px;color:rgba(255,255,255,.75);font-size:18px}
.container{position:relative;z-index:2;width:94%;max-width:1250px;margin:auto;padding-bottom:60px}
.section-title{text-align:center;margin:25px 0 28px;font-size:clamp(42px,7vw,64px);font-weight:900;color:#000;letter-spacing:3px;text-shadow:0 2px 0 rgba(255,255,255,.4),0 0 18px rgba(255,255,255,.3)}
.games-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.game{min-height:200px;padding:22px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.35);box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;justify-content:space-between;backdrop-filter:blur(8px)}
.game.available:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.5)}
.game-icon{font-size:42px}.game-number{margin-top:8px;color:#bfc5e8;font-size:14px;font-weight:bold}.game-name{margin-top:6px;font-size:20px;font-weight:800}.play-button{display:block;margin-top:18px;padding:12px;border-radius:12px;background:#000;color:#fff;text-decoration:none;text-align:center;font-weight:900;border:1px solid rgba(255,255,255,.18)}
.lock{font-size:48px}.coming-soon{opacity:.7;min-height:170px}
@media(max-width:900px){.games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.games-grid{grid-template-columns:1fr}.container{width:90%}}
</style>
</head>
<body>
<header>
<div class="logo">PIXEL GAMES</div>
<div class="subtitle">Tu juego. Tu aventura.</div>
</header>
<main class="container">
<h1 class="section-title">Juegos</h1>
<div class="games-grid">
<div class="game available"><div><div class="game-icon">🪙</div><div class="game-number">JUEGO 1</div><div class="game-name">Juego de Monedas</div></div><a class="play-button" href="juego1.html">▶ JUGAR</a></div>
<div class="game available"><div><div class="game-icon">🎮</div><div class="game-number">JUEGO 2</div><div class="game-name">Spirit Wilds</div></div><a class="play-button" href="juego2.html">▶ JUGAR</a></div>
<div class="game available"><div><div class="game-icon">⚽</div><div class="game-number">JUEGO 3</div><div class="game-name">Fútbol 3D Online</div></div><a class="play-button" href="juego3.html">▶ JUGAR</a></div>
<div class="game available"><div><div class="game-icon">🏎️</div><div class="game-number">JUEGO 4</div><div class="game-name">Ultra 3D Kart</div></div><a class="play-button" href="juego4.html">▶ JUGAR</a></div>
</div>
<div class="games-grid" id="lockedGames" style="margin-top:20px"></div>
</main>
<script>
const container=document.getElementById('lockedGames');
for(let i=5;i<=100;i++){
 const game=document.createElement('div');game.className='game coming-soon';
 game.innerHTML='<div><div class="lock">🔒</div><div class="game-number">JUEGO '+i+'</div><div class="game-name">Bloqueado</div></div>';
 container.appendChild(game);
}
</script>
</body>
</html>
