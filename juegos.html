<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Games - Juegos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #35206b 0, transparent 30%),
        radial-gradient(circle at 80% 70%, #182d67 0, transparent 30%),
        linear-gradient(135deg, #080816, #10152d, #080816);
}

header {
    text-align: center;
    padding: 35px 20px 20px;
}

.logo {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #9d5cff, #36d9ff);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    margin-top: 8px;
    color: #bfc5e8;
    font-size: 18px;
}

.container {
    width: min(1200px, 94%);
    margin: auto;
    padding-bottom: 50px;
}

.section-title {
    margin-top: 35px;
    margin-bottom: 8px;
    font-size: 30px;
}

.section-info {
    color: #aeb5d8;
    margin-bottom: 22px;
}

/* SIEMPRE 4 JUEGOS POR FILA */
.games-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.game {
    min-height: 190px;
    border: 1px solid rgba(150, 120, 255, 0.35);
    border-radius: 18px;
    padding: 22px;
    background: rgba(20, 22, 52, 0.82);
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s, border-color 0.2s;
}

.game.available:hover {
    transform: translateY(-6px);
    border-color: #9d5cff;
}

.game-icon {
    font-size: 42px;
}

.game-number {
    color: #9fa7d4;
    font-size: 14px;
    margin-top: 8px;
}

.game-name {
    font-size: 21px;
    font-weight: bold;
    margin-top: 5px;
}

.play-button {
    margin-top: 18px;
    padding: 11px 15px;
    border: 0;
    border-radius: 10px;
    color: white;
    background: linear-gradient(90deg, #8b4dff, #25bce8);
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
}

.coming-soon {
    opacity: 0.62;
    background: rgba(15, 17, 38, 0.75);
}

.lock {
    font-size: 40px;
}

.soon {
    color: #9da4c9;
    margin-top: 8px;
}

@media (max-width: 850px) {
    .games-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .logo {
        font-size: 38px;
    }
}

@media (max-width: 520px) {
    .games-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">PIXEL GAMES</div>
    <div class="subtitle">Tu idea. Tu juego. Tu aventura.</div>
</header>

<main class="container">

    <h1 class="section-title">🎮 Juegos</h1>

    <div class="section-info">
        <strong>4 juegos disponibles</strong>
    </div>

    <!-- JUEGOS DISPONIBLES -->
    <div class="games-grid">

        <!-- JUEGO 1 -->
        <div class="game available">
            <div>
                <div class="game-icon">🪙</div>
                <div class="game-number">JUEGO 1</div>
                <div class="game-name">Juego de Monedas</div>
            </div>

            <a class="play-button" href="juego1.html">
                ▶ JUGAR
            </a>
        </div>

        <!-- JUEGO 2 -->
        <div class="game available">
            <div>
                <div class="game-icon">🎮</div>
                <div class="game-number">JUEGO 2</div>
                <div class="game-name">Spirit Wilds</div>
            </div>

            <a class="play-button" href="juego2.html">
                ▶ JUGAR
            </a>
        </div>

        <!-- JUEGO 3 -->
        <div class="game available">
            <div>
                <div class="game-icon">⚽</div>
                <div class="game-number">JUEGO 3</div>
                <div class="game-name">Fútbol 3D Online</div>
            </div>

            <a class="play-button" href="juego3.html">
                ▶ JUGAR
            </a>
        </div>

        <!-- JUEGO 4 -->
        <div class="game available">
            <div>
                <div class="game-icon">🏎️</div>
                <div class="game-number">JUEGO 4</div>
                <div class="game-name">Ultra 3D Kart</div>
            </div>

            <a class="play-button" href="juego4.html">
                ▶ JUGAR
            </a>
        </div>

    </div>


    <!-- PRÓXIMAMENTE -->
    <h2 class="section-title">🚀 Próximamente</h2>

    <div class="section-info">
        Juegos 5–100 están esperando su momento.
    </div>

    <div class="games-grid" id="comingSoonGames"></div>

</main>


<script>

const container = document.getElementById("comingSoonGames");

for (let i = 5; i <= 100; i++) {

    const game = document.createElement("div");

    game.className = "game coming-soon";

    game.innerHTML = `
        <div>
            <div class="lock">🔒</div>
            <div class="game-number">JUEGO ${i}</div>
            <div class="game-name">Próximamente</div>
            <div class="soon">¿Qué juego habrá aquí?</div>
        </div>
    `;

    container.appendChild(game);
}

</script>

</body>
</html>
