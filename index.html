<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Games - Iniciar Sesión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b132b;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contenedor {
      background: #1c2541;
      padding: 30px;
      border-radius: 15px;
      border: 2px solid #5bc0be;
      box-shadow: 0 0 25px rgba(91, 192, 190, 0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 { color: #5bc0be; margin-bottom: 20px; font-size: 26px; }
    
    .campo { margin-bottom: 15px; text-align: left; }
    .campo label { display: block; font-size: 13px; color: #a0aab8; margin-bottom: 5px; }
    .campo input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3a506b;
      background: #0b132b;
      color: #fff;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      background: #5bc0be;
      color: #0b132b;
      transition: all 0.2s;
    }

    button:hover { background: #6fffe9; }

    .alerta {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>🎮 PIXEL GAMES</h1>
    <p style="color:#a0aab8; font-size:14px; margin-bottom:20px;">Acceso de Usuario</p>

    <div class="campo">
      <label>Usuario:</label>
      <input type="text" id="usuario-input" placeholder="Ej: Player1">
    </div>

    <div class="campo">
      <label>Contraseña (1 Mayúscula, 1 Minúscula, 2 Números):</label>
      <input type="password" id="pass-input" placeholder="Ej: P1xel2026">
      <div class="alerta" id="alerta-pass">Requiere: 1 mayúscula, 1 minúscula y 2 números.</div>
    </div>

    <button onclick="iniciarSesion()">Entrar a Juegos</button>
  </div>

  <script>
    function validarContrasena(pass) {
      const tieneMayuscula = /[A-Z]/.test(pass);
      const tieneMinuscula = /[a-z]/.test(pass);
      const numeros = pass.match(/\d/g);
      const tieneDosNumeros = numeros && numeros.length >= 2;
      return tieneMayuscula && tieneMinuscula && tieneDosNumeros;
    }

    function iniciarSesion() {
      const user = document.getElementById('usuario-input').value.trim();
      const pass = document.getElementById('pass-input').value;
      const alerta = document.getElementById('alerta-pass');

      if (!user) {
        alert("Escribe un nombre de usuario.");
        return;
      }

      if (!validarContrasena(pass)) {
        alerta.style.display = 'block';
        return;
      }

      alerta.style.display = 'none';

      const usuarios = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');

      if (usuarios[user]) {
        if (usuarios[user].password !== pass) {
          alert("Contraseña incorrecta.");
          return;
        }
      } else {
        usuarios[user] = {
          password: pass,
          progreso: {}
        };
        localStorage.setItem('pixelgames_users', JSON.stringify(usuarios));
      }

      localStorage.setItem('pixelgames_session', user);
      window.location.href = 'juegos.html';
    }

    // Si ya inició sesión previamente, lo lleva directo
    window.onload = () => {
      if (localStorage.getItem('pixelgames_session')) {
        window.location.href = 'juegos.html';
      }
    };
  </script>
</body>
</html>
