<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta Galaxy Defender</title>
  <style>
    body {
      background-color: #080b12;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    /* TARJETA CON BORDE Y RESPLANDOR NEÓN FUSCIA / ROSA */
    .card {
      background: #0d1424;
      border: 2px solid #ff007f;
      border-radius: 20px;
      padding: 30px 20px;
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.7), inset 0 0 15px rgba(255, 0, 127, 0.2);
    }

    /* ALIENÍGENA DIBUJADO PÍXEL A PÍXEL EN CSS */
    .pixel-invader {
      width: 5px;
      height: 5px;
      background: #a55eea;
      margin-bottom: 25px;
      box-shadow: 
        /* Fila 1 */
        15px 0 #a55eea, 25px 0 #a55eea,
        /* Fila 2 */
        20px 5px #a55eea,
        /* Fila 3 */
        10px 10px #a55eea, 15px 10px #a55eea, 20px 10px #a55eea, 25px 10px #a55eea, 30px 10px #a55eea,
        /* Fila 4 */
        5px 15px #a55eea, 10px 15px #a55eea, 20px 15px #a55eea, 30px 15px #a55eea, 35px 15px #a55eea,
        /* Fila 5 */
        0px 20px #a55eea, 5px 20px #a55eea, 10px 20px #a55eea, 15px 20px #a55eea, 20px 20px #a55eea, 25px 20px #a55eea, 30px 20px #a55eea, 35px 20px #a55eea, 40px 20px #a55eea,
        /* Fila 6 */
        0px 25px #a55eea, 10px 25px #a55eea, 30px 25px #a55eea, 40px 25px #a55eea,
        /* Fila 7 */
        0px 30px #a55eea, 15px 30px #a55eea, 25px 30px #a55eea, 40px 30px #a55eea,
        /* Fila 8 */
        20px 35px #a55eea,
        /* Fila 9 */
        15px 40px #a55eea, 25px 40px #a55eea;
    }

    /* TÍTULO DE JUEGO */
    .title {
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 25px;
      line-height: 1.2;
    }

    /* BOTÓN JUGAR 3D NEÓN */
    .btn-jugar {
      background: linear-gradient(180deg, #35a8ff 0%, #1266e8 100%);
      color: #ffffff;
      font-family: inherit;
      font-weight: bold;
      font-size: 15px;
      border: none;
      padding: 10px 28px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0844a0, 0 0 15px rgba(0, 100, 255, 0.6);
      transition: transform 0.1s;
    }

    .btn-jugar:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="pixel-invader"></div>
    <div class="title">Galaxy<br>Defender</div>
    <button class="btn-jugar">JUGAR</button>
  </div>

</body>
</html>
