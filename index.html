<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Chat AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e3e3e3;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px;
      text-align: center;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      font-weight: bold;
      font-size: 18px;
    }
    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
    }
    .user {
      align-self: flex-end;
      background-color: #004d40;
      color: #e0f2f1;
    }
    .bot {
      align-self: flex-start;
      background-color: #262626;
      color: #ffffff;
    }
    .input-area {
      display: flex;
      padding: 12px;
      background-color: #1e1e1e;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 24px;
      border: 1px solid #444;
      background-color: #2b2b2b;
      color: white;
      outline: none;
    }
    button {
      padding: 12px 20px;
      border-radius: 24px;
      border: none;
      background-color: #80286e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Pixel Chat AI</header>
  <div id="chat-box">
    <div class="msg bot">¡Hola! ¿En qué te puedo ayudar hoy?</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Escribe un mensaje..." onkeypress="handleKey(event)">
    <button onclick="sendMsg()">Enviar</button>
  </div>

  <script>
    function sendMsg() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMsg(text, 'user');
      input.value = '';

      setTimeout(() => {
        addMsg("¡Mensaje recibido correctamente!", 'bot');
      }, 600);
    }

    function addMsg(text, sender) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMsg();
    }
  </script>
</body>
</html>
