<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Portal Tecnológico</title>
    <!-- Carga de Tailwind CSS para utilidades y diseño responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter para una tipografía limpia y moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos personalizados para replicar fielmente la estética tecnológica y el efecto cristal */
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #030805;
            background-image: 
                radial-gradient(circle at 18% 22%, rgba(20, 88, 42, 0.45) 0%, transparent 45%),
                radial-gradient(circle at 82% 78%, rgba(16, 75, 36, 0.42) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #081a0f 0%, #020503 100%);
            overflow-x: hidden;
        }

        /* Lienzo de fondo para hexágonos, circuitos y red de nodos brillantes */
        #tech-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Tarjeta principal Glassmorphism oscuro */
        .login-glass-card {
            background: rgba(12, 28, 16, 0.84);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid #4d8a47;
            border-radius: 18px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(77, 138, 71, 0.18),
                inset 0 0 20px rgba(77, 138, 71, 0.06);
        }

        /* Campos de entrada oscuros con borde verde claro */
        .custom-input {
            background-color: #363636;
            border: 1.5px solid #7cb855;
            border-radius: 8px;
            color: #ffffff;
            transition: all 0.25s ease;
        }

        .custom-input::placeholder {
            color: #9ca3af;
        }

        .custom-input:focus {
            outline: none;
            border-color: #9ee370;
            box-shadow: 0 0 12px rgba(124, 184, 85, 0.45);
            background-color: #3d3d3d;
        }

        /* Botón principal verde redondeado */
        .btn-login {
            background-color: #559e42;
            border-radius: 9999px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(85, 158, 66, 0.3);
        }

        .btn-login:hover {
            background-color: #62b34d;
            box-shadow: 0 6px 22px rgba(98, 179, 77, 0.5);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0) scale(0.98);
        }

        /* Animación suave para la notificación visual */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-animate {
            animation: slideIn 0.3s ease forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 relative">

    <!-- Canvas animado con red de nodos, líneas de circuito y hexágonos translúcidos -->
    <canvas id="tech-canvas"></canvas>

    <!-- Contenedor principal centrado -->
    <main class="relative z-10 w-full max-w-[410px]">
        <div class="login-glass-card relative px-7 py-9 sm:px-9 sm:py-10 text-white">
            
            <!-- Icono de escudo con candado en la esquina superior derecha -->
            <div class="absolute top-4 right-4 text-gray-400 opacity-75 hover:opacity-100 transition-opacity" title="Acceso Protegido">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <rect x="9" y="10" width="6" height="5" rx="1"></rect>
                    <path d="M10 10V8a2 2 0 1 1 4 0v2"></path>
                </svg>
            </div>

            <!-- Título en mayúsculas -->
            <h1 class="text-center text-2xl sm:text-[26px] font-bold tracking-wider uppercase mb-7 text-white">
                INICIAR SESIÓN
            </h1>

            <!-- Notificación visual de estado (oculta por defecto) -->
            <div id="status-box" class="hidden mb-5 p-3 rounded-lg border text-xs sm:text-sm flex items-center gap-2.5 toast-animate">
                <span id="status-icon"></span>
                <span id="status-text" class="font-medium"></span>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="login-form" class="space-y-5" novalidate>
                
                <!-- Campo: Usuario o Correo Electrónico -->
                <div>
                    <label for="username" class="flex items-center gap-2 text-sm font-medium text-gray-200 mb-2">
                        <svg class="w-4 h-4 fill-[#7cb855] shrink-0" viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        <span>Usuario o Correo Electrónico</span>
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        class="custom-input w-full px-3.5 py-3 text-sm" 
                        placeholder="ejemplo@correo.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- Campo: Contraseña -->
                <div>
                    <label for="password" class="flex items-center gap-2 text-sm font-medium text-gray-200 mb-2">
                        <svg class="w-4 h-4 fill-[#7cb855] shrink-0" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <span>Contraseña</span>
                    </label>
                    <div class="relative flex items-center">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            class="custom-input w-full pl-3.5 pr-11 py-3 text-sm tracking-widest" 
                            placeholder="••••••••••••"
                            value="••••••••••••"
                            autocomplete="current-password"
                            required
                        >
                        <!-- Botón interactivo del ojo para mostrar/ocultar contraseña -->
                        <button 
                            type="button" 
                            id="toggle-password" 
                            class="absolute right-3 p-1.5 text-gray-400 hover:text-white focus:outline-none transition-colors"
                            aria-label="Mostrar u ocultar contraseña"
                            title="Mostrar/Ocultar contraseña"
                        >
                            <svg id="eye-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Botón de envío -->
                <div class="pt-2">
                    <button 
                        type="submit" 
                        class="btn-login w-full py-3.5 text-white font-bold text-sm sm:text-base tracking-wide uppercase cursor-pointer"
                    >
                        INICIAR SESIÓN
                    </button>
                </div>

                <!-- Enlaces inferiores centrados en verde claro -->
                <div class="pt-2 flex flex-col items-center space-y-2.5 text-xs sm:text-[13px]">
                    <a href="#recuperar" id="forgot-link" class="text-[#8ab87f] hover:text-[#b6e8aa] hover:underline transition-colors">
                        ¿Olvidaste tu contraseña?
                    </a>
                    <a href="#registro" id="register-link" class="text-[#8ab87f] hover:text-[#b6e8aa] hover:underline transition-colors">
                        Crear una cuenta
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        /**
         * 1. INTERACTIVIDAD DEL FORMULARIO Y MOSTRAR/OCULTAR CONTRASEÑA
         */
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            const loginForm = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const statusBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-text');
            const statusIcon = document.getElementById('status-icon');
            const forgotLink = document.getElementById('forgot-link');
            const registerLink = document.getElementById('register-link');

            // Alternar visibilidad de la contraseña
            togglePasswordBtn.addEventListener('click', () => {
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';

                if (isHidden) {
                    passwordInput.classList.remove('tracking-widest');
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                } else {
                    passwordInput.classList.add('tracking-widest');
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                }
            });

            // Función auxiliar para mostrar mensajes visuales en la tarjeta
            function showMessage(message, type = 'success') {
                statusBox.classList.remove('hidden', 'bg-emerald-950/90', 'border-emerald-500', 'text-emerald-200', 'bg-red-950/90', 'border-red-500', 'text-red-200');
                
                if (type === 'success') {
                    statusBox.classList.add('bg-emerald-950/90', 'border-emerald-500', 'text-emerald-200');
                    statusIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                } else {
                    statusBox.classList.add('bg-red-950/90', 'border-red-500', 'text-red-200');
                    statusIcon.innerHTML = `<svg class="w-5 h-5 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                }
                
                statusText.textContent = message;
            }

            // Validación y redirección pasando el usuario correctamente
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const userVal = usernameInput.value.trim();
                const passVal = passwordInput.value.trim();

                if (!userVal) {
                    showMessage('Por favor, ingresa tu usuario o correo electrónico.', 'error');
                    usernameInput.focus();
                    return;
                }

                if (!passVal) {
                    showMessage('Por favor, ingresa tu contraseña.', 'error');
                    passwordInput.focus();
                    return;
                }

                const submitBtn = loginForm.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-75', 'cursor-wait');
                    submitBtn.textContent = 'REDIRIGIENDO...';
                }

                // Guardar sesión en almacenamiento local y de sesión
                try {
                    localStorage.setItem('pixelgames_session', userVal);
                    localStorage.setItem('pixelgames_usuario', userVal);
                    sessionStorage.setItem('pixelgames_session', userVal);
                } catch (err) {}

                showMessage(`¡Acceso concedido, ${userVal}! Redirigiendo a juegos.html...`, 'success');

                // Redirigir enviando el usuario también por parámetro URL (?user=...)
                const destinoUrl = 'juegos.html?user=' + encodeURIComponent(userVal);
                setTimeout(() => {
                    window.location.href = destinoUrl;

                    setTimeout(() => {
                        showMessage(`Redirección ejecutada hacia "${destinoUrl}" (vista previa aislada).`, 'success');
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.classList.remove('opacity-75', 'cursor-wait');
                            submitBtn.textContent = 'INICIAR SESIÓN';
                        }
                    }, 900);
                }, 800);
            });

            forgotLink.addEventListener('click', (e) => {
                e.preventDefault();
                showMessage('Se ha enviado un enlace de recuperación de clave a tu correo.', 'success');
            });

            registerLink.addEventListener('click', (e) => {
                e.preventDefault();
                showMessage('Módulo de registro de nueva cuenta activado.', 'success');
            });
        });

        /**
         * 2. FONDO TECNOLÓGICO ANIMADO (CANVAS)
         */
        window.onload = function () {
            const canvas = document.getElementById('tech-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let nodes = [];
            let circuits = [];

            function initCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;

                const nodeCount = Math.min(Math.floor((width * height) / 16000), 85);
                nodes = [];
                for (let i = 0; i < nodeCount; i++) {
                    nodes.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35,
                        radius: Math.random() * 1.8 + 1,
                        pulse: Math.random() * Math.PI * 2
                    });
                }

                circuits = [
                    [
                        { x: 0, y: height * 0.32 },
                        { x: width * 0.14, y: height * 0.32 },
                        { x: width * 0.18, y: height * 0.38 },
                        { x: width * 0.32, y: height * 0.38 }
                    ],
                    [
                        { x: 0, y: height * 0.36 },
                        { x: width * 0.11, y: height * 0.36 },
                        { x: width * 0.16, y: height * 0.43 },
                        { x: width * 0.28, y: height * 0.43 }
                    ],
                    [
                        { x: width * 0.56, y: 0 },
                        { x: width * 0.56, y: height * 0.15 },
                        { x: width * 0.52, y: height * 0.20 }
                    ],
                    [
                        { x: width, y: height * 0.68 },
                        { x: width * 0.85, y: height * 0.68 },
                        { x: width * 0.80, y: height * 0.62 },
                        { x: width * 0.68, y: height * 0.62 }
                    ]
                ];
            }

            window.addEventListener('resize', initCanvas);
            initCanvas();

            function drawHexagon(cx, cy, r, fillAlpha = 0.04, strokeAlpha = 0.14) {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i - Math.PI / 6;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fillStyle = `rgba(45, 130, 68, ${fillAlpha})`;
                ctx.fill();
                ctx.strokeStyle = `rgba(95, 195, 115, ${strokeAlpha})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            function drawHexagonClusters() {
                const r = Math.max(28, Math.min(width, height) * 0.042);
                const dx = r * Math.sqrt(3);
                const dy = r * 1.5;

                const topRightBaseX = width * 0.84;
                const topRightBaseY = height * 0.12;
                const trOffsets = [
                    [0, 0, 0.07], [1, 0, 0.04], [-1, 0, 0.05], [-2, 0, 0.03],
                    [0.5, 1, 0.06], [-0.5, 1, 0.08], [-1.5, 1, 0.04],
                    [0, 2, 0.05], [1, 2, 0.03]
                ];
                trOffsets.forEach(([ox, oy, alpha]) => {
                    drawHexagon(topRightBaseX + ox * dx, topRightBaseY + oy * dy, r, alpha, alpha * 2.2);
                });

                const botLeftBaseX = width * 0.12;
                const botLeftBaseY = height * 0.72;
                const blOffsets = [
                    [0, 0, 0.06], [1, 0, 0.04], [-1, 0, 0.05],
                    [0.5, 1, 0.08], [-0.5, 1, 0.05], [1.5, 1, 0.03],
                    [0, 2, 0.07], [1, 2, 0.05], [-1, 2, 0.04]
                ];
                blOffsets.forEach(([ox, oy, alpha]) => {
                    drawHexagon(botLeftBaseX + ox * dx, botLeftBaseY + oy * dy, r, alpha, alpha * 2.2);
                });
            }

            function drawCircuits() {
                circuits.forEach(path => {
                    if (path.length < 2) return;
                    ctx.beginPath();
                    ctx.moveTo(path[0].x, path[0].y);
                    for (let i = 1; i < path.length; i++) {
                        ctx.lineTo(path[i].x, path[i].y);
                    }
                    ctx.strokeStyle = 'rgba(77, 168, 95, 0.18)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    const last = path[path.length - 1];
                    ctx.beginPath();
                    ctx.arc(last.x, last.y, 2.8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(124, 215, 130, 0.45)';
                    ctx.fill();
                });
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                drawHexagonClusters();
                drawCircuits();

                for (let i = 0; i < nodes.length; i++) {
                    const n1 = nodes[i];
                    n1.x += n1.vx;
                    n1.y += n1.vy;
                    n1.pulse += 0.03;

                    if (n1.x < 0 || n1.x > width) n1.vx *= -1;
                    if (n1.y < 0 || n1.y > height) n1.vy *= -1;

                    const glow = 0.45 + Math.sin(n1.pulse) * 0.25;
                    ctx.beginPath();
                    ctx.arc(n1.x, n1.y, n1.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(130, 235, 145, ${glow})`;
                    ctx.fill();

                    for (let j = i + 1; j < nodes.length; j++) {
                        const n2 = nodes[j];
                        const dist = Math.hypot(n1.x - n2.x, n1.y - n2.y);
                        const maxDist = 145;

                        if (dist < maxDist) {
                            const lineAlpha = 0.22 * (1 - dist / maxDist);
                            ctx.beginPath();
                            ctx.moveTo(n1.x, n1.y);
                            ctx.lineTo(n2.x, n2.y);
                            ctx.strokeStyle = `rgba(92, 196, 108, ${lineAlpha})`;
                            ctx.lineWidth = 0.85;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(animate);
            }

            animate();
        };
    </script>
</body>
</html>
