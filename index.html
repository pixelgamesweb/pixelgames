<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Games</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background:
        radial-gradient(circle at 15% 20%, rgba(120,70,210,.55), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(30,110,220,.45), transparent 30%),
        radial-gradient(circle at 50% 85%, rgba(190,40,150,.4), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(40,60,180,.5), transparent 30%),
        linear-gradient(135deg, #02020a, #11102b, #050510);
}

/* Estrellas */
body::before {
    content: "";
    position: fixed;
    inset: -40px;
    background:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 2px);
    background-size: 75px 75px;
    opacity: .4;
    filter: blur(1px);
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,0,0,.3) 100%);
    pointer-events: none;
}

.principal {
    position: relative;
    z-index: 2;
    width: min(90vw, 600px);
    padding: 45px 30px;
    text-align: center;

    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 0 30px rgba(255,255,255,.03);

    backdrop-filter: blur(12px);
}

h1 {
    margin: 0 0 35px;
    color: #000;
    font-size: clamp(45px, 9vw, 76px);
    font-weight: 900;
    letter-spacing: 3px;

    text-shadow:
        0 2px 0 rgba(255,255,255,.4),
        0 0 18px rgba(255,255,255,.35);
}

.jugar {
    display: block;
    width: min(100%, 400px);
    margin: auto;
    padding: 22px;

    background: #000;
    color: white;

    border: 2px solid rgba(255,255,255,.18);
    border-radius: 18px;

    text-decoration: none;
    font-size: 28px;
    font-weight: 900;

    box-shadow:
        0 9px 0 #222,
        0 18px 35px rgba(0,0,0,.5);

    transition: .2s;
}

.jugar:hover {
    transform: translateY(-5px);
    background: #111;
    box-shadow:
        0 13px 0 #222,
        0 22px 40px rgba(0,0,0,.6);
}

.jugar:active {
    transform: translateY(5px);
    box-shadow:
        0 4px 0 #222,
        0 10px 20px rgba(0,0,0,.5);
}

.subtitulo {
    margin-top: 20px;
    color: rgba(255,255,255,.75);
    font-size: 16px;
}
</style>
</head>

<body>

<div class="principal">

    <h1>Pixel Games</h1>

    <a class="jugar" href="juegos.html">
        Jugar
    </a>

    <div class="subtitulo">
        Tu mundo de juegos
    </div>

</div>

</body>
</html>
