<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra Táctica - Pixel Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at 20% 20%, rgba(80,120,255,.18), transparent 28%),
                  linear-gradient(135deg, #030817, #07132d 50%, #02040d);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      overflow-x: hidden;
      user-select: none;
    }

    h1 {
      font-size: clamp(20px, 3.5vw, 32px);
      letter-spacing: 2px;
      text-shadow: 0 4px 0 #111, 0 0 15px rgba(100, 170, 255, .65);
      margin-bottom: 8px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(20, 35, 70, 0.9);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 10px;
      z-index: 10;
    }

    .btn, select {
      padding: 8px 14px;
      border-radius: 8px;
      background: linear-gradient(180deg, #35a8ff, #1266e8);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 3px 0 #0844a0;
      font-size: 14px;
    }

    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0844a0; }
    .btn-draw { background: linear-gradient(180deg, #ff9f1a, #ff3838); box-shadow: 0 3px 0 #b32b00; }
    .btn-clear { background: linear-gradient(180deg, #ff4757, #c0392b); box-shadow: 0 3px 0 #841d13; }
    .btn-back { background: linear-gradient(180deg, #a0aec0, #4a5568); box-shadow: 0 3px 0 #2d3748; text-decoration: none; }

    #board-container {
      position: relative;
      width: min(900px, 95vw);
      height: min(580px, 62vh);
      background: #1e7e34;
      border: 4px solid #fff;
      border-radius: 15px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      cursor: default;
    }

    /* Dibujo del Campo de Fútbol */
    .pitch-line { position: absolute; border: 2px solid rgba(255,255,255,0.7); pointer-events: none; }
    .center-line { top: 0; bottom: 0; left: 50%; width: 0; }
    .center-circle { top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%; transform: translate(-50%, -50%); }
    .penalty-area-left { top: 20%; left: 0; width: 16%; height: 60%; }
    .penalty-area-right { top: 20%; right: 0; width: 16%; height: 60%; }

    canvas { position: absolute; inset: 0; pointer-events: none; }

    /* Fichas Magnéticas */
    .token {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      border: 2px solid white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      cursor: grab;
      touch-action: none;
      z-index: 5;
    }

    .token:active { cursor: grabbing; transform: scale(1.15); z-index: 8; }
    .team-blue { background: radial-gradient(circle at 30% 30%, #35a8ff, #004085); color: white; }
    .team-red { background: radial-gradient(circle at 30% 30%, #ff4757, #721c24); color: white; }
    
    .ball {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      border: 2px solid #000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 6;
      touch-action: none;
    }
  </style>
</head>
<body>

  <h1>⚽ PIZARRA MAGNÉTICA 11vs11</h1>

  <div class="toolbar">
    <label>Formación Azul: 
      <select id="form-blue" onchange="applyFormations()">
        <option value="4-3-3">4-3-3</option>
        <option value="4-4-2">4-4-2</option>
        <option value="3-5-2">3-5-2</option>
      </select>
    </label>

    <label>Formación Roja: 
      <select id="form-red" onchange="applyFormations()">
        <option value="4-3-3">4-3-3</option>
        <option value="4-4-2">4-4-2</option>
        <option value="5-3-2">5-3-2</option>
      </select>
    </label>

    <button class="btn btn-draw" id="btn-draw-mode" onclick="toggleDrawMode()">✏️ DIBUJAR: OFF</button>
    <button class="btn btn-clear" onclick="clearCanvas()">🧹 BORRAR LÍNEAS</button>
    <button class="btn" onclick="resetBoard()">🔄 REINICIAR</button>
    <a href="juegos.html" class="btn btn-back">VOLVER</a>
  </div>

  <div id="board-container">
    <div class="pitch-line center-line"></div>
    <div class="pitch-line center-circle"></div>
    <div class="pitch-line penalty-area-left"></div>
    <div class="pitch-line penalty-area-right"></div>

    <canvas id="drawCanvas"></canvas>
  </div>

  <script>
    const board = document.getElementById('board-container');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');

    let isDrawingMode = false;
    let isDrawing = false;
    let tokens = [];
    let ball;

    function resizeCanvas() {
      canvas.width = board.clientWidth;
      canvas.height = board.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // Definición de tácticas en porcentajes (x, y)
    const tactics = {
      "4-3-3": [
        [5, 50], [20, 20], [20, 40], [20, 60], [20, 80],
        [38, 30], [38, 50], [38, 70], [48, 20], [48, 50], [48, 80]
      ],
      "4-4-2": [
        [5, 50], [20, 20], [20, 40], [20, 60], [20, 80],
        [38, 18], [38, 40], [38, 60], [38, 82], [48, 38], [48, 62]
      ],
      "3-5-2": [
        [5, 50], [20, 25], [20, 50], [20, 75],
        [36, 15], [36, 32], [36, 50], [36, 68], [36, 85], [48, 38], [48, 62]
      ],
      "5-3-2": [
        [5, 50], [18, 15], [18, 32], [18, 50], [18, 68], [18, 85],
        [36, 30], [36, 50], [36, 70], [48, 38], [48, 62]
      ]
    };

    function createTokens() {
      board.querySelectorAll('.token, .ball').forEach(el => el.remove());
      tokens = [];

      // Crear 11 Azules
      for (let i = 1; i <= 11; i++) {
        const t = document.createElement('div');
        t.className = 'token team-blue';
        t.textContent = i;
        board.appendChild(t);
        makeDraggable(t);
        tokens.push({ el: t, team: 'blue', num: i });
      }

      // Crear 11 Rojos
      for (let i = 1; i <= 11; i++) {
        const t = document.createElement('div');
        t.className = 'token team-red';
        t.textContent = i;
        board.appendChild(t);
        makeDraggable(t);
        tokens.push({ el: t, team: 'red', num: i });
      }

      // Balón
      ball = document.createElement('div');
      ball.className = 'ball';
      ball.textContent = '⚽';
      board.appendChild(ball);
      makeDraggable(ball);

      applyFormations();
    }

    function applyFormations() {
      const formBlue = document.getElementById('form-blue').value;
      const formRed = document.getElementById('form-red').value;

      const bw = board.clientWidth;
      const bh = board.clientHeight;

      // Colocar Equipo Azul (Izquierda)
      tactics[formBlue].forEach((pos, idx) => {
        const t = tokens.find(item => item.team === 'blue' && item.num === idx + 1);
        if (t) {
          t.el.style.left = `${(pos[0] / 100) * bw - 16}px`;
          t.el.style.top = `${(pos[1] / 100) * bh - 16}px`;
        }
      });

      // Colocar Equipo Rojo (Derecha - Invertido)
      tactics[formRed].forEach((pos, idx) => {
        const t = tokens.find(item => item.team === 'red' && item.num === idx + 1);
        if (t) {
          t.el.style.left = `${bw - ((pos[0] / 100) * bw) - 16}px`;
          t.el.style.top = `${(pos[1] / 100) * bh - 16}px`;
        }
      });

      // Balón al Centro
      ball.style.left = `${bw / 2 - 11}px`;
      ball.style.top = `${bh / 2 - 11}px`;
    }

    // Arrastre Magnético (Fichas y Balón)
    function makeDraggable(element) {
      let active = false;
      let currentX, currentY, initialX, initialY;

      element.addEventListener('pointerdown', e => {
        if (isDrawingMode) return;
        active = true;
        initialX = e.clientX - element.offsetLeft;
        initialY = e.clientY - element.offsetTop;
        element.setPointerCapture(e.pointerId);
      });

      element.addEventListener('pointermove', e => {
        if (!active) return;
        e.preventDefault();
        currentX = e.clientX - initialX;
        currentY = e.clientY - initialY;

        // Límites del campo
        const maxX = board.clientWidth - element.clientWidth;
        const maxY = board.clientHeight - element.clientHeight;

        element.style.left = `${Math.max(0, Math.min(currentX, maxX))}px`;
        element.style.top = `${Math.max(0, Math.min(currentY, maxY))}px`;
      });

      element.addEventListener('pointerup', e => {
        active = false;
        try { element.releasePointerCapture(e.pointerId); } catch(err){}
      });
    }

    // Sistema de Dibujo sobre la Pizarra
    function toggleDrawMode() {
      isDrawingMode = !isDrawingMode;
      const btn = document.getElementById('btn-draw-mode');
      btn.textContent = isDrawingMode ? '✏️ DIBUJAR: ON' : '✏️ DIBUJAR: OFF';
      btn.style.background = isDrawingMode ? 'linear-gradient(180deg, #00e676, #00a152)' : 'linear-gradient(180deg, #ff9f1a, #ff3838)';
      board.style.cursor = isDrawingMode ? 'crosshair' : 'default';
    }

    board.addEventListener('pointerdown', e => {
      if (!isDrawingMode || e.target !== board && e.target !== canvas) return;
      isDrawing = true;
      const rect = board.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    });

    board.addEventListener('pointermove', e => {
      if (!isDrawing || !isDrawingMode) return;
      const rect = board.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();
    });

    board.addEventListener('pointerup', () => isDrawing = false);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function resetBoard() {
      clearCanvas();
      applyFormations();
    }

    // Inicializar
    setTimeout(() => {
      resizeCanvas();
      createTokens();
    }, 100);
  </script>
</body>
</html>
