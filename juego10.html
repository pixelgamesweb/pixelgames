<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizarra magnética</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#20242a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;overflow:hidden}
.board{position:relative;width:min(94vw,1200px);height:auto;aspect-ratio:3/2;max-height:78vh;background:#168447;border:16px solid #8b5a2b;border-radius:12px;box-shadow:0 10px 30px #0008;touch-action:none}
.field{position:absolute;inset:3%;border:4px solid white}
.midline{position:absolute;left:50%;top:0;bottom:0;border-left:4px solid white}
.circle{position:absolute;left:39%;top:36%;width:22%;aspect-ratio:1;border:4px solid white;border-radius:50%}
.spot{position:absolute;left:50%;top:50%;width:12px;height:12px;background:white;border-radius:50%;transform:translate(-50%,-50%)}
.area{position:absolute;top:32%;height:36%;width:14%;border:4px solid white}
.area.left{left:0;border-left:0}.area.right{right:0;border-right:0}
.small-area{position:absolute;top:41%;height:18%;width:5%;border:4px solid white}
.small-area.left{left:0;border-left:0}.small-area.right{right:0;border-right:0}
.penalty{position:absolute;width:12px;height:12px;background:white;border-radius:50%;top:50%;transform:translateY(-50%)}
.penalty.left{left:9%}.penalty.right{right:9%}
.goal{position:absolute;top:40%;height:20%;width:4%;border:5px solid white;background:#fff2}
.goal.left{left:-4%;border-right:0}.goal.right{right:-4%;border-left:0}
.player{position:absolute;width:clamp(20px,2.3vw,31px);height:clamp(20px,2.3vw,31px);border-radius:50%;border:2px solid white;transform:translate(-50%,-50%);box-shadow:0 2px 4px #0008;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.1vw,15px);font-weight:bold;color:white;cursor:grab;user-select:none;touch-action:none}
.red{background:#e53935}.blue{background:#1976d2}
.yellow{background:#ffd600;border-color:#333;color:#222}
#ball{background:white;border-color:#222;color:#222;font-size:16px;cursor:grab;width:clamp(24px,2.8vw,36px);height:clamp(24px,2.8vw,36px)}
.outside{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:9px}
.outside.top{top:-38px}.outside.bottom{bottom:-38px}
.controls{display:flex;gap:16px;margin-top:16px}
button{padding:12px 28px;border:0;border-radius:9px;font-weight:bold;font-size:18px;cursor:pointer}
@media(max-width:600px){.board{border-width:9px;height:70vh}.controls{gap:10px}button{padding:10px 20px;font-size:16px}}
</style>
</head>
<body>
<div class="board" id="board">
  <div class="field">
    <div class="midline"></div>
    <div class="circle"><div class="spot"></div></div>
    <div class="area left"></div><div class="area right"></div>
    <div class="small-area left"></div><div class="small-area right"></div>
    <div class="penalty left"></div><div class="penalty right"></div>
    <div class="goal left"></div><div class="goal right"></div>
  </div>
  <div class="outside top" id="yellowTop"></div>
  <div class="outside bottom" id="yellowBottom"></div>
  <div class="player" id="ball" style="left:50%;top:50%">⚽</div>
</div>
<div class="controls"><button id="reset">Reiniciar</button><button id="back">Volver</button></div>

<script>
const board=document.getElementById('board');
const initial=[];
const red=[
[8,50,1],[20,18,2],[20,38,3],[20,62,4],[20,82,5],
[38,12,6],[38,32,8],[38,50,10],[38,68,7],[38,88,11],[50,50,9]];
const blue=[
[92,50,1],[80,18,2],[80,38,3],[80,62,4],[80,82,5],
[62,12,6],[62,32,8],[62,50,10],[62,68,7],[62,88,11],[50,50,9]];
function addTeam(items,cls){
  items.forEach(([x,y,n])=>{
    const p=document.createElement('div');
    p.className='player '+cls;
    p.textContent=n;
    p.style.left=x+'%';p.style.top=y+'%';
    p.dataset.x=x;p.dataset.y=y;
    board.appendChild(p);
    initial.push({el:p,x,y});
    drag(p);
  });
}
addTeam(red,'red');addTeam(blue,'blue');

for(let i=0;i<5;i++){
  for(const id of ['yellowTop','yellowBottom']){
    const p=document.createElement('div');
    p.className='player yellow';
    p.textContent=i+1;
    p.style.position='relative';p.style.left='auto';p.style.top='auto';
    document.getElementById(id).appendChild(p);
  }
}
initial.push({el:ball,x:50,y:50});
function drag(el){
  let moving=false;
  function move(e){
    const r=board.getBoundingClientRect();
    let x=(e.clientX-r.left)/r.width*100;
    let y=(e.clientY-r.top)/r.height*100;
    x=Math.max(2,Math.min(98,x));y=Math.max(2,Math.min(98,y));
    el.style.left=x+'%';el.style.top=y+'%';
  }
  el.addEventListener('pointerdown',e=>{moving=true;el.setPointerCapture(e.pointerId);move(e)});
  el.addEventListener('pointermove',e=>{if(moving)move(e)});
  el.addEventListener('pointerup',()=>moving=false);
  el.addEventListener('pointercancel',()=>moving=false);
}
drag(ball);
document.getElementById('reset').onclick=()=>{
  initial.forEach(item=>{item.el.style.left=item.x+'%';item.el.style.top=item.y+'%'});
};
document.getElementById('back').onclick=()=>{location.href='juegos.html'};
</script>
</body>
</html>
