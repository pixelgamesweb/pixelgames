<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Dash Retro - Pixel Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, rgba(80,120,255,.18), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(180,70,255,.14), transparent 30%),
        linear-gradient(135deg, #030817, #07132d 50%, #02040d);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      letter-spacing: 3px;
      text-shadow: 0 4px 0 #111, 0 0 18px rgba(100, 170, 255, .65);
      margin-bottom: 10px;
    }

    .hud {
      display: flex;
      gap: 20px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      background: rgba(20, 35, 70, 0.88);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    canvas {
      background: #000;
      border: 4px solid #1266e8;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(53, 168, 255, 0.4);
      max-width: 100%;
      image-rendering: pixelated;
    }

    .controls-panel {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(180deg, #35a8ff, #1266e8);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #0844a0;
      user-select: none;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0844a0;
    }

    .btn-up {
      background: linear-gradient(180deg, #00e676, #00a152);
      box-shadow: 0 4px 0 #00701a;
      width: 100%;
      max-width: 120px;
    }

    .btn-back {
      background: linear-gradient(180deg, #ff4757, #c0392b);
      box-shadow: 0 4px 0 #841d13;
    }

    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .dpad-row {
      display: flex;
      gap: 5px;
    }
  </style>
</head>
<body>

  <h1>🍎 APPLE DASH RETRO</h1>

  <div class="hud">
    <div>Manzanas: <span id="score" style="color:#ff4757;">0</span></div>
    <div>Record: <span id="high-score" style="color:#ffd700;">0</span></div>
  </div>

  <canvas id="gameCanvas" width="500" height="350"></canvas>

  <div class="controls-panel dpad">
    <button class="btn btn-up" id="btn-up">▲ ARRIBA</button>
    <div class="dpad-row">
      <button class="btn" id="btn-left">◀ IZQ</button>
      <button class="btn" id="btn-down">▼ ABAJO</button>
      <button class="btn" id="btn-right">DER ▶</button>
    </div>
  </div>

  <div class="controls-panel">
    <button class="btn" onclick="resetGame()">REINICIAR</button>
    <a href="juegos.html" class="btn btn-back">VOLVER AL MENÚ</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');

    let score = 0;
    let highScore = 0;
    let gameOver = false;
    let frameCount = 0;

    // Sprite Retro del Personaje (Jugador pixelado)
    const player = {
      x: 50,
      y: 160,
      width: 20,
      height: 20,
      speed: 4,
      vx: 0,
      vy: 0
    };

    // Manzana
    let apple = {
      x: 250,
      y: 160,
      size: 16
    };

    // Obstáculos (Paredes que avanzan estilo retro)
    let walls = [];
    const wallWidth = 30;
    const wallGap = 100;

    function spawnWall() {
      const minHeight = 40;
      const maxHeight = canvas.height - wallGap - minHeight;
      const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

      walls.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - topHeight - wallGap,
        passed: false
      });
    }

    function spawnApple() {
      apple.x = Math.floor(Math.random() * (canvas.width - 150)) + 100;
      apple.y = Math.floor(Math.random() * (canvas.height - 60)) + 30;
    }

    const keys = { up: false, down: false, left: false, right: false };

    function update() {
      if (gameOver) return;

      frameCount++;

      // Movimiento libre en 8 direcciones
      if (keys.up && player.y > 0) player.y -= player.speed;
      if (keys.down && player.y + player.height < canvas.height) player.y += player.speed;
      if (keys.left && player.x > 0) player.x -= player.speed;
      if (keys.right && player.x + player.width < canvas.width) player.x += player.speed;

      // Generar paredes periódicamente
      if (frameCount % 90 === 0) {
        spawnWall();
      }

      // Mover paredes
      for (let i = walls.length - 1; i >= 0; i--) {
        let w = walls[i];
        w.x -= 3;

        // Colisión con la pared superior o inferior
        if (
          player.x < w.x + wallWidth &&
          player.x + player.width > w.x &&
          (player.y < w.top || player.y + player.height > canvas.height - w.bottom)
        ) {
          gameOver = true;
        }

        // Eliminar paredes fuera de pantalla
        if (w.x + wallWidth < 0) {
          walls.splice(i, 1);
        }
      }

      // Colisión con los bordes de la pantalla (paredes exteriores)
      if (
        player.x <= 0 ||
        player.x + player.width >= canvas.width ||
        player.y <= 0 ||
        player.y + player.height >= canvas.height
      ) {
        gameOver = true;
      }

      // Colisión con la manzana
      if (
        player.x < apple.x + apple.size &&
        player.x + player.width > apple.x &&
        player.y < apple.y + apple.size &&
        player.y + player.height > apple.y
      ) {
        score += 1;
        if (score > highScore) highScore = score;
        spawnApple();
      }

      // Actualizar marcadores
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
    }

    // Dibuja un sprite estilo 8-bits retro
    function drawRetroSprite(x, y) {
      // Cuerpo
      ctx.fillStyle = '#35a8ff';
      ctx.fillRect(x + 4, y + 4, 12, 12);
      
      // Ojos estilo retro
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 6, y + 6, 3, 3);
      ctx.fillRect(x + 11, y + 6, 3, 3);

      ctx.fillStyle = '#000';
      ctx.fillRect(x + 7, y + 7, 2, 2);
      ctx.fillRect(x + 12, y + 7, 2, 2);

      // Borde retro del personaje
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2, y + 2, 16, 16);
    }

    function draw() {
      // Fondo negro retro con cuadrícula tenue
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 20) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Paredes retro neón
      walls.forEach(w => {
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(w.x, 0, wallWidth, w.top);
        ctx.fillRect(w.x, canvas.height - w.bottom, wallWidth, w.bottom);

        // Borde neón
        ctx.strokeStyle = '#ff77aa';
        ctx.lineWidth = 2;
        ctx.strokeRect(w.x, 0, wallWidth, w.top);
        ctx.strokeRect(w.x, canvas.height - w.bottom, wallWidth, w.bottom);
      });

      // Dibujar Manzana Retro
      ctx.fillStyle = '#ff4757';
      ctx.fillRect(apple.x, apple.y + 2, apple.size, apple.size - 2);
      ctx.fillStyle = '#00e676'; // Hojita
      ctx.fillRect(apple.x + 6, apple.y - 2, 4, 4);

      // Dibujar Jugador
      drawRetroSprite(player.x, player.y);

      // Game Over
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4757';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('¡GAME OVER!', canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText(`Puntuación: ${score} manzanas 🍎`, canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function resetGame() {
      score = 0;
      gameOver = false;
      frameCount = 0;
      walls = [];
      player.x = 50;
      player.y = 160;
      spawnApple();
    }

    // Controles Teclado
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    // Controles Táctiles / Botones
    function bindBtn(id, key) {
      const btn = document.getElementById(id);
      btn.addEventListener('mousedown', () => keys[key] = true);
      btn.addEventListener('mouseup', () => keys[key] = false);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      btn.addEventListener('touchend', () => keys[key] = false);
    }

    bindBtn('btn-up', 'up');
    bindBtn('btn-down', 'down');
    bindBtn('btn-left', 'left');
    bindBtn('btn-right', 'right');

    spawnApple();
    loop();
  </script>
</body>
</html>
