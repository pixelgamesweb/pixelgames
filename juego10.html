<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Karting 3D - Pixel Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      overflow: hidden;
      background: #030817;
      font-family: Arial, sans-serif;
      color: white;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      background: rgba(10, 20, 45, 0.85);
      padding: 12px 25px;
      border-radius: 15px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
    }
    .hud span { color: #00e5ff; }
    .controls-panel {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .btn-row { display: flex; gap: 12px; }
    .btn {
      padding: 14px 24px;
      border-radius: 12px;
      background: linear-gradient(180deg, #00e5ff, #0077ff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 10px rgba(0, 229, 255, 0.5);
      font-size: 16px;
    }
    .btn:active { transform: translateY(2px); }
    .btn-back {
      background: linear-gradient(180deg, #ff4757, #c0392b);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(3, 8, 23, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    #game-over-screen h2 {
      font-size: 48px;
      color: #ff4757;
      text-shadow: 0 0 20px #ff4757;
      margin-bottom: 10px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="hud">
    <div>PUNTOS: <span id="score">0</span></div>
    <div>VELOCIDAD: <span id="speed">0</span> KM/H</div>
  </div>

  <div id="game-over-screen">
    <h2>¡CRASH! EXPLOSIÓN</h2>
    <p style="font-size: 20px; margin-bottom: 20px;">Puntuación Final: <span id="final-score" style="color:#00e5ff;">0</span></p>
    <button class="btn" onclick="resetGame()">REINTENTAR</button>
  </div>

  <div id="canvas-container"></div>

  <div class="controls-panel">
    <div class="btn-row">
      <button class="btn" id="btn-left">◀ IZQ</button>
      <button class="btn" id="btn-nitro" style="background: linear-gradient(180deg, #ff9f1a, #ff3838);">🚀 NITRO</button>
      <button class="btn" id="btn-right">DER ▶</button>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="resetGame()">REINICIAR</button>
      <a href="juegos.html" class="btn btn-back">VOLVER AL MENÚ</a>
    </div>
  </div>

  <script>
    let scene, camera, renderer, playerCar;
    let obstacles = [], nitroPads = [], particles = [];
    let score = 0, speed = 0, targetSpeed = 60, baseSpeed = 60;
    let gameOver = false;
    let playerX = 0, targetX = 0;

    const keys = { left: false, right: false, nitro: false };

    function init() {
      const container = document.getElementById('canvas-container');

      // Escena 3D
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030817, 0.015);

      // Cámara estilo Karting
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3, 7);

      // Renderizador 3D
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Luces Neón 3D
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00e5ff, 1);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // Crear Pista Neon 3D
      createTrack();

      // Crear Coche 3D Estilo Cyberpunk
      createPlayerCar();

      // Controles
      window.addEventListener('resize', onWindowResize);
      setupControls();

      // Loop de render
      animate();
    }

    function createTrack() {
      const roadGeo = new THREE.PlaneGeometry(12, 1000);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x0a0f24, roughness: 0.2 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.z = -450;
      scene.add(road);

      // Bordes neón de la pista
      for (let side of [-6, 6]) {
        const borderGeo = new THREE.BoxGeometry(0.3, 0.5, 1000);
        const borderMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
        const border = new THREE.Mesh(borderGeo, borderMat);
        border.position.set(side, 0.25, -450);
        scene.add(border);
      }
    }

    function createPlayerCar() {
      playerCar = new THREE.Group();

      // Chasis principal
      const bodyGeo = new THREE.BoxGeometry(1.6, 0.6, 3);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1266e8, metalness: 0.8, roughness: 0.2 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.4;
      playerCar.add(body);

      // Cristal cabina
      const glassGeo = new THREE.BoxGeometry(1.2, 0.5, 1.2);
      const glassMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true });
      const glass = new THREE.Mesh(glassGeo, glassMat);
      glass.position.set(0, 0.8, -0.2);
      playerCar.add(glass);

      // Ruedas 3D
      const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
      const wheelMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

      const wheelPositions = [
        [-0.9, 0.35, 1], [0.9, 0.35, 1],
        [-0.9, 0.35, -1], [0.9, 0.35, -1]
      ];

      wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(...pos);
        playerCar.add(wheel);
      });

      scene.add(playerCar);
    }

    function spawnObstacle() {
      const geo = new THREE.BoxGeometry(1.8, 1.2, 1.8);
      const mat = new THREE.MeshBasicMaterial({ color: 0xff4757, wireframe: true });
      const mesh = new THREE.Mesh(geo, mat);
      
      const lanes = [-3.8, 0, 3.8];
      mesh.position.set(lanes[Math.floor(Math.random() * lanes.length)], 0.6, -180);
      scene.add(mesh);
      obstacles.push(mesh);
    }

    function spawnNitro() {
      const geo = new THREE.ConeGeometry(0.8, 1.5, 4);
      const mat = new THREE.MeshBasicMaterial({ color: 0xff9f1a });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = Math.PI / 2;
      
      const lanes = [-3.8, 0, 3.8];
      mesh.position.set(lanes[Math.floor(Math.random() * lanes.length)], 0.2, -180);
      scene.add(mesh);
      nitroPads.push(mesh);
    }

    function createExplosion(x, y, z) {
      for (let i = 0; i < 30; i++) {
        const pGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const pMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4757 : 0xff9f1a });
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.set(x, y, z);
        p.userData = {
          vx: (Math.random() - 0.5) * 0.4,
          vy: Math.random() * 0.4,
          vz: (Math.random() - 0.5) * 0.4
        };
        scene.add(p);
        particles.push(p);
      }
    }

    function update() {
      if (gameOver) {
        // Animación de partículas de explosión
        particles.forEach(p => {
          p.position.x += p.userData.vx;
          p.position.y += p.userData.vy;
          p.position.z += p.userData.vz;
        });
        return;
      }

      // Movimiento lateral suave
      if (keys.left && playerX > -4) playerX -= 0.18;
      if (keys.right && playerX < 4) playerX += 0.18;
      playerCar.position.x += (playerX - playerCar.position.x) * 0.2;
      playerCar.rotation.z = (playerCar.position.x - playerX) * 0.1;

      // Efecto Nitro
      if (keys.nitro) {
        targetSpeed = 120;
      } else {
        targetSpeed = baseSpeed;
      }
      speed += (targetSpeed - speed) * 0.05;

      // Generación de elementos
      if (Math.random() < 0.03) spawnObstacle();
      if (Math.random() < 0.015) spawnNitro();

      // Mover Obstáculos 3D
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.position.z += speed * 0.015;

        // Colisión Coche - Obstáculo
        if (Math.abs(obs.position.z - playerCar.position.z) < 1.8 &&
            Math.abs(obs.position.x - playerCar.position.x) < 1.4) {
          triggerGameOver();
        }

        if (obs.position.z > 10) {
          scene.remove(obs);
          obstacles.splice(i, 1);
          score += 10;
        }
      }

      // Mover Turbos Nitro
      for (let i = nitroPads.length - 1; i >= 0; i--) {
        let pad = nitroPads[i];
        pad.position.z += speed * 0.015;
        pad.rotation.z += 0.05;

        // Colisión Turbo
        if (Math.abs(pad.position.z - playerCar.position.z) < 1.5 &&
            Math.abs(pad.position.x - playerCar.position.x) < 1.2) {
          scene.remove(pad);
          nitroPads.splice(i, 1);
          speed = 150;
          score += 50;
        }

        if (pad.position.z > 10) {
          scene.remove(pad);
          nitroPads.splice(i, 1);
        }
      }

      // Actualizar HUD
      document.getElementById('score').textContent = score;
      document.getElementById('speed').textContent = Math.floor(speed);
    }

    function triggerGameOver() {
      gameOver = true;
      createExplosion(playerCar.position.x, playerCar.position.y, playerCar.position.z);
      scene.remove(playerCar);
      document.getElementById('final-score').textContent = score;
      document.getElementById('game-over-screen').style.display = 'flex';
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }

    function resetGame() {
      obstacles.forEach(o => scene.remove(o));
      nitroPads.forEach(n => scene.remove(n));
      particles.forEach(p => scene.remove(p));
      obstacles = [];
      nitroPads = [];
      particles = [];

      score = 0;
      speed = 60;
      playerX = 0;
      gameOver = false;

      if (!playerCar.parent) scene.add(playerCar);
      playerCar.position.set(0, 0, 0);

      document.getElementById('game-over-screen').style.display = 'none';
    }

    function setupControls() {
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.nitro = true;
      });

      window.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.nitro = false;
      });

      const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        btn.addEventListener('mousedown', () => keys[key] = true);
        btn.addEventListener('mouseup', () => keys[key] = false);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('touchend', () => keys[key] = false);
      };

      bindBtn('btn-left', 'left');
      bindBtn('btn-right', 'right');
      bindBtn('btn-nitro', 'nitro');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>
