<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mega Laberintos</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050509;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

button{
  border:1px solid #ffffff25;
  border-radius:12px;
  background:#050505dd;
  color:#72aaff;
  padding:11px 16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

/* HUD */

#hud{
  position:fixed;
  z-index:10;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.panel{
  background:#050509df;
  border:1px solid #ffffff25;
  border-radius:16px;
  padding:12px 15px;
  backdrop-filter:blur(8px);
  box-shadow:0 10px 35px #0009;
}

#level{
  font-size:20px;
  font-weight:900;
}

#difficulty{
  font-size:12px;
  opacity:.6;
  margin-top:3px;
}

.stat{
  font-size:12px;
  margin-top:7px;
}

.bar{
  width:180px;
  height:8px;
  border-radius:20px;
  overflow:hidden;
  background:#260c12;
  margin-top:4px;
}

#lifeBar{
  width:100%;
  height:100%;
  background:#42df77;
}

/* BOTONES SUPERIORES */

#topButtons{
  pointer-events:auto;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

#topButtons button{
  min-width:52px;
}

/* MENSAJES */

.overlay{
  position:fixed;
  z-index:30;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
}

.card{
  width:min(92%,480px);
  padding:28px;
  text-align:center;
  border-radius:24px;
  background:#06060bf5;
  border:1px solid #ffffff25;
  box-shadow:0 20px 80px #000;
}

.card h1{
  margin-top:0;
}

.card button{
  width:100%;
  margin-top:9px;
}

/* MAPA */

#mapOverlay{
  z-index:50;
}

#mapBox{
  position:relative;
  width:min(92vw,850px);
  height:min(88vh,850px);
  padding:16px;
  border-radius:22px;
  background:#05070bf5;
  border:1px solid #ffffff25;
  box-shadow:0 20px 80px #000;
  display:flex;
  flex-direction:column;
}

#mapTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

#mapTitle h2{
  margin:0;
}

#mapCanvas{
  width:100%;
  flex:1;
  min-height:0;
  background:#080b12;
  border-radius:14px;
  border:1px solid #ffffff15;
  image-rendering:auto;
}

#closeMap{
  width:auto;
}

/* CONTROLES */

#mobileControls{
  position:fixed;
  z-index:15;
  left:15px;
  bottom:15px;
  width:155px;
  height:155px;
  display:none;
}

.joy{
  position:absolute;
  width:58px;
  height:58px;
  padding:0;
  border-radius:50%;
  color:white;
  font-size:20px;
}

#up{
  top:0;
  left:48px;
}

#down{
  bottom:0;
  left:48px;
}

#left{
  left:0;
  top:48px;
}

#right{
  right:0;
  top:48px;
}

#attack{
  position:fixed;
  z-index:15;
  right:20px;
  bottom:25px;
  width:82px;
  height:82px;
  padding:0;
  border-radius:50%;
  color:#ffd15c;
  display:none;
}

/* PAUSA */

#pauseOverlay{
  z-index:40;
}

.pauseButton{
  display:block;
  width:100%;
  margin:9px 0;
}

/* MÓVIL */

@media(max-width:900px){

  #mobileControls{
    display:block;
  }

  #attack{
    display:block;
  }

  .bar{
    width:130px;
  }

  #level{
    font-size:16px;
  }

  #topButtons button{
    padding:9px;
    font-size:11px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- HUD -->

<div id="hud">

  <div class="panel">

    <div id="level">
      Nivel 1 / 300
    </div>

    <div id="difficulty">
      Muy fácil
    </div>

    <div class="stat">
      ❤️ Vida
    </div>

    <div class="bar">
      <div id="lifeBar"></div>
    </div>

    <div class="stat">
      🗝️ Llaves:
      <b id="keys">0</b>
    </div>

    <div class="stat">
      💎 Cristales:
      <b id="crystals">0</b>
    </div>

    <div class="stat">
      👾 Enemigos:
      <b id="enemyCount">0</b>
    </div>

  </div>

  <div id="topButtons">
    <button id="mapBtn">🗺️ MAPA</button>
    <button id="pauseBtn">Ⅱ</button>
  </div>

</div>


<!-- MAPA -->

<div class="overlay" id="mapOverlay">

  <div id="mapBox">

    <div id="mapTitle">
      <h2>🗺️ Mapa del nivel</h2>
      <button id="closeMap">CERRAR</button>
    </div>

    <canvas id="mapCanvas"></canvas>

  </div>

</div>


<!-- PAUSA -->

<div class="overlay" id="pauseOverlay">

  <div class="card">

    <h1>PAUSA</h1>

    <button class="pauseButton" id="resumeBtn">
      CONTINUAR
    </button>

    <button class="pauseButton" id="saveBtn">
      💾 GUARDAR
    </button>

    <button class="pauseButton" id="backBtn">
      ↩️ VOLVER AL MENÚ
    </button>

  </div>

</div>


<!-- FIN / MUERTE -->

<div class="overlay" id="messageOverlay">

  <div class="card">

    <h1 id="messageTitle"></h1>

    <p id="messageText"></p>

    <button id="messageBtn">
      CONTINUAR
    </button>

  </div>

</div>


<!-- CONTROLES MÓVILES -->

<div id="mobileControls">

  <button class="joy" id="up">▲</button>
  <button class="joy" id="down">▼</button>
  <button class="joy" id="left">◀</button>
  <button class="joy" id="right">▶</button>

</div>

<button id="attack">
  ⚔️
  <br>
  ATACAR
</button>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const TOTAL_LEVELS = 300;

const LEVEL_SAVE =
  "megaLaberintosNivel";

const CRYSTAL_SAVE =
  "megaLaberintosCristales";


let currentLevel =
  Number(
    localStorage.getItem(LEVEL_SAVE)
  ) || 1;

let crystals =
  Number(
    localStorage.getItem(CRYSTAL_SAVE)
  ) || 0;

let life = 100;

let keysCollected = 0;

let paused = false;

let levelFinished = false;

let invulnerable = false;


/* =========================================================
   ESCENA
========================================================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x03040a);

scene.fog =
  new THREE.Fog(
    0x03040a,
    25,
    190
  );


/* =========================================================
   CÁMARA
========================================================= */

const camera =
  new THREE.PerspectiveCamera(
    68,
    innerWidth / innerHeight,
    .1,
    1000
  );

camera.position.set(
  0,
  8,
  10
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    1.6
  )
);

renderer.shadowMap.enabled=true;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =========================================================
   LUCES
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0x8da0ff,
    0x11151d,
    1.5
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    1.5
  );

sun.position.set(
  30,
  60,
  20
);

sun.castShadow=true;

scene.add(sun);


/* =========================================================
   ESTRELLAS
========================================================= */

const starGeometry =
  new THREE.BufferGeometry();

const starPositions=[];

for(
  let i=0;
  i<1200;
  i++
){

  starPositions.push(
    (Math.random()-.5)*500,
    Math.random()*250,
    (Math.random()-.5)*500
  );

}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    starPositions,
    3
  )
);

scene.add(
  new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
      color:0xffffff,
      size:.7
    })
  )
);


/* =========================================================
   GRUPOS
========================================================= */

let mazeGroup =
  new THREE.Group();

let objectGroup =
  new THREE.Group();

let enemyGroup =
  new THREE.Group();

scene.add(
  mazeGroup,
  objectGroup,
  enemyGroup
);


/* =========================================================
   JUGADOR
========================================================= */

const player =
  new THREE.Group();


const body =
  new THREE.Mesh(

    new THREE.CapsuleGeometry(
      .5,
      1,
      6,
      10
    ),

    new THREE.MeshStandardMaterial({
      color:0x5d87c7,
      roughness:.8
    })

  );

body.position.y=1.1;

body.castShadow=true;

player.add(body);


const head =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      .46,
      12,
      12
    ),

    new THREE.MeshStandardMaterial({
      color:0xcbd3df
    })

  );

head.position.y=2;

head.castShadow=true;

player.add(head);


const playerLight =
  new THREE.PointLight(
    0x7180ff,
    1.6,
    12
  );

playerLight.position.y=1.4;

player.add(playerLight);

scene.add(player);


/* =========================================================
   DATOS
========================================================= */

let maze=[];

let mazeSize=9;

let cellSize=4;

let exitPosition={
  x:0,
  z:0
};


/* =========================================================
   SEMILLA
========================================================= */

function seeded(seed){

  const x =
    Math.sin(seed*12.9898)*
    43758.5453;

  return x-
    Math.floor(x);

}


/* =========================================================
   GENERADOR
========================================================= */

function generateMaze(
  size,
  seed
){

  const grid=[];

  for(
    let z=0;
    z<size;
    z++
  ){

    grid[z]=[];

    for(
      let x=0;
      x<size;
      x++
    ){

      grid[z][x]=1;

    }

  }


  function carve(x,z){

    grid[z][x]=0;

    const dirs=[
      [2,0],
      [-2,0],
      [0,2],
      [0,-2]
    ];

    dirs.sort(
      (a,b)=>{

        const ra=
          seeded(
            seed+
            x*31+
            z*17+
            a[0]*7+
            a[1]*13
          );

        const rb=
          seeded(
            seed+
            x*31+
            z*17+
            b[0]*7+
            b[1]*13
          );

        return ra-rb;

      }
    );


    for(
      const d of dirs
    ){

      const nx=
        x+d[0];

      const nz=
        z+d[1];

      if(
        nx>0 &&
        nz>0 &&
        nx<size-1 &&
        nz<size-1 &&
        grid[nz][nx]===1
      ){

        grid[
          z+d[1]/2
        ][
          x+d[0]/2
        ]=0;

        carve(
          nx,
          nz
        );

      }

    }

  }

  carve(1,1);

  return grid;
}


/* =========================================================
   CELDA → MUNDO
========================================================= */

function cellToWorld(
  x,
  z
){

  const offset=
    (
      mazeSize-1
    )*
    cellSize/
    2;

  return{
    x:x*cellSize-offset,
    z:z*cellSize-offset
  };

}


/* =========================================================
   TAMAÑO PROGRESIVO
========================================================= */

function getMazeSize(
  level
){

  /*
    1 = 9x9

    300 ≈ 43x43

    Limitado para no provocar
    cargas enormes.
  */

  let size=
    9+
    Math.floor(
      level/18
    )*2;

  size=
    Math.min(
      43,
      size
    );

  if(size%2===0)
    size++;

  return size;
}


/* =========================================================
   DIFICULTAD
========================================================= */

function difficulty(
  level
){

  if(level<=20)
    return "Muy fácil";

  if(level<=50)
    return "Fácil";

  if(level<=90)
    return "Normal";

  if(level<=130)
    return "Difícil";

  if(level<=180)
    return "Muy difícil";

  if(level<=230)
    return "Extremo";

  if(level<=270)
    return "Pesadilla";

  if(level<300)
    return "Infernal";

  return "HIPERDIFÍCIL";
}


/* =========================================================
   LIMPIAR
========================================================= */

function clearGroup(
  group
){

  while(
    group.children.length
  ){

    group.remove(
      group.children[
        group.children.length-1
      ]
    );

  }

}


function clearLevel(){

  clearGroup(
    mazeGroup
  );

  clearGroup(
    objectGroup
  );

  clearGroup(
    enemyGroup
  );

}


/* =========================================================
   SUELO
========================================================= */

function createFloor(){

  const width=
    mazeSize*
    cellSize;

  const floor=
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        width,
        width
      ),

      new THREE.MeshStandardMaterial({
        color:0x090c15,
        roughness:1
      })

    );

  floor.rotation.x=
    -Math.PI/2;

  floor.receiveShadow=true;

  mazeGroup.add(
    floor
  );

}


/* =========================================================
   PAREDES
   LAS PAREDES FORMAN LOS DOS LADOS
   DE CADA PASILLO
========================================================= */

function createWalls(){

  const positions=[];

  for(
    let z=0;
    z<mazeSize;
    z++
  ){

    for(
      let x=0;
      x<mazeSize;
      x++
    ){

      if(
        maze[z][x]===1
      ){

        const p=
          cellToWorld(
            x,
            z
          );

        positions.push(p);

      }

    }

  }


  const geometry=
    new THREE.BoxGeometry(
      cellSize,
      3.8,
      cellSize
    );


  const material=
    new THREE.MeshStandardMaterial({
      color:
        currentLevel>=250
          ? 0x24283b
          : 0x343b52,
      roughness:.9
    });


  /*
    Una sola malla instanciada:
    mucho más rápida que crear
    cientos de Mesh individuales.
  */

  const walls=
    new THREE.InstancedMesh(
      geometry,
      material,
      positions.length
    );


  const matrix=
    new THREE.Matrix4();


  positions.forEach(
    (p,i)=>{

      matrix.makeTranslation(
        p.x,
        1.9,
        p.z
      );

      walls.setMatrixAt(
        i,
        matrix
      );

    }
  );


  walls.instanceMatrix.needsUpdate=true;

  walls.castShadow=true;

  walls.receiveShadow=true;

  mazeGroup.add(
    walls
  );

}


/* =========================================================
   CELDA LIBRE
========================================================= */

function randomOpenCell(
  seed
){

  for(
    let attempt=0;
    attempt<100;
    attempt++
  ){

    const x=
      1+
      Math.floor(
        seeded(
          seed+
          attempt*19
        )*
        (mazeSize-2)
      );

    const z=
      1+
      Math.floor(
        seeded(
          seed+
          attempt*47+
          100
        )*
        (mazeSize-2)
      );

    if(
      maze[z] &&
      maze[z][x]===0
    ){

      return{x,z};

    }

  }

  return{
    x:1,
    z:1
  };

}


/* =========================================================
   LLAVE
========================================================= */

function createKey(
  x,
  z
){

  const key=
    new THREE.Mesh(

      new THREE.TorusGeometry(
        .55,
        .14,
        10,
        20
      ),

      new THREE.MeshStandardMaterial({
        color:0xffd43b,
        emissive:0xff8500,
        emissiveIntensity:1.3
      })

    );

  key.position.set(
    x,
    1,
    z
  );

  key.userData.type=
    "key";

  objectGroup.add(
    key
  );

}


/* =========================================================
   CRISTAL
========================================================= */

function createCrystal(
  x,
  z
){

  const crystal=
    new THREE.Mesh(

      new THREE.OctahedronGeometry(
        .55
      ),

      new THREE.MeshStandardMaterial({
        color:0x7c63ff,
        emissive:0x4524ff,
        emissiveIntensity:1.4
      })

    );

  crystal.position.set(
    x,
    1,
    z
  );

  crystal.userData.type=
    "crystal";

  objectGroup.add(
    crystal
  );

}


/* =========================================================
   PUERTA
========================================================= */

function createDoor(
  x,
  z
){

  const door=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        3.2,
        3.5,
        .5
      ),

      new THREE.MeshStandardMaterial({
        color:0x923f46,
        roughness:.7
      })

    );

  door.position.set(
    x,
    1.75,
    z
  );

  door.userData.type=
    "door";

  door.userData.opened=
    false;

  objectGroup.add(
    door
  );

}


/* =========================================================
   ENEMIGO
========================================================= */

function createEnemy(
  x,
  z,
  type
){

  const enemy=
    new THREE.Group();


  let size=1;

  let color=0x873c9d;

  let speed=1.5;

  let hp=2;

  let damage=8;


  if(type==="fast"){

    size=.75;
    color=0xc8325c;
    speed=3;
    hp=1;
    damage=6;

  }


  if(type==="tank"){

    size=1.35;
    color=0x52648e;
    speed=.8;
    hp=7;
    damage=14;

  }


  if(type==="elite"){

    size=1.2;
    color=0xe46a36;
    speed=1.8;
    hp=10;
    damage=18;

  }


  const body=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        size,
        10,
        10
      ),

      new THREE.MeshStandardMaterial({
        color,
        roughness:.85
      })

    );

  body.scale.y=1.25;

  body.position.y=size;

  body.castShadow=true;

  enemy.add(body);


  for(
    const side of[-1,1]
  ){

    const eye=
      new THREE.Mesh(

        new THREE.SphereGeometry(
          .15,
          6,
          6
        ),

        new THREE.MeshBasicMaterial({
          color:0xff304d
        })

      );

    eye.position.set(
      side*.25,
      size*1.2,
      -size*.75
    );

    enemy.add(eye);

  }


  enemy.position.set(
    x,
    0,
    z
  );


  enemy.userData={
    type:"enemy",
    enemyType:type,
    speed,
    hp,
    damage,
    cooldown:0
  };


  enemyGroup.add(
    enemy
  );

}


/* =========================================================
   CREAR PORTAL
========================================================= */

function createExit(){

  const p=
    cellToWorld(
      mazeSize-2,
      mazeSize-2
    );

  exitPosition={
    x:p.x,
    z:p.z
  };


  const portal=
    new THREE.Mesh(

      new THREE.TorusGeometry(
        1.4,
        .23,
        12,
        28
      ),

      new THREE.MeshStandardMaterial({
        color:0x55aaff,
        emissive:0x2455ff,
        emissiveIntensity:2
      })

    );

  portal.position.set(
    p.x,
    1.8,
    p.z
  );

  portal.rotation.x=
    Math.PI/2;

  portal.userData.type=
    "exit";

  objectGroup.add(
    portal
  );

}


/* =========================================================
   CREAR NIVEL
========================================================= */

function createLevel(
  level
){

  clearLevel();

  levelFinished=false;

  keysCollected=0;

  life=100;


  mazeSize=
    getMazeSize(
      level
    );


  cellSize=
    Math.max(
      3.1,
      4-
      level*.0025
    );


  maze=
    generateMaze(
      mazeSize,
      100000+
      level*7919
    );


  createFloor();

  createWalls();

  createExit();


  /*
    JUGADOR
  */

  const start=
    cellToWorld(
      1,
      1
    );

  player.position.set(
    start.x,
    0,
    start.z
  );


  /*
    LLAVES
  */

  const keyCount=
    Math.min(
      7,
      1+
      Math.floor(
        level/45
      )
    );


  for(
    let i=0;
    i<keyCount;
    i++
  ){

    const cell=
      randomOpenCell(
        level+
        i*71+
        300
      );

    const p=
      cellToWorld(
        cell.x,
        cell.z
      );

    createKey(
      p.x,
      p.z
    );

  }


  /*
    PUERTAS
  */

  const doorCount=
    Math.min(
      7,
      Math.floor(
        level/40
      )
    );


  for(
    let i=0;
    i<doorCount;
    i++
  ){

    const cell=
      randomOpenCell(
        level+
        i*113+
        700
      );

    const p=
      cellToWorld(
        cell.x,
        cell.z
      );

    createDoor(
      p.x,
      p.z
    );

  }


  /*
    CRISTALES
  */

  const crystalCount=
    Math.min(
      25,
      2+
      Math.floor(
        level/10
      )
    );


  for(
    let i=0;
    i<crystalCount;
    i++
  ){

    const cell=
      randomOpenCell(
        level+
        i*31+
        1400
      );

    const p=
      cellToWorld(
        cell.x,
        cell.z
      );

    createCrystal(
      p.x,
      p.z
    );

  }


  /*
    ENEMIGOS
  */

  const enemyCount=
    Math.min(
      35,
      Math.floor(
        1+
        level/9
      )
    );


  for(
    let i=0;
    i<enemyCount;
    i++
  ){

    const cell=
      randomOpenCell(
        level+
        i*53+
        2300
      );


    if(
      cell.x<=3 &&
      cell.z<=3
    ){

      i--;
      continue;

    }


    const p=
      cellToWorld(
        cell.x,
        cell.z
      );


    let type="normal";

    const r=
      seeded(
        level+
        i*17+
        5000
      );


    if(
      level>=40 &&
      r>.75
    )
      type="fast";


    if(
      level>=100 &&
      r>.88
    )
      type="tank";


    if(
      level>=200 &&
      r>.95
    )
      type="elite";


    createEnemy(
      p.x,
      p.z,
      type
    );

  }


  updateHUD();

  drawMap();

}


/* =========================================================
   COLISIÓN PAREDES
========================================================= */

function collidesWithWalls(
  pos
){

  const radius=.62;


  const gx=
    Math.round(
      (
        pos.x+
        (
          mazeSize-1
        )*
        cellSize/
        2
      )/
      cellSize
    );


  const gz=
    Math.round(
      (
        pos.z+
        (
          mazeSize-1
        )*
        cellSize/
        2
      )/
      cellSize
    );


  for(
    let z=gz-1;
    z<=gz+1;
    z++
  ){

    for(
      let x=gx-1;
      x<=gx+1;
      x++
    ){

      if(
        z<0 ||
        x<0 ||
        z>=mazeSize ||
        x>=mazeSize
      )
        return true;


      if(
        maze[z][x]===1
      ){

        const p=
          cellToWorld(
            x,
            z
          );


        if(
          Math.abs(
            pos.x-p.x
          )<
          cellSize/2+
          radius
          &&
          Math.abs(
            pos.z-p.z
          )<
          cellSize/2+
          radius
        ){

          return true;

        }

      }

    }

  }


  return false;

}


/* =========================================================
   PUERTAS
========================================================= */

function collidesWithDoors(
  pos
){

  for(
    const door
    of objectGroup.children
  ){

    if(
      door.userData.type!=="door" ||
      door.userData.opened
    )
      continue;


    if(
      Math.abs(
        pos.x-
        door.position.x
      )<2 &&
      Math.abs(
        pos.z-
        door.position.z
      )<2
    ){

      /*
        Una llave abre automáticamente
        una puerta al tocarla.
      */

      if(
        keysCollected>0
      ){

        keysCollected--;

        door.userData.opened=true;

        door.visible=false;

        updateHUD();

        return false;

      }


      return true;

    }

  }


  return false;

}


/* =========================================================
   MOVIMIENTO
========================================================= */

const controls={
  up:false,
  down:false,
  left:false,
  right:false
};


const moveSpeed=8.5;


function updatePlayer(
  delta
){

  if(
    paused ||
    levelFinished
  )
    return;


  let dx=0;
  let dz=0;


  if(controls.up)
    dz--;

  if(controls.down)
    dz++;

  if(controls.left)
    dx--;

  if(controls.right)
    dx++;


  const len=
    Math.hypot(
      dx,
      dz
    );


  if(!len)
    return;


  dx/=len;
  dz/=len;


  const speed=
    moveSpeed+
    Math.min(
      2.5,
      currentLevel/100
    );


  const oldX=
    player.position.x;

  const oldZ=
    player.position.z;


  player.position.x+=
    dx*
    speed*
    delta;

  player.position.z+=
    dz*
    speed*
    delta;


  if(
    collidesWithWalls(
      player.position
    ) ||
    collidesWithDoors(
      player.position
    )
  ){

    player.position.x=
      oldX;

    player.position.z=
      oldZ;

  }


  player.rotation.y=
    Math.atan2(
      dx,
      dz
    );

}


/* =========================================================
   OBJETOS
========================================================= */

function updateObjects(){

  for(
    let i=
      objectGroup.children.length-1;
    i>=0;
    i--
  ){

    const object=
      objectGroup.children[i];


    if(
      object.userData.type==="key" ||
      object.userData.type==="crystal"
    ){

      if(
        object.position.distanceTo(
          player.position
        )<1.5
      ){

        if(
          object.userData.type==="key"
        ){

          keysCollected++;

        }
        else{

          crystals++;

          localStorage.setItem(
            CRYSTAL_SAVE,
            crystals
          );

        }


        objectGroup.remove(
          object
        );

        updateHUD();

      }

    }


    if(
      object.userData.type==="crystal"
    ){

      object.rotation.y+=.03;

      object.position.y=
        1+
        Math.sin(
          performance.now()*.003+
          object.id
        )*.15;

    }


    if(
      object.userData.type==="exit"
    ){

      object.rotation.z+=.025;

    }

  }

}


/* =========================================================
   ENEMIGOS
========================================================= */

function updateEnemies(
  delta
){

  if(
    paused ||
    levelFinished
  )
    return;


  for(
    const enemy
    of enemyGroup.children
  ){

    const direction=
      new THREE.Vector3()
      .subVectors(
        player.position,
        enemy.position
      );


    const distance=
      direction.length();


    if(
      distance<32 &&
      distance>1.5
    ){

      direction.normalize();


      const old=
        enemy.position.clone();


      enemy.position.addScaledVector(
        direction,
        enemy.userData.speed*
        delta
      );


      if(
        collidesWithWalls(
          enemy.position
        )
      ){

        enemy.position.copy(
          old
        );

      }

    }


    if(
      distance<1.7 &&
      enemy.userData.cooldown<=0 &&
      !invulnerable
    ){

      life=
        Math.max(
          0,
          life-
          enemy.userData.damage
        );


      enemy.userData.cooldown=.8;

      invulnerable=true;


      setTimeout(
        ()=>{
          invulnerable=false;
        },
        450
      );


      if(
        life<=0
      )
        die();

    }


    enemy.userData.cooldown=
      Math.max(
        0,
        enemy.userData.cooldown-
        delta
      );


    enemy.rotation.y+=
      delta*
      (
        enemy.userData.enemyType==="fast"
          ? 2.5
          : 1
      );

  }

}


/* =========================================================
   ATAQUE
========================================================= */

function attack(){

  if(
    paused ||
    levelFinished
  )
    return;


  let target=null;

  let best=4.3;


  for(
    const enemy
    of enemyGroup.children
  ){

    const distance=
      enemy.position.distanceTo(
        player.position
      );


    if(
      distance<best
    ){

      best=distance;

      target=enemy;

    }

  }


  if(!target)
    return;


  target.userData.hp--;


  const push=
    new THREE.Vector3()
    .subVectors(
      target.position,
      player.position
    )
    .normalize();


  target.position.addScaledVector(
    push,
    1.4
  );


  if(
    target.userData.hp<=0
  ){

    enemyGroup.remove(
      target
    );


    crystals+=
      target.userData.enemyType==="elite"
        ? 5
        : 1;


    localStorage.setItem(
      CRYSTAL_SAVE,
      crystals
    );

  }


  updateHUD();

}

   SALIDA

  const distance=
    player.position.distanceTo(
      new THREE.Vector3(
        exitPosition.x,
        0,
        exitPosition.z
      )
    );


  if(
    distance<2.8

    let doorsLeft=0;


    for(
      const object
      of objectGroup.children
    ){

      if(
        object.userData.type==="door" &&
        !object.userData.opened

        doorsLeft++;

      doorsLeft>0

      showMessage(
        "🚪 Puertas cerradas",
        "Todavía necesitas llaves para abrir todas las puertas."
      );

      return;

    }


    completeLevel();

  }

}

/* =========================================================
   MAPA DESDE ARRIBA
========================================================= */

const mapCanvas=
  document.getElementById(
    "mapCanvas"
  );

const mapCtx=
  mapCanvas.getContext(
    "2d"
  );


function drawMap(){

  const rect=
    mapCanvas.getBoundingClientRect();


  if(
    rect.width<10 ||
    rect.height<10
  )
    return;


  const dpr=
    Math.min(
      devicePixelRatio,
      2
    );


  mapCanvas.width=
    rect.width*dpr;

  mapCanvas.height=
    rect.height*dpr;


  mapCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  const width=
    rect.width;

  const height=
    rect.height;


  /*
    Fondo.
  */

  mapCtx.fillStyle=
    "#080b12";

  mapCtx.fillRect(
    0,
    0,
    width,
    height
  );


  /*
    Escala.
  */

  const padding=18;

  const usable=
    Math.min(
      width,
      height
    )-
    padding*2;


  const cell=
    usable/
    mazeSize;


  const offsetX=
    (
      width-
      cell*mazeSize
    )/2;


  const offsetY=
    (
      height-
      cell*mazeSize
    )/2;


  /*
    PASILLOS.

    Primero pintamos todos los espacios
    transitables.
  */

  mapCtx.fillStyle=
    "#17202c";


  for(
    let z=0;
    z<mazeSize;
    z++
  ){

    for(
      let x=0;
      x<mazeSize;
      x++
    ){

      if(
        maze[z][x]===0
      ){

        mapCtx.fillRect(
          offsetX+x*cell,
          offsetY+z*cell,
          cell+1,
          cell+1
        );

      }

    }

  }


  /*
    PAREDES.

    Aquí está lo que querías:
    las paredes se ven como dos bordes
    a los lados de cada pasillo.

    En vez de dibujar simplemente
    cuadrados negros, dibujamos cada
    pared con grosor visible.
  */

  mapCtx.fillStyle=
    "#596477";


  const wallThickness=
    Math.max(
      2,
      cell*.22
    );


  for(
    let z=0;
    z<mazeSize;
    z++
  ){

    for(
      let x=0;
      x<mazeSize;
      x++
    ){

      if(
        maze[z][x]!==1
      )
        continue;


      const px=
        offsetX+
        x*cell;

      const py=
        offsetY+
        z*cell;


      /*
        Dibujamos el bloque de pared.
      */

      mapCtx.fillRect(
        px,
        py,
        cell+1,
        cell+1
      );

    }

  }


  /*
    Resaltamos los bordes de los
    pasillos para que se perciban
    claramente las dos paredes.
  */

  mapCtx.strokeStyle=
    "#aab6c9";


  mapCtx.lineWidth=
    Math.max(
      1,
      cell*.07
    );


  for(
    let z=0;
    z<mazeSize;
    z++
  ){

    for(
      let x=0;
      x<mazeSize;
      x++
    ){

      if(
        maze[z][x]!==0
      )
        continue;


      const px=
        offsetX+
        x*cell;

      const py=
        offsetY+
        z*cell;


      /*
        Arriba.
      */

      if(
        z===0 ||
        maze[z-1][x]===1
      ){

        mapCtx.beginPath();

        mapCtx.moveTo(
          px,
          py
        );

        mapCtx.lineTo(
          px+cell,
          py
        );

        mapCtx.stroke();

      }


      /*
        Abajo.
      */

      if(
        z===mazeSize-1 ||
        maze[z+1][x]===1
      ){

        mapCtx.beginPath();

        mapCtx.moveTo(
          px,
          py+cell
        );

        mapCtx.lineTo(
          px+cell,
          py+cell
        );

        mapCtx.stroke();

      }


      /*
        Izquierda.
      */

      if(
        x===0 ||
        maze[z][x-1]===1
      ){

        mapCtx.beginPath();

        mapCtx.moveTo(
          px,
          py
        );

        mapCtx.lineTo(
          px,
          py+cell
        );

        mapCtx.stroke();

      }


      /*
        Derecha.
      */

      if(
        x===mazeSize-1 ||
        maze[z][x+1]===1
      ){

        mapCtx.beginPath();

        mapCtx.moveTo(
          px+cell,
          py
        );

        mapCtx.lineTo(
          px+cell,
          py+cell
        );

        mapCtx.stroke();

      }

    }

  }


  /*
    SALIDA — VERDE.
  */

  const exitCell=
    cellFromWorld(
      exitPosition.x,
      exitPosition.z
    );


  drawMapMarker(
    exitCell.x,
    exitCell.z,
    offsetX,
    offsetY,
    cell,
    "#45df76",
    "E"
  );


  /*
    LLAVES — AMARILLO.
  */

  for(
    const object
    of objectGroup.children
  ){

    if(
      object.userData.type!=="key"
    )
      continue;


    const c=
      cellFromWorld(
        object.position.x,
        object.position.z
      );


    drawMapMarker(
      c.x,
      c.z,
      offsetX,
      offsetY,
      cell,
      "#ffd447",
      "K"
    );

  }


  /*
    ENEMIGOS — ROJO.
  */

  for(
    const enemy
    of enemyGroup.children
  ){

    const c=
      cellFromWorld(
        enemy.position.x,
        enemy.position.z
      );


    drawMapMarker(
      c.x,
      c.z,
      offsetX,
      offsetY,
      cell,
      "#ff4d62",
      "!"
    );

  }


  /*
    JUGADOR — AZUL.
  */

  const pc=
    cellFromWorld(
      player.position.x,
      player.position.z
    );


  drawMapMarker(
    pc.x,
    pc.z,
    offsetX,
    offsetY,
    cell,
    "#55aaff",
    "●"
  );

}


/* =========================================================
   MUNDO → CELDA
========================================================= */

function cellFromWorld(
  x,
  z
){

  const offset=
    (
      mazeSize-1
    )*
    cellSize/
    2;


  return{

    x:Math.max(
      0,
      Math.min(
        mazeSize-1,
        Math.round(
          (
            x+offset
          )/
          cellSize
        )
      )
    ),

    z:Math.max(
      0,
      Math.min(
        mazeSize-1,
        Math.round(
          (
            z+offset
          )/
          cellSize
        )
      )
    )

  };

}


/* =========================================================
   MARCADOR DEL MAPA
========================================================= */

function drawMapMarker(
  x,
  z,
  ox,
  oy,
  cell,
  color,
  text
){

  const cx=
    ox+
    x*cell+
    cell/2;

  const cy=
    oy+
    z*cell+
    cell/2;


  mapCtx.fillStyle=color;

  mapCtx.beginPath();

  mapCtx.arc(
    cx,
    cy,
    Math.max(
      3,
      cell*.25
    ),
    0,
    Math.PI*2
  );

  mapCtx.fill();


  if(cell>=12){

    mapCtx.fillStyle="#000";

    mapCtx.font=
      "bold "+
      Math.max(
        7,
        cell*.3
      )+
      "px Arial";

    mapCtx.textAlign="center";

    mapCtx.textBaseline="middle";

    mapCtx.fillText(
      text,
      cx,
      cy
    );

  }

}

   TECLADO
========================================================= */

addEventListener(
  "keydown",
  event=>{

    const k=
      event.key.toLowerCase();


    if(
      k==="w" ||
      event.key==="ArrowUp"
    )
      controls.up=true;


    if(
      k==="s" ||
      event.key==="ArrowDown"
    )
      controls.down=true;


    if(
      k==="a" ||
      event.key==="ArrowLeft"
    )
      controls.left=true;


    if(
      k==="d" ||
      event.key==="ArrowRight"
    )
      controls.right=true;


    if(
      event.code==="Space"
    ){

      event.preventDefault();

      attack();

    }


    if(
      k==="m"
    ){

      document.getElementById(
        "mapBtn"
      ).click();

    }


    if(
      k==="escape"
    ){

      paused=!paused;

      document.getElementById(
        "pauseOverlay"
      ).style.display=
        paused
          ? "flex"
          : "none";

    }

  }
);


addEventListener(
  "keyup",
  event=>{

    const k=
      event.key.toLowerCase();


    if(
      k==="w" ||
      event.key==="ArrowUp"
    )
      controls.up=false;


    if(
      k==="s" ||
      event.key==="ArrowDown"
    )
      controls.down=false;


    if(
      k==="a" ||
      event.key==="ArrowLeft"
    )
      controls.left=false;


    if(
      k==="d" ||
      event.key==="ArrowRight"
    )
      controls.right=false;

  }
);


/* =========================================================
   MÓVIL
========================================================= */

function bindControl(
  id,
  property
){

  const button=
    document.getElementById(id);


  button.addEventListener(
    "pointerdown",
    event=>{
      event.preventDefault();
      controls[property]=true;
    }
  );


  [
    "pointerup",
    "pointercancel",
    "pointerleave"
  ].forEach(
    type=>{

      button.addEventListener(
        type,
        ()=>{
          controls[property]=false;
        }
      );

    }
  );

}


bindControl(
  "up",
  "up"
);

bindControl(
  "down",
  "down"
);

bindControl(
  "left",
  "left"
);

bindControl(
  "right",
  "right"
);


document.getElementById(
  "attack"
).addEventListener(
  "pointerdown",
  event=>{
    event.preventDefault();
    attack();
  }
);


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(){

  const target=
    new THREE.Vector3(
      player.position.x,
      player.position.y+8,
      player.position.z+10
    );


  camera.position.lerp(
    target,
    .1
  );


  camera.lookAt(
    player.position.x,
    player.position.y+1,
    player.position.z
  );

}


/* =========================================================
   BUCLE
========================================================= */

let lastTime=
  performance.now();


function animate(
  now
){

  requestAnimationFrame(
    animate
  );


  const delta=
    Math.min(
      .05,
      (now-lastTime)/1000
    );


  lastTime=now;


  if(
    !paused &&
    !levelFinished
  ){

    updatePlayer(
      delta
    );

    updateObjects();

    updateEnemies(
      delta
    );

    checkExit();

  }


  updateCamera();

  updateHUD();


  renderer.render(
    scene,
    camera
  );

}


requestAnimationFrame(
  animate
);


/* =========================================================
   INICIAR
========================================================= */

createLevel(
  currentLevel
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    drawMap();

  }
);

</script>
