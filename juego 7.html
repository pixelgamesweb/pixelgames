<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Pixel Games - Zona de Combate</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#02030a}
#game{width:100vw;height:100vh}
#hud{
 position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;
 display:flex;gap:10px;background:rgba(0,0,0,.65);padding:8px;border-radius:18px;
 border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px)
}
.marcador{min-width:105px;padding:10px 15px;border-radius:13px;background:rgba(0,0,0,.75);
 color:#fff;font-size:19px;font-weight:900;text-align:center;box-shadow:inset 0 0 12px rgba(255,255,255,.04),0 5px 18px rgba(0,0,0,.4)}
.puntos{color:#ffd21c}.nivel{color:#63c8ff}
.vida{color:#ff4242;min-width:190px}
.barra{display:inline-block;width:95px;height:13px;background:#310d12;border-radius:10px;overflow:hidden;vertical-align:middle;margin-left:6px}
#vidaBar{display:block;width:100%;height:100%;background:#ff4242;transition:width .15s}
#controles{
 position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;
 width:min(96vw,850px);display:flex;justify-content:center;gap:10px
}
.control{
 width:105px;height:72px;border:2px solid rgba(255,255,255,.2);border-radius:20px;
 background:rgba(0,0,0,.72);color:#fff;font-size:32px;font-weight:bold;
 box-shadow:0 8px 25px rgba(0,0,0,.5);touch-action:none
}
.control small{display:block;font-size:11px;margin-top:2px;letter-spacing:.5px}
.control:active{transform:scale(.94);background:#111}
#mensaje{
 position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:25;
 padding:10px 18px;border-radius:13px;background:rgba(0,0,0,.72);
 color:white;font-size:18px;font-weight:900;text-align:center;pointer-events:none
}
#gameOver,#felicidades{
 display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(0,0,0,.82)
}
.panel{
 width:min(90vw,440px);padding:34px;background:#080910;border:1px solid rgba(255,255,255,.15);
 border-radius:25px;color:white;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.8)
}
.panel h1{font-size:40px;margin:0 0 18px}
.panel button{
 border:0;border-radius:15px;padding:14px 25px;background:#1266e8;color:white;
 font-size:18px;font-weight:900;box-shadow:0 5px 0 #0844a0;margin:5px
}
#crosshair{position:fixed;left:50%;top:50%;z-index:15;transform:translate(-50%,-50%);
 width:30px;height:30px;pointer-events:none;opacity:.75}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}
#crosshair:before{left:14px;top:0;width:2px;height:30px}
#crosshair:after{left:0;top:14px;width:30px;height:2px}
@media(max-width:600px){
 .control{width:78px;height:68px;font-size:26px}
 .marcador{min-width:78px;padding:8px 7px;font-size:15px}
 .vida{min-width:150px}.barra{width:65px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="crosshair"></div>

<div id="hud">
 <div class="marcador puntos">⭐ <span id="puntos">0</span></div>
 <div class="marcador nivel">NIVEL <span id="nivel">1</span></div>
 <div class="marcador vida">♥ <span id="vidaTexto">100</span>
  <span class="barra"><span id="vidaBar"></span></span>
 </div>
</div>

<div id="mensaje">NIVEL 1 · ¡DETÉN AL OBJETIVO!</div>

<div id="controles">
 <button class="control" data-weapon="pistola">🔫<small>PISTOLA</small></button>
 <button class="control" data-weapon="laser">⚡<small>LÁSER</small></button>
 <button class="control" data-weapon="fuego">🔥<small>FUEGO</small></button>
 <button class="control" data-weapon="bomba">💣<small>BOMBA</small></button>
</div>

<div id="gameOver">
 <div class="panel">
  <h1>GAME OVER</h1>
  <p>Has llegado al nivel <b id="nivelFinal">1</b>.</p>
  <p>Puntuación: <b id="puntosFinal">0</b></p>
  <button onclick="location.reload()">↻ VOLVER A JUGAR</button>
 </div>
</div>

<div id="felicidades">
 <div class="panel">
  <h1>¡FELICIDADES!</h1>
  <p id="textoVictoria">Nivel superado.</p>
  <button id="siguienteBtn">▶ SIGUIENTE NIVEL</button>
  <button onclick="location.reload()">↻ VOLVER A JUGAR</button>
 </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050914);
scene.fog = new THREE.Fog(0x050914, 16, 55);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 4.2, 11);
camera.lookAt(0, 2, -8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9cc7ff,0x141414,2.0));
const sun = new THREE.DirectionalLight(0xffffff,2.8);
sun.position.set(-8,14,8); sun.castShadow=true; scene.add(sun);

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(50,100),
 new THREE.MeshStandardMaterial({color:0x202733,roughness:.95})
);
ground.rotation.x=-Math.PI/2; ground.position.y=0; ground.position.z=-18;
ground.receiveShadow=true; scene.add(ground);

const road = new THREE.Mesh(
 new THREE.PlaneGeometry(13,100),
 new THREE.MeshStandardMaterial({color:0x11151d,roughness:1})
);
road.rotation.x=-Math.PI/2; road.position.y=.01; road.position.z=-18; scene.add(road);

for(let z=-2;z>-55;z-=4){
 const line=new THREE.Mesh(new THREE.BoxGeometry(.18,.03,1.7),new THREE.MeshBasicMaterial({color:0x8a94a5}));
 line.position.set(0,.04,z); scene.add(line);
}

function box(w,h,d,c){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.75}));
 m.castShadow=true;m.receiveShadow=true;return m;
}
function addCity(){
 for(let side of [-1,1]){
  for(let i=0;i<16;i++){
   const h=2+Math.random()*8;
   const b=box(2.2,h,2.2,side<0?0x293447:0x313b4f);
   b.position.set(side*(8+Math.random()*4),h/2,-i*5-5-Math.random()*2);
   scene.add(b);
  }
 }
}
addCity();

function makePerson(color=0x4d8edb, uniform=false){
 const g=new THREE.Group();
 const body=box(1.0,1.5,.55,color); body.position.y=2.0; g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),new THREE.MeshStandardMaterial({color:0xf0b28a}));
 head.position.y=3.1;head.castShadow=true;g.add(head);
 const leg1=box(.3,1.35,.35,uniform?0x222a36:0x303642),leg2=leg1.clone();
 leg1.position.set(-.22,.67,0);leg2.position.set(.22,.67,0);g.add(leg1,leg2);
 const arm1=box(.28,1.15,.3,color),arm2=arm1.clone();
 arm1.rotation.z=-.12;arm2.rotation.z=.12;arm1.position.set(-.68,2.0,0);arm2.position.set(.68,2.0,0);g.add(arm1,arm2);
 return g;
}
function makeCar(c=0xc93636){
 const g=new THREE.Group();
 const base=box(2.2,.55,3.5,c);base.position.y=.65;g.add(base);
 const top=box(1.55,.6,1.75,0x202936);top.position.set(0,1.18,.15);g.add(top);
 for(const x of [-1,1])for(const z of [-1.1,1.1]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.28,12),new THREE.MeshStandardMaterial({color:0x090909}));
  w.rotation.z=Math.PI/2;w.position.set(x*1.15,.42,z);g.add(w);
 }
 return g;
}
function makeHelicopter(){
 const g=new THREE.Group();
 const body=box(2.2,1.2,3.2,0x45556b);body.position.y=3.0;g.add(body);
 const glass=box(1.5,.7,.9,0x79a7c9);glass.position.set(0,3.25,1.55);g.add(glass);
 const tail=box(.45,.45,3.6,0x45556b);tail.position.set(0,3.15,-3.0);g.add(tail);
 const rotor=box(5,.12,.25,0x15191f);rotor.position.y=4.0;g.add(rotor);
 return g;
}

let level=1, score=0, hp=100, targetObjects=[], enemyBullets=[];
let weapon="pistola", gameActive=true, mouseX=0, lastEnemyShot=0, lastHeliDamage=0;
let bombProjectiles=[];
const puntosEl=document.getElementById("puntos");
const nivelEl=document.getElementById("nivel");
const vidaTexto=document.getElementById("vidaTexto");
const vidaBar=document.getElementById("vidaBar");
const mensaje=document.getElementById("mensaje");

function updateHUD(){
 puntosEl.textContent=score;
 nivelEl.textContent=level;
 vidaTexto.textContent=Math.max(0,Math.ceil(hp));
 vidaBar.style.width=Math.max(0,hp)+"%";
}
function clearTargets(){
 targetObjects.forEach(o=>scene.remove(o.group));
 targetObjects=[];
 enemyBullets.forEach(b=>scene.remove(b.mesh)); enemyBullets=[];
 bombProjectiles.forEach(b=>scene.remove(b.mesh)); bombProjectiles=[];
}
function addTarget(group,type,hits,damage,speed,points){
 group.position.z=-27;
 scene.add(group);
 targetObjects.push({group,type,hits,damage,speed,points,maxHits:hits});
}
function loadLevel(n){
 clearTargets();level=n;gameActive=true;lastEnemyShot=performance.now();lastHeliDamage=performance.now();
 if(n===1){
  mensaje.textContent="NIVEL 1 · PERSONA · ¡DETÉNLA!";
  addTarget(makePerson(), "persona",1,0,0.009,100);
 }else if(n===2){
  mensaje.textContent="NIVEL 2 · 2 POLICÍAS · ¡NO DEJES QUE LLEGUEN!";
  const a=makePerson(0x274b78,true), b=makePerson(0x355f91,true);
  a.position.x=-2.1;b.position.x=2.1;
  addTarget(a,"policia",10,0,.014,300);
  addTarget(b,"policia",10,0,.014,300);
 }else if(n===3){
  mensaje.textContent="NIVEL 3 · COCHES · ¡EVITA SUS BOMBAS!";
  [-2.6,0,2.6].forEach((x,i)=>{
   const car=makeCar([0xd13b3b,0x2f86d1,0xe0a52c][i]);
   car.position.x=x;addTarget(car,"coche",100,0,.012,250);
  });
 }else if(n===4){
  mensaje.textContent="NIVEL 4 · HELICÓPTERO · ¡DESTRUYELO CON UNA BOMBA!";
  const heli=makeHelicopter(); heli.position.y=5.5; addTarget(heli,"helicoptero",100,0,.012,900);
 }else if(n===5){
  mensaje.textContent="NIVEL 5 · EDIFICIO · ¡PLAF, PLAF, PLAF!";
  const building=box(9,11,4,0x4a5364); building.position.set(0,5.5,-31);
  addTarget(building,"edificio",1,0,.004,1500);
  for(let i=0;i<8;i++){
   const person=makePerson(0x8a4c4c,false);
   person.scale.set(.55,.55,.55);
   person.position.set((i%4-1.5)*1.7,1.1,0);
   building.add(person);
  }
 }else{
  mensaje.textContent="NIVEL "+n+" · ¡OLEADA FINAL!";
  for(let i=0;i<n;i++){
   const obj=i%2?makeCar(0x7a42c9):makePerson(0x7e5ac9);
   obj.position.x=(i%5-2)*2.7;
   addTarget(obj,i%2?"coche":"persona",100,0,.014+n*.001,200+n*80);
  }
 }
 updateHUD();
}
function hitTarget(t){
 if(!gameActive)return;
 let dmg=0;
 if(t.type==="persona"){
  dmg=weapon==="bomba"?20:(weapon==="laser"?50:100);
 }else if(t.type==="policia"){
  dmg=weapon==="bomba"?20:(weapon==="laser"?50:10);
 }else if(t.type==="coche"){
  dmg=weapon==="bomba"?5:(weapon==="laser"?20:1);
 }else if(t.type==="helicoptero"){
  dmg=weapon==="bomba"?100:(weapon==="laser"?10:0);
 }else if(t.type==="edificio"){
  dmg=weapon==="pistola"?100:0;
 }else{
  dmg=weapon==="bomba"?20:(weapon==="laser"?50:10);
 }
 if(dmg<=0)return;
 t.hits-=dmg;
 score+=Math.max(1,Math.round(t.points*dmg/100));
 if(t.hits<=0){
  const p=t.group.getWorldPosition(new THREE.Vector3());
  const flash=new THREE.Mesh(
   new THREE.SphereGeometry(t.type==="edificio"?1.5:.7,16,10),
   new THREE.MeshBasicMaterial({color:weapon==="fuego"?0xff6a00:0xffd54a,transparent:true,opacity:.85})
  );
  flash.position.copy(p);scene.add(flash);
  setTimeout(()=>scene.remove(flash),220);
  scene.remove(t.group);
  targetObjects=targetObjects.filter(x=>x!==t);
 }
 if(targetObjects.length===0)winLevel();
 updateHUD();
}
function throwBomb(){
 if(!gameActive)return;
 const bomb=new THREE.Mesh(
  new THREE.SphereGeometry(.22,12,8),
  new THREE.MeshStandardMaterial({color:0x202020,roughness:.65})
 );
 bomb.position.set(0,1.7,8.5);
 scene.add(bomb);
 bombProjectiles.push({mesh:bomb,speed:.009,target:null,age:0});
}
function shoot(){
 if(!gameActive)return;
 if(weapon==="bomba"){throwBomb();return;}
 let best=null,bestDist=Infinity;
 targetObjects.forEach(t=>{
  const v=t.group.getWorldPosition(new THREE.Vector3()); v.project(camera);
  const d=Math.hypot(v.x-(mouseX/innerWidth*2-1),v.y);
  if(d<.45 && t.group.position.z<7 && d<bestDist){best=t;bestDist=d}
 });
 if(!best){
  best=targetObjects.slice().sort((a,b)=>b.group.position.z-a.group.position.z)[0];
 }
 if(best)hitTarget(best);
}
function winLevel(){
 gameActive=false;
 document.getElementById("textoVictoria").textContent="Nivel "+level+" superado. Puntuación: "+score;
 document.getElementById("felicidades").style.display="flex";
 document.getElementById("siguienteBtn").onclick=()=>{
  document.getElementById("felicidades").style.display="none";
  loadLevel(level+1);
 };
}
function gameOver(){
 gameActive=false;
 document.getElementById("nivelFinal").textContent=level;
 document.getElementById("puntosFinal").textContent=score;
 document.getElementById("gameOver").style.display="flex";
}
function damagePlayer(amount){
 if(!gameActive)return;
 hp-=amount;updateHUD();
 if(hp<=0)gameOver();
}
document.querySelectorAll(".control").forEach(btn=>{
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();weapon=btn.dataset.weapon;shoot();
 });
});
renderer.domElement.addEventListener("pointermove",e=>{mouseX=e.clientX});
renderer.domElement.addEventListener("pointerdown",()=>shoot());

addEventListener("keydown",e=>{
 if(e.code==="Space")shoot();
 if(e.key==="1")weapon="pistola";
 if(e.key==="2")weapon="laser";
 if(e.key==="3")weapon="fuego";
 if(e.key==="4")weapon="bomba";
});

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(40,now-last);last=now;
 if(gameActive){
  targetObjects.forEach(t=>{
   t.group.position.z+=t.speed*dt;

   if(t.type==="persona"){
    // Caminata muy lenta y brazos/piernas alternados.
    const walk=Math.sin(now*.012);
    if(t.group.children.length>=5){
     t.group.children[2].rotation.x=walk*.35;
     t.group.children[3].rotation.x=-walk*.35;
     t.group.children[4].rotation.z=walk*.22;
    }
   }

   if(t.type==="policia"){
    const walk=Math.sin(now*.018);
    t.group.rotation.y=Math.sin(now*.004)*.04;
    if(now-lastEnemyShot>2000){
     const from=t.group.position.clone();
     from.y=2.2;
     const bullet=new THREE.Mesh(
      new THREE.BoxGeometry(.12,.12,.75),
      new THREE.MeshBasicMaterial({color:0xff3344})
     );
     bullet.position.copy(from);
     scene.add(bullet);
     const target=new THREE.Vector3(0,1.6,8);
     const dir=target.clone().sub(from).normalize();
     enemyBullets.push({mesh:bullet,dir,speed:.055,damage:5});
     lastEnemyShot=now;
    }
    if(t.group.position.z>6) gameOver();
   }

   if(t.type==="coche"){
    if(Math.random()<0.0007*dt){
     const from=t.group.position.clone();from.y=1.1;
     const bullet=new THREE.Mesh(
      new THREE.SphereGeometry(.18,10,8),
      new THREE.MeshBasicMaterial({color:0xff8b2c})
     );
     bullet.position.copy(from);
     scene.add(bullet);
     const dir=new THREE.Vector3(-from.x*.02,-.01,1).normalize();
     enemyBullets.push({mesh:bullet,dir,speed:.018,damage:10});
    }
    if(t.group.position.z>6)gameOver();
   }

   if(t.type==="helicoptero"){
    t.group.position.x=Math.sin(now*.0007)*3.3;
    t.group.position.z+=Math.sin(now*.001)*.002;
    if(now-lastHeliDamage>1000){
     damagePlayer(5);
     lastHeliDamage=now;
    }
   }
   if(t.type==="persona" && t.group.position.z>6)gameOver();
  });

  enemyBullets.forEach((b,i)=>{
   b.mesh.position.addScaledVector(b.dir,b.speed*dt);
   if(b.mesh.position.z>7 || b.mesh.position.y<.2){
    scene.remove(b.mesh);enemyBullets.splice(i,1);return;
   }
   if(b.mesh.position.distanceTo(new THREE.Vector3(0,1.6,8))<.7){
    damagePlayer(b.damage);scene.remove(b.mesh);enemyBullets.splice(i,1);
   }
  });

  bombProjectiles.forEach((b,i)=>{
   // La bomba vuela hacia el objetivo más cercano a la velocidad de la antigua persona.
   if(!b.target || !targetObjects.includes(b.target))
    b.target=targetObjects.slice().sort((a,c)=>c.group.position.z-a.group.position.z)[0];
   if(b.target){
    const targetPos=b.target.group.getWorldPosition(new THREE.Vector3());
    const dir=targetPos.clone().sub(b.mesh.position).normalize();
    b.mesh.position.addScaledVector(dir,.045*dt);
    b.age+=dt;
    if(b.mesh.position.distanceTo(targetPos)<.65 || b.age>5000){
     const flash=new THREE.Mesh(
      new THREE.SphereGeometry(.55,12,8),
      new THREE.MeshBasicMaterial({color:0xff9f1a,transparent:true,opacity:.75})
     );
     flash.position.copy(b.mesh.position);scene.add(flash);
     setTimeout(()=>scene.remove(flash),180);
     hitTarget(b.target);
     scene.remove(b.mesh);bombProjectiles.splice(i,1);
    }
   }else{
    scene.remove(b.mesh);bombProjectiles.splice(i,1);
   }
  });
 }
 renderer.render(scene,camera);
}
loadLevel(1);
animate(performance.now());

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});

function volverAlMenu(){
  window.location.href = "juegos_HTML.html";
}
</script>

<script>
/* APUNTAR CON RATÓN + DISPARAR AL HACER CLIC */
(function(){
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let aimPoint = new THREE.Vector3(0,1.5,0);

  window.addEventListener('mousemove', (e)=>{
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(scene.children, true);
    if(hits.length){
      // El ratón apunta exactamente al objeto 3D que está debajo.
      aimPoint.copy(hits[0].point);
    } else {
      const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
      raycaster.ray.intersectPlane(plane, aimPoint);
    }
  });

  window.addEventListener('click',(e)=>{
    // No disparar al pulsar botones de la interfaz.
    if(e.target.closest('button')) return;

    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse,camera);

    // Primero intenta seleccionar un objetivo 3D bajo el ratón.
    const hits = raycaster.intersectObjects(scene.children,true);
    let target = null;
    for(const h of hits){
      let o=h.object;
      while(o && o.parent && !o.userData?.targetType) o=o.parent;
      if(o?.userData?.targetType){ target=o; break; }
    }

    // Si existe un objetivo, se guarda como objetivo del disparo.
    if(target){
      window.mouseTarget = target;
      window.mouseAimPoint = target.position.clone();
    } else {
      window.mouseTarget = null;
      window.mouseAimPoint = aimPoint.clone();
    }

    // Usa la función de disparo existente si el juego la expone.
    if(typeof window.shootWeapon === 'function'){
      window.shootWeapon(window.selectedWeapon || 'pistol', target);
    } else if(typeof window.shoot === 'function'){
      window.shoot(window.selectedWeapon || 'pistol', target);
    }
  });
})();
</script>

</body>
</html>
<script>
/* Mejora visual Pixel Games: ciclo de marcha muy lento y brazos alternos. */
window.animatePixelWalker = function(obj, t, walking=true){
  if(!obj || !obj.userData) return;
  const a = obj.userData.walkArms || [];
  const legs = obj.userData.walkLegs || [];
  if(walking){
    const s = Math.sin(t*2.2);
    if(a[0]) a[0].rotation.z = .25*s;
    if(a[1]) a[1].rotation.z = -.25*s;
    if(legs[0]) legs[0].rotation.x = -.22*s;
    if(legs[1]) legs[1].rotation.x = .22*s;
  }
};
</script>
