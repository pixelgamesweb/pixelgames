<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Chat Global - Pixel Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #050814;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      height: 580px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
    }

    h1 {
      font-size: 22px;
      color: #00e5ff;
      text-shadow: 0 0 10px #00e5ff;
      text-align: center;
    }

    .status-bar {
      font-size: 11px;
      color: #00ff88;
      text-align: center;
      font-weight: bold;
    }

    #chat-box {
      flex: 1;
      background: #080b12;
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-item {
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 85%;
      word-wrap: break-word;
    }

    .msg-header {
      color: #00e5ff;
      font-weight: bold;
      font-size: 11px;
      margin-bottom: 3px;
    }

    input {
      background: #080b12;
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #00e5ff; box-shadow: 0 0 8px #00e5ff; }

    #username { width: 100%; }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #message { flex: 1; }

    .btn {
      padding: 10px 16px;
      background: linear-gradient(180deg, #00e5ff, #0088cc);
      color: #000;
      font-weight: bold;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(1.2); }

    .btn-back {
      margin-top: 15px;
      background: linear-gradient(180deg, #ff4757, #c0392b);
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>

  <!-- Cliente de Supabase Realtime -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="chat-card">
    <h1>CHAT MUNDIAL 🌍</h1>
    <div class="status-bar" id="status">● Conectado al servidor global</div>

    <div class="user-setup">
      <input type="text" id="username" placeholder="Tu Nombre / Apodo" maxlength="15">
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
      <input type="text" id="message" placeholder="Escribe un mensaje..." maxlength="100" onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="btn" onclick="sendMessage()">ENVIAR</button>
    </div>
  </div>

  <a href="juegos.html" class="btn-back">VOLVER AL MENÚ</a>

  <script>
    const SUPABASE_URL = 'https://xyzcompany.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5emNvbXBhbnkiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY3MDAwMDAwMCwiZXhwIjoyMDAwMDAwMDAwfQ.exampleKey';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const chatBox = document.getElementById('chat-box');
    const channel = supabaseClient.channel('global_roblox_chat');

    channel
      .on('broadcast', { event: 'shout' }, payload => {
        addMessageToScreen(payload.payload);
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          document.getElementById('status').textContent = '● Conectado en vivo a la red';
        }
      });

    function sendMessage() {
      const nameInput = document.getElementById('username');
      const msgInput = document.getElementById('message');
      
      const name = nameInput.value.trim() || "Anónimo";
      const text = msgInput.value.trim();

      if (!text) return;

      const data = {
        user: name,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      channel.send({
        type: 'broadcast',
        event: 'shout',
        payload: data
      });

      addMessageToScreen(data);
      msgInput.value = "";
    }

    function addMessageToScreen(data) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg-item';
      msgDiv.innerHTML = `
        <div class="msg-header">${data.user} <span style="color:#aaa; font-size:9px;">[${data.time || ''}]</span></div>
        <div>${data.text}</div>
      `;

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
