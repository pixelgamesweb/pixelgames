<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATTLE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #2c3e50;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .panell-control {
      margin-bottom: 20px;
      background: #34495e;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
    }

    select, button {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      margin: 5px;
    }

    button {
      background-color: #27ae60;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background-color: #2ecc71;
    }

    .tauler {
      margin: 20px auto;
      padding: 20px;
      background: #1e272c;
      border-radius: 10px;
      max-width: 500px;
    }

    /* Estils per la pantalla de Game Over (Modal) */
    .overlay-game-over {
      display: none; /* Amagat per defecte */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-game-over {
      background: #c0392b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      text-align: center;
    }

    .modal-game-over h1 {
      font-size: 48px;
      margin: 0 0 10px 0;
      letter-spacing: 2px;
    }

    .boto-reiniciar {
      background-color: #f39c12;
    }

    .boto-web {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <h1>Joc 2</h1>

  <!-- Configuració i Selecció de Dificultat -->
  <div class="panell-control">
    <label for="dificultat-bot">Dificultat del Bot: </label>
    <select id="dificultat-bot">
      <option value="facil">Fàcil</option>
      <option value="normal" selected>Normal</option>
      <option value="dificil">Difícil</option>
    </select>
    <button onclick="reiniciarPartida()">Nova Partida</button>
  </div>

  <!-- Àrea de Joc -->
  <div class="tauler">
    <p id="estat-joc">Fes clic per jugar una ronda.</p>
    <button onclick="jugarRonda()">Jugar Carta / Fer Moviment</button>
    <button onclick="simularDerrota()" style="background-color: #e74c3c;">Simular Morte/Derrota</button>
  </div>

  <!-- Pantalla de Game Over -->
  <div id="pantalla-game-over" class="overlay-game-over">
    <div class="modal-game-over">
      <h1>GAME OVER</h1>
      <p>Has perdut la partida!</p>
      <button class="boto-reiniciar" onclick="reiniciarPartida()">Tornar a jugar</button>
      <button class="boto-web" onclick="tornarAWeb()">Tornar a la web</button>
    </div>
  </div>

  <script>
    // Lògica de la IA del Bot amb nivell difícil adaptat (més assequible)
    function obtenirMovimentBot(cartesValides, estatJoc) {
      const dificultat = document.getElementById("dificultat-bot").value;

      if (dificultat === "facil") {
        // FÀCIL: Tria completament a l'atzar
        const indexAleatori = Math.floor(Math.random() * cartesValides.length);
        return cartesValides[indexAleatori];

      } else if (dificultat === "normal") {
        // NORMAL: Juga la primera carta disponible / estratègia bàsica
        return cartesValides[0];

      } else if (dificultat === "dificil") {
        // DIFÍCIL MÉS FÀCIL: Tria bé, però té un 25% de probabilitats d'equivocar-se
        const cometError = Math.random() < 0.25; 

        if (cometError) {
          // El bot comet un error humà i tria a l'atzar
          const indexAleatori = Math.floor(Math.random() * cartesValides.length);
          return cartesValides[indexAleatori];
        } else {
          // El bot juga de manera òptima
          return triarMillorCarta(cartesValides, estatJoc);
        }
      }
    }

    // Algorisme per triar la millor carta en nivell difícil
    function triarMillorCarta(cartes, estatJoc) {
      return cartes.reduce((millor, actual) => {
        return (actual.valor > millor.valor) ? actual : millor;
      }, cartes[0]);
    }

    // Funció per mostrar el Game Over quan el jugador mor
    function mostrarGameOver() {
      document.getElementById("pantalla-game-over").style.display = "flex";
    }

    // Reinicia el joc i amaga la pantalla de Game Over
    function reiniciarPartida() {
      document.getElementById("pantalla-game-over").style.display = "none";
      document.getElementById("estat-joc").innerText = "Partida reiniciada. Que comenci el joc!";
    }

    // Redirecciona a la pàgina principal de la web
    function tornarAWeb() {
      window.location.href = "index.html"; // Canvia 'index.html' per la teva URL si és diferent
    }

    // Exemples de simulació per provar el funcionament
    function jugarRonda() {
      const cartesExemple = [{ nom: "Carta 1", valor: 2 }, { nom: "Carta 2", valor: 8 }, { nom: "Carta 3", valor: 5 }];
      const cartaJugada = obtenirMovimentBot(cartesExemple, {});
      document.getElementById("estat-joc").innerText = "El bot ha jugat: " + cartaJugada.nom + " (Valor: " + cartaJugada.valor + ")";
    }

    function simularDerrota() {
      mostrarGameOver();
    }
  </script>
</body>
</html>
