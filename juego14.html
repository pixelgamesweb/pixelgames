<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL GAMES - Pixel Critic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: radial-gradient(circle at center, #1a1f35 0%, #080b12 100%);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game-card {
      background: #0f172a;
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 550px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      position: relative;
    }

    h1 {
      font-size: 32px;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #8191aa;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* ESTRELLAS DE VALORACIÓN INTERACTIVAS */
    .rating-stars {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .star {
      font-size: 45px;
      color: #334155;
      cursor: pointer;
      transition: transform 0.2s, color 0.2s, text-shadow 0.2s;
    }

    .star:hover, .star.active {
      color: #ffd700;
      text-shadow: 0 0 15px #ffd700;
      transform: scale(1.2);
    }

    /* ETIQUETAS SELECCIONABLES */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .tag-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #aaa;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .tag-btn.selected {
      background: #00e5ff;
      color: #000;
      border-color: #00e5ff;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    /* CAMPO DE TEXTO PARA RESEÑA */
    textarea {
      width: 100%;
      height: 80px;
      background: #02050f;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: white;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      resize: none;
      outline: none;
      margin-bottom: 20px;
    }

    textarea:focus {
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    /* BOTONES */
    .btn-submit {
      background: linear-gradient(180deg, #2ecc71, #27ae60);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
      transition: transform 0.1s, filter 0.2s;
      width: 100%;
    }

    .btn-submit:hover {
      transform: scale(1.02);
      filter: brightness(1.2);
    }

    .btn-back {
      background: transparent;
      border: 1px solid #8191aa;
      color: #8191aa;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 15px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      border-color: white;
      color: white;
    }

    /* ANIMACIÓN Y PREMIO */
    .reward-badge {
      display: none;
      background: rgba(255, 215, 0, 0.2);
      border: 1px dashed #ffd700;
      color: #ffd700;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>📝 PIXEL CRITIC</h1>
    <div class="subtitle">Evalúa la plataforma y gana recompensa</div>

    <div class="reward-badge" id="reward-box">
      🎉 ¡Reseña enviada! Has recibido +2.000 🪙 Pixelmonedas
    </div>

    <p style="font-size: 13px; color: #aaa;">¿Cuántas estrellas le das a PIXEL GAMES?</p>

    <div class="rating-stars">
      <span class="star" onclick="rate(1)">★</span>
      <span class="star" onclick="rate(2)">★</span>
      <span class="star" onclick="rate(3)">★</span>
      <span class="star" onclick="rate(4)">★</span>
      <span class="star" onclick="rate(5)">★</span>
    </div>

    <div class="tags-container">
      <button class="tag-btn" onclick="toggleTag(this)">🎨 Buenos Gráficos</button>
      <button class="tag-btn" onclick="toggleTag(this)">🔥 Súper Adictivo</button>
      <button class="tag-btn" onclick="toggleTag(this)">🚀 Carga Rápido</button>
      <button class="tag-btn" onclick="toggleTag(this)">👻 Gran Mercado</button>
      <button class="tag-btn" onclick="toggleTag(this)">🎡 Ruleta Divertida</button>
    </div>

    <textarea id="review-text" placeholder="Escribe un comentario corto de tu experiencia (Opcional)..."></textarea>

    <button class="btn-submit" id="btn-send" onclick="enviarValoracion()">🚀 ENVIAR VALORACIÓN Y COBRAR RECOMPENSA</button>

    <br>
    <button class="btn-back" onclick="volverMenu()">🎮 Volver al Menú de Juegos</button>
  </div>

  <script>
    const activeUser = localStorage.getItem('pixelgames_session') || 'Invitado';
    let currentRating = 0;

    function rate(stars) {
      currentRating = stars;
      const allStars = document.querySelectorAll('.star');
      allStars.forEach((star, index) => {
        if (index < stars) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });
    }

    function toggleTag(btn) {
      btn.classList.toggle('selected');
    }

    function enviarValoracion() {
      if (currentRating === 0) {
        alert('❌ Por favor selecciona al menos 1 estrella.');
        return;
      }

      const allUsers = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');
      if (!allUsers[activeUser]) {
        allUsers[activeUser] = { coins: 0 };
      }

      // Evitar que reclame premio infinito si ya valoró
      const yaValoro = localStorage.getItem('pixelgames_rated_' + activeUser);

      if (!yaValoro) {
        allUsers[activeUser].coins = (allUsers[activeUser].coins || 0) + 2000;
        localStorage.setItem('pixelgames_users', JSON.stringify(allUsers));
        localStorage.setItem('pixelgames_rated_' + activeUser, 'true');
        
        document.getElementById('reward-box').style.display = 'block';
      } else {
        alert('✅ ¡Gracias por actualizar tu valoración!');
      }

      document.getElementById('btn-send').disabled = true;
      document.getElementById('btn-send').innerText = '✅ VALORACIÓN ENVIADA';
      document.getElementById('btn-send').style.opacity = '0.6';
    }

    function volverMenu() {
      window.location.href = 'juegos.html';
    }
  </script>
</body>
</html>
