<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🟩 Pizarra Magnética</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#070b09;color:#fff}#app{height:100%;display:flex;flex-direction:column}header{height:64px;background:#080b10;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #333}h1{margin:0;font-size:24px}button{background:#121820;color:#fff;border:1px solid #44505d;border-radius:9px;padding:9px 13px;margin-left:6px;font-weight:bold}main{flex:1;display:flex;align-items:center;justify-content:center;padding:1cm}.campo{position:relative;width:calc(100vw - 2cm);height:calc(100vh - 64px - 38px - 2cm);max-width:1200px;max-height:620px;min-height:300px;background:repeating-linear-gradient(90deg,#176b35 0 70px,#1b743b 70px 140px);border:3px solid white;border-radius:7px;overflow:hidden;box-shadow:0 15px 45px #000;touch-action:none}.line{position:absolute;background:#fff;z-index:1}.top,.bottom{left:0;right:0;height:3px}.top{top:0}.bottom{bottom:0}.left,.right{top:0;bottom:0;width:3px}.left{left:0}.right{right:0}.medio{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}.circulo{position:absolute;left:50%;top:50%;width:145px;height:145px;border:3px solid white;border-radius:50%;transform:translate(-50%,-50%);z-index:1}.centro{position:absolute;left:50%;top:50%;width:8px;height:8px;background:white;border-radius:50%;transform:translate(-50%,-50%);z-index:2}.area{position:absolute;top:30%;height:40%;width:18%;border:3px solid white;z-index:1}.area.izq{left:0;border-left:0}.area.der{right:0;border-right:0}.areaPeq{position:absolute;top:40%;height:20%;width:8%;border:3px solid white;z-index:1}.areaPeq.izq{left:0;border-left:0}.areaPeq.der{right:0;border-right:0}.penal{position:absolute;top:50%;width:8px;height:8px;background:white;border-radius:50%;transform:translateY(-50%);z-index:2}.penal.izq{left:13%}.penal.der{right:13%}.larguero{position:absolute;top:calc(50% - 8px);width:12px;height:16px;background:white;border-radius:6px;z-index:4}.larguero.izq{left:-3px}.larguero.der{right:-3px}.ficha,.pelota{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;z-index:10;touch-action:none;cursor:grab;font-weight:900}.ficha{width:43px;height:43px;border-radius:50%;border:3px solid white;color:#fff;box-shadow:0 4px 10px #000b}.roja{background:#c90000}.azul{background:#0862d8}.amarilla{width:29px;height:29px;border:2px solid white;background:#e5b800}.pelota{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #111;font-size:16px}.drag{z-index:50;transform:translate(-50%,-50%) scale(1.12)}footer{height:38px;background:#080b10;display:flex;align-items:center;justify-content:center;color:#b8c7d9;font-size:13px}@media(max-width:650px){header{height:52px;padding:0 9px}h1{font-size:18px}main{padding:1cm 0.5cm}.campo{width:calc(100vw - 1cm);height:calc(100vh - 52px - 38px - 2cm)}.ficha{width:34px;height:34px;font-size:12px}.amarilla{width:24px;height:24px}.circulo{width:90px;height:90px}}
</style></head><body><div id="app"><header><h1>🟩 PIZARRA MAGNÉTICA</h1><div><button id="reset">↺ REINICIAR</button><button id="clear">✕ LIMPIAR</button></div></header><main><div id="campo" class="campo"><i class="line top"></i><i class="line bottom"></i><i class="line left"></i><i class="line right"></i><i class="line medio"></i><i class="circulo"></i><i class="centro"></i><i class="area izq"></i><i class="area der"></i><i class="areaPeq izq"></i><i class="areaPeq der"></i><i class="penal izq"></i><i class="penal der"></i><i class="larguero izq"></i><i class="larguero der"></i></div></main><footer id="msg">🔴 11 rojas · 🔵 11 azules · 🟡 11 amarillas · ⚽ pelota · todo arrastrable</footer></div><script>
const campo=document.getElementById('campo'),msg=document.getElementById('msg');const P={roja:[[7,50],[22,18],[22,35],[22,65],[22,82],[40,25],[40,50],[40,75],[62,25],[62,50],[62,75]],azul:[[93,50],[78,18],[78,35],[78,65],[78,82],[60,25],[60,50],[60,75],[38,25],[38,50],[38,75]],amarilla:[[50,10],[50,20],[50,30],[50,40],[50,60],[50,70],[50,80],[50,90],[46,45],[54,45],[50,55]]};
function crear(){document.querySelectorAll('.ficha,.pelota').forEach(e=>e.remove());for(const t of ['roja','azul','amarilla'])P[t].forEach((a,i)=>{let e=document.createElement('div');e.className='ficha '+t;e.textContent=t==='amarilla'?'':i+1;e.style.left=a[0]+'%';e.style.top=a[1]+'%';campo.appendChild(e);activar(e)});let b=document.createElement('div');b.className='pelota';b.textContent='⚽';b.style.left='50%';b.style.top='50%';campo.appendChild(b);activar(b)}
function activar(e){e.addEventListener('pointerdown',x=>{x.preventDefault();e.classList.add('drag');e.setPointerCapture(x.pointerId)});e.addEventListener('pointermove',x=>{if(!e.classList.contains('drag'))return;let r=campo.getBoundingClientRect();let px=(x.clientX-r.left)/r.width*100,py=(x.clientY-r.top)/r.height*100;e.style.left=Math.max(2,Math.min(98,px))+'%';e.style.top=Math.max(3,Math.min(97,py))+'%'});e.addEventListener('pointerup',()=>e.classList.remove('drag'));e.addEventListener('pointercancel',()=>e.classList.remove('drag'))}function reiniciar(){crear();msg.textContent='↺ Formación de fútbol 11 restaurada.'}function limpiar(){document.querySelectorAll('.ficha,.pelota').forEach(e=>e.remove());msg.textContent='✕ Pizarra limpia. Pulsa REINICIAR.'}document.getElementById('reset').onclick=reiniciar;document.getElementById('clear').onclick=limpiar;crear();
</script></body></html>
