<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Defender - Pixel Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050814;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #game-container {
      position: relative;
      border: 3px solid #00e5ff;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
      border-radius: 10px;
      overflow: hidden;
    }

    canvas { background: #000000; display: block; }

    .ui-overlay {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 8px #00e5ff;
      pointer-events: none;
    }

    .hud-val { color: #00e5ff; }

    #screen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 20, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    h1 {
      font-size: 36px;
      color: #00e5ff;
      text-shadow: 0 0 15px #00e5ff;
      letter-spacing: 2px;
    }

    p { font-size: 14px; color: #aaa; text-align: center; line-height: 1.5; }

    .btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      background: linear-gradient(180deg, #00e5ff, #0088cc);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
      transition: transform 0.1s, filter 0.2s;
      text-decoration: none;
    }
    .btn:hover { filter: brightness(1.2); transform: scale(1.05); }

    .controls-bar { margin-top: 15px; display: flex; gap: 15px; }
    .btn-save {
      background: linear-gradient(180deg, #2ecc71, #27ae60);
      color: #050505;
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
    }
    .btn-save:disabled { opacity: 0.75; cursor: wait; }
    .btn-back {
      background: linear-gradient(180deg, #ff4757, #c0392b);
      color: white;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-overlay">
      <div>PUNTOS: <span id="score-el" class="hud-val">0</span></div>
      <div>NIVEL: <span id="level-el" class="hud-val">1</span></div>
      <div>VIDAS: <span id="lives-el" class="hud-val">3</span></div>
    </div>

    <canvas id="canvas" width="600" height="600"></canvas>

    <div id="screen-overlay">
      <h1 id="title-text">GALAXY DEFENDER</h1>
      <p id="sub-text">Usa las flechas ⬅️ ➡️ o A/D para moverte.<br>Usa la barra ESPACIADORA para disparar.<br><br><strong>¡Recoge Power-Ups de Escudo y Disparo Triple!</strong></p>
      <button class="btn" id="start-btn" onclick="startGame()">JUGAR</button>
    </div>
  </div>

  <div class="controls-bar">
    <button class="btn btn-save" id="btnSaveGame" onclick="saveGameProgress()">💾 GUARDAR</button>
    <a href="juegos.html" class="btn btn-back">VOLVER AL MENÚ</a>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score-el');
    const levelEl = document.getElementById('level-el');
    const livesEl = document.getElementById('lives-el');
    const overlay = document.getElementById('screen-overlay');
    const titleText = document.getElementById('title-text');
    const subText = document.getElementById('sub-text');
    const startBtn = document.getElementById('start-btn');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      }
    }

    let isPlaying = false;
    let score = 0;
    let level = 1;
    let lives = 3;
    let keys = {};
    let lastShotTime = 0;

    let player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 50,
      w: 40,
      h: 20,
      speed: 6,
      tripleShotTimer: 0,
      shield: false
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];
    let powerUps = [];

    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 0.8 + 0.2
      });
    }

    /* SISTEMA DE GUARDADO Y CARGA */
    function saveGameProgress() {
      const activeUser = localStorage.getItem('pixelgames_session') || 'Invitado';
      const btn = document.getElementById('btnSaveGame');

      btn.innerText = "Pensando...";
      btn.disabled = true;

      setTimeout(() => {
        const users = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');
        if (!users[activeUser]) {
          users[activeUser] = { password: '', progreso: {} };
        }
        if (!users[activeUser].progreso) {
          users[activeUser].progreso = {};
        }

        users[activeUser].progreso['juego12.html'] = {
          score: score,
          level: level,
          lives: lives,
          playerX: player.x,
          shield: player.shield,
          tripleShotTimer: player.tripleShotTimer
        };

        localStorage.setItem('pixelgames_users', JSON.stringify(users));

        btn.innerText = "¡Guardado!";
        setTimeout(() => {
          btn.innerText = "💾 GUARDAR";
          btn.disabled = false;
        }, 1500);
      }, 400);
    }

    function loadSavedData() {
      const activeUser = localStorage.getItem('pixelgames_session') || 'Invitado';
      const users = JSON.parse(localStorage.getItem('pixelgames_users') || '{}');

      if (users[activeUser] && users[activeUser].progreso && users[activeUser].progreso['juego12.html']) {
        return users[activeUser].progreso['juego12.html'];
      }
      return null;
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && isPlaying) e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function createEnemies() {
      enemies = [];
      const rows = 3 + Math.min(level, 3);
      const cols = 8;
      const ew = 32;
      const eh = 24;
      const padding = 15;
      const offsetX = (canvas.width - (cols * (ew + padding))) / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: offsetX + c * (ew + padding),
            y: 60 + r * (eh + padding),
            w: ew,
            h: eh,
            type: r % 3,
            alive: true
          });
        }
      }
    }

    let enemyDir = 1;
    let enemySpeed = 1;

    function startGame() {
      score = 0;
      level = 1;
      lives = 3;
      player.x = canvas.width / 2 - player.w / 2;
      player.tripleShotTimer = 0;
      player.shield = false;
      bullets = [];
      particles = [];
      powerUps = [];
      
      scoreEl.textContent = score;
      levelEl.textContent = level;
      livesEl.textContent = lives;

      enemySpeed = 1;
      enemyDir = 1;

      createEnemies();
      overlay.style.display = 'none';
      isPlaying = true;
      requestAnimationFrame(gameLoop);
    }

    function nextLevel() {
      level++;
      levelEl.textContent = level;
      enemySpeed += 0.4;
      bullets = [];
      createEnemies();
    }

    function spawnExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          color: color
        });
      }
    }

    function update() {
      if (!isPlaying) return;

      if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 10) {
        player.x -= player.speed;
      }
      if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.w - 10) {
        player.x += player.speed;
      }

      if (player.tripleShotTimer > 0) player.tripleShotTimer--;

      const now = Date.now();
      if (keys['Space'] && now - lastShotTime > 220) {
        if (player.tripleShotTimer > 0) {
          bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 12, vx: 0, speed: 8 });
          bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 12, vx: -2, speed: 8 });
          bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 12, vx: 2, speed: 8 });
        } else {
          bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 12, vx: 0, speed: 8 });
        }
        playSound('shoot');
        lastShotTime = now;
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed;
        b.x += b.vx || 0;

        if (b.y < -10) {
          bullets.splice(i, 1);
          continue;
        }

        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (e.alive && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            e.alive = false;
            bullets.splice(i, 1);
            score += 100;
            scoreEl.textContent = score;
            spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, '#00ff88');
            playSound('hit');

            if (Math.random() < 0.12) {
              powerUps.push({
                x: e.x + e.w / 2 - 10,
                y: e.y,
                type: Math.random() > 0.5 ? 'triple' : 'shield',
                speed: 2
              });
            }
            break;
          }
        }
      }

      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.speed;

        if (p.x < player.x + player.w && p.x + 20 > player.x && p.y < player.y + player.h && p.y + 20 > player.y) {
          playSound('powerup');
          if (p.type === 'triple') player.tripleShotTimer = 400;
          if (p.type === 'shield') player.shield = true;
          powerUps.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height) powerUps.splice(i, 1);
      }

      let edgeReached = false;
      const activeEnemies = enemies.filter(e => e.alive);

      if (activeEnemies.length === 0) {
        nextLevel();
        return;
      }

      activeEnemies.forEach(e => {
        e.x += enemySpeed * enemyDir;
        if (e.x <= 10 || e.x + e.w >= canvas.width - 10) {
          edgeReached = true;
        }

        if (e.y + e.h >= player.y) {
          if (player.shield) {
            player.shield = false;
            e.alive = false;
            spawnExplosion(e.x, e.y, '#00e5ff');
            playSound('hit');
          } else {
            gameOver();
          }
        }
      });

      if (edgeReached) {
        enemyDir *= -1;
        enemies.forEach(e => e.y += 12);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }

      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = Math.random() * 0.5 + 0.3;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1;

      if (!isPlaying) return;

      if (player.shield) {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 28, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = player.tripleShotTimer > 0 ? '#ffda00' : '#00e5ff';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffda00';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = e.type === 0 ? '#ff4757' : e.type === 1 ? '#ff7f50' : '#eccc68';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 6, e.y + 6, 5, 5);
        ctx.fillRect(e.x + e.w - 11, e.y + 6, 5, 5);
      });

      powerUps.forEach(p => {
        ctx.fillStyle = p.type === 'triple' ? '#ffda00' : '#00e5ff';
        ctx.fillRect(p.x, p.y, 20, 20);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(p.type === 'triple' ? '3X' : 'S', p.x + 4, p.y + 14);
      });

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
      });
      ctx.globalAlpha = 1;
    }

    function gameOver() {
      isPlaying = false;
      playSound('gameover');
      titleText.textContent = 'GAME OVER';
      subText.innerHTML = `Puntuación Final: <strong style="color:#00e5ff">${score}</strong><br>Llegaste al Nivel: ${level}`;
      startBtn.textContent = 'REINTENTAR';
      overlay.style.display = 'flex';
    }

    function gameLoop() {
      update();
      draw();
      if (isPlaying) requestAnimationFrame(gameLoop);
    }

    /* AUTO-CARGA SI SE PULSÓ "CONTINUAR PARTIDA" EN EL MENÚ */
    const savedData = loadSavedData();
    const action = localStorage.getItem('pixelgames_action_juego12.html');

    if (action === 'load' && savedData) {
      localStorage.removeItem('pixelgames_action_juego12.html');
      score = savedData.score || 0;
      level = savedData.level || 1;
      lives = savedData.lives !== undefined ? savedData.lives : 3;
      player.x = savedData.playerX || (canvas.width / 2 - player.w / 2);
      player.shield = savedData.shield || false;
      player.tripleShotTimer = savedData.tripleShotTimer || 0;

      scoreEl.textContent = score;
      levelEl.textContent = level;
      livesEl.textContent = lives;

      enemySpeed = 1 + (level - 1) * 0.4;
      enemyDir = 1;

      createEnemies();
      overlay.style.display = 'none';
      isPlaying = true;
      requestAnimationFrame(gameLoop);
    } else {
      draw();
    }
  </script>
</body>
</html>
